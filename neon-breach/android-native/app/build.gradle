plugins { id 'com.android.application' }

android {
    namespace 'io.github.artemionov123.neonbreach.ar'
    compileSdk 34
    defaultConfig {
        // The same native ARCore shell builds several games: -PappId=... -PappName=... -PappVersion=...
        applicationId(project.findProperty('appId') ?: 'io.github.artemionov123.neonbreach.ar')
        resValue 'string', 'app_name', (project.findProperty('appName') ?: 'NEON BREACH AR+VR')
        minSdk 24
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName(project.findProperty('appVersion') ?: '2.5-ar-vr')
    }
    // Same test key as the Chrome build (see ../android). For Google Play use a secret key.
    signingConfigs {
        release {
            storeFile file('../../android/neon-breach.keystore')
            storePassword 'neonbreach'
            keyAlias 'neonbreach'
            keyPassword 'neonbreach'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.ar:core:1.41.0'
}
