name: NEON BREACH APK
# Builds the Android APK (Trusted Web Activity: the game opens in Chrome, AR works)
# and publishes it as a GitHub Release. The game itself is served by GitHub Pages
# from neon-breach/index.html.
on:
  push:
    paths: ["neon-breach/**", ".github/workflows/neon-breach-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: neon-breach/android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build APK
        run: gradle --no-daemon assembleRelease
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk NEON_BREACH.apk
      - uses: actions/upload-artifact@v4
        with: { name: NEON_BREACH-apk, path: neon-breach/android/NEON_BREACH.apk }
      - name: Publish release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "neon-breach-${{ github.run_number }}" NEON_BREACH.apk \
            --title "NEON BREACH APK #${{ github.run_number }}" \
            --notes "Скачай NEON_BREACH.apk на телефон и установи. Игра открывается через Chrome, AR работает. Нужен интернет." \
            --latest
          echo "### APK: https://github.com/${{ github.repository }}/releases/latest/download/NEON_BREACH.apk" >> $GITHUB_STEP_SUMMARY
