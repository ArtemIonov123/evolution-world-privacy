name: NEON BLOCK HANDS APK
# NEON BLOCK WORLD v3.4.7: native ARCore + MediaPipe hand tracking (project by GPT, built here).
on:
  push:
    paths: ["neon-block-hands/**", ".github/workflows/neon-block-hands-apk.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - name: Build APK (downloads hand_landmarker.task at build time)
        working-directory: neon-block-hands
        run: |
          gradle --no-daemon :app:assembleRelease 2>&1 | tee ../build-hands.log
          cp app/build/outputs/apk/release/app-release.apk ../NEON_BLOCK_WORLD_HANDS.apk
      - name: Verify signature (v1/v2/v3) and native library alignment
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          {
            echo "build-tools: $(basename "$BT")"
            echo "=== apksigner verify"
            "$BT/apksigner" verify --verbose --print-certs NEON_BLOCK_WORLD_HANDS.apk 2>&1 | grep -vi "^WARNING: META-INF" | head -n 30
            echo "=== zipalign 4-byte check"
            "$BT/zipalign" -c 4 NEON_BLOCK_WORLD_HANDS.apk && echo "zipalign 4: OK" || echo "zipalign 4: FAILED"
            echo "=== zipalign 16 KB page check for .so"
            "$BT/zipalign" -c -P 16 -v 4 NEON_BLOCK_WORLD_HANDS.apk 2>&1 | grep -E "\.so|Verification" | head -n 20 || echo "(-P not supported by this build-tools)"
            echo "=== package"
            "$BT/aapt2" dump badging NEON_BLOCK_WORLD_HANDS.apk 2>/dev/null | head -n 3
          } > VERIFY_APK.txt 2>&1 || true
          cat VERIFY_APK.txt
      - uses: actions/upload-artifact@v4
        with: { name: NEON_BLOCK_WORLD_HANDS-apk, path: NEON_BLOCK_WORLD_HANDS.apk }
      - name: Publish release (not marked latest, so other download links stay the same)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "neon-block-hands-${{ github.run_number }}" NEON_BLOCK_WORLD_HANDS.apk VERIFY_APK.txt \
            --title "NEON BLOCK WORLD v3.4.7 HANDS #${{ github.run_number }}" \
            --notes "Нативный ARCore + распознавание рук MediaPipe (тестовая версия)." --latest=false
      - name: Report failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          LOG=$(grep -v '^$' build-hands.log 2>/dev/null | grep -iE "error|fail|what went wrong|could not|>" | tail -n 60)
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -f body="Hands build failed:
          \`\`\`
          $LOG
          \`\`\`" || true
