<style>
/* Layout: full-screen game canvas on lavender; compact pixel toolbar on top (toggles fold into a menu on phones);
   round zoom/rotate controls float on the right for the thumb; status bottom-left, catch panel bottom-right (top-left on phones). */
:root{
  --sky:#a99ad6; --panel:#2d2440; --panel-2:#3d3257; --edge:#1b1528;
  --ink:#f4efff; --muted:#c9bde8; --accent:#ffd66b;
  --f-display:"Silkscreen","Courier New",monospace;
  --f-body:"PT Sans",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);overflow:hidden;display:flex;flex-direction:column;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}

/* &#x432;&#x435;&#x440;&#x445;&#x43d;&#x44f;&#x44f; &#x43f;&#x430;&#x43d;&#x435;&#x43b;&#x44c; */
.bar{position:relative;z-index:5;display:flex;align-items:center;gap:8px;background:var(--panel);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar h1{font-family:var(--f-display);font-size:15px;font-weight:400;letter-spacing:.06em;margin:0 auto 0 0;color:var(--accent);white-space:nowrap}
.btn{font-family:var(--f-display);font-size:12px;color:var(--ink);background:var(--panel-2);border:2px solid var(--edge);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);padding:6px 10px;cursor:pointer;border-radius:0;min-height:34px}
.btn:hover{background:#4b3e6b}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.lang{display:flex}
.lang .btn{padding:6px 9px}
.lang .btn+.btn{border-left:0}
.menu{display:flex;gap:8px}
#menuBtn{display:none;line-height:0;padding:6px 9px}

/* &#x441;&#x446;&#x435;&#x43d;&#x430; */
.stage{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:none;outline:none}
canvas.drag{cursor:grabbing}
.panel{background:var(--panel);border:2px solid var(--edge)}
.panel b{font-family:var(--f-display);font-weight:400;color:var(--accent);font-size:12px;letter-spacing:.05em}

/* &#x43a;&#x440;&#x443;&#x433;&#x43b;&#x44b;&#x435; &#x43a;&#x43d;&#x43e;&#x43f;&#x43a;&#x438; &#x437;&#x443;&#x43c;&#x430; &#x438; &#x43f;&#x43e;&#x432;&#x43e;&#x440;&#x43e;&#x442;&#x430; &#x441;&#x43f;&#x440;&#x430;&#x432;&#x430; */
.ctrl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px}
.round{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;padding:0;
  font-family:var(--f-body);font-weight:700;color:var(--ink);background:var(--panel);border:2px solid var(--edge);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);cursor:pointer}
.round:active{transform:translateY(1px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.round:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zoom{font-family:var(--f-display);font-size:11px;color:var(--panel);background:rgba(255,255,255,.55);padding:1px 5px}
.ctrl .gap{height:6px}

.info{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding:8px 12px;font-size:14px;line-height:1.45;max-width:min(460px,calc(100% - 32px))}

.inv .slot img{width:32px;height:32px;image-rendering:pixelated}

/* &#x440;&#x44b;&#x431;&#x430;&#x43b;&#x43a;&#x430; */
.fishbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));

.fishbar .hook{position:relative;overflow:hidden;font-size:22px;padding:16px 30px 20px;min-width:200px;background:var(--accent);color:var(--panel);
  border:3px solid var(--edge);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 0 0 4px rgba(255,214,107,.35);animation:pulse .45s ease-in-out infinite alternate}
.fishbar .hook i{position:absolute;left:0;bottom:0;height:6px;width:100%;background:#e8402c}
@keyframes pulse{to{transform:scale(1.08);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 0 0 8px rgba(255,214,107,.15)}}

/* &#x447;&#x430;&#x441;&#x44b;, &#x437;&#x434;&#x43e;&#x440;&#x43e;&#x432;&#x44c;&#x435;, &#x434;&#x435;&#x439;&#x441;&#x442;&#x432;&#x438;&#x44f;, &#x437;&#x430;&#x442;&#x435;&#x43c;&#x43d;&#x435;&#x43d;&#x438;&#x435; */

.chatbar{position:absolute;left:50%;transform:translateX(-50%);top:12px;width:min(520px,calc(100% - 280px));padding:8px;display:flex;flex-direction:column;gap:6px;z-index:5}

.detail{border-top:1px solid var(--panel-2);padding-top:8px}

  .ctrl .gap,.zoom{display:none}

  .actions,.fishbar{bottom:calc(60px + env(safe-area-inset-bottom,0px))}
  .fishbar .hook{font-size:18px;padding:10px 24px 14px;min-width:170px}
  .chatbar{top:8px;bottom:auto;width:min(440px,calc(100% - 340px));padding:6px;gap:5px}
  .chatlog{max-height:72px;font-size:12px}
  .quick .btn{font-size:12px;min-height:28px;padding:3px 7px}
  .dialog{bottom:calc(8px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 20px));padding:8px;gap:8px;z-index:6}
  #portrait{width:48px;height:48px}
  .dlg-body p{font-size:13px;margin:2px 0 6px}
  .dlg-opts{flex-direction:row;flex-wrap:wrap} .dlg-opts .btn{min-height:34px;font-size:13px}
  .nickdlg{padding:12px;gap:7px}
  .upd{top:6px}
  .hotbar{top:38px;left:max(10px,env(safe-area-inset-left,0px))}
  .hb{width:38px;height:38px} .hb img{width:28px;height:28px}
  .win{top:50%;bottom:auto;transform:translate(-50%,-50%);max-height:calc(100% - 12px);width:min(520px,calc(100% - 20px))}
  .doll{grid-template-columns:1fr 72px 1fr} .heroPrev{width:72px;height:108px}
}
@media (max-height:500px) and (max-width:640px){ .info{max-width:none;right:max(10px,env(safe-area-inset-right,0px));bottom:60px} }

.upd{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:9;display:flex;align-items:center;gap:10px;padding:7px 8px 7px 12px;
  max-width:calc(100% - 20px);box-shadow:0 4px 0 rgba(0,0,0,.25);animation:updIn .35s ease-out}
.upd span{font-size:14px;font-weight:700;color:var(--ink);white-space:nowrap}
.upd .big{background:var(--accent);color:var(--panel);min-height:38px;font-size:12px;white-space:nowrap}
@keyframes updIn{from{transform:translate(-50%,-30px);opacity:0}}
@media (prefers-reduced-motion:reduce){.upd{animation:none}}

    return {id,path,
      get:()=>r().once("value").then(s=>mkSnap(id,dec(s.val()))),
      set:d=>r().set(enc(d)),
      update:d=>r().once("value").then(s=>r().set(enc({...(dec(s.val())||{}),...d}))),
      delete:()=>r().remove(),
      onSnapshot(next,err){ const ref=r(); const h=s=>next(mkSnap(id,dec(s.val()))); ref.on("value",h,e=>err&&err(e)); return ()=>ref.off("value",h); }};
  };
  const colRef=path=>{ path=clean(path);
    return {path,doc:id=>docRef(path+"/"+id),
      onSnapshot(next,err){ const ref=base().child("db/"+path);
        const h=s=>{ const docs=[]; s.forEach(c=>{ const d=dec(c.val()); if(d!=null) docs.push(mkSnap(c.key,d)); });
          next({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}}); };
        ref.on("value",h,e=>err&&err(e)); return ()=>ref.off("value",h); }};
  };
  const db={doc:docRef,collection:colRef};

  // ---------- room (\u043a\u0442\u043e \u0441\u0435\u0439\u0447\u0430\u0441 \u0432 \u0438\u0433\u0440\u0435) ----------
  let mine={}, lastPush=0, pushTimer=null, offset=0, connected=false; const peerHs=[], connHs=[]; let all={};
  const STALE=25000;
  const snapPeers=()=>{ const now=Date.now()+offset, list=[{peer,by:uid,isMe:true,sameTab:true,kind:"viewer",guest:false,presence:mine,updatedAt:now}];
    for(const [p,v] of Object.entries(all)){ if(p===peer||!v) continue; if(typeof v.t==="number"&&now-v.t>STALE) continue;
      list.push({peer:p,by:typeof v.by==="string"?v.by:"",isMe:v.by===uid,sameTab:false,kind:"viewer",guest:false,presence:dec(v)||{},updatedAt:v.t||now}); }
    return Object.freeze(list); };
  const notify=()=>{ const ps=snapPeers(); for(const h of peerHs) try{h({peers:ps,joined:[],left:[],updated:[]});}catch(e){console.error(e);} };
  const myRef=()=>base().child("room/"+peer);
  const push=()=>{ pushTimer=null; lastPush=Date.now(); if(!getFb()) return; myRef().set({by:uid,j:JSON.stringify(mine),t:firebase.database.ServerValue.TIMESTAMP}).catch(()=>{}); };
  const schedule=()=>{ if(pushTimer) return; const wait=Math.max(0,90-(Date.now()-lastPush)); pushTimer=setTimeout(push,wait); };
  let roomStarted=false;
  const startRoom=()=>{ if(roomStarted||!getFb()) return; roomStarted=true;
    getFb().ref(".info/serverTimeOffset").on("value",s=>{offset=+s.val()||0;});
    getFb().ref(".info/connected").on("value",s=>{ connected=!!s.val(); for(const h of connHs) try{h(connected);}catch(e){}
      if(connected){ myRef().onDisconnect().remove(); push(); } });
    base().child("room").on("value",s=>{ all=s.val()||{}; notify(); },e=>{ for(const h of peerHs) if(h.err) h.err(e); });
    setInterval(()=>{ push(); notify(); },8000);                       // \u00ab\u044f \u0435\u0449\u0451 \u0437\u0434\u0435\u0441\u044c\u00bb + \u0443\u0431\u0438\u0440\u0430\u0435\u043c \u043f\u0440\u043e\u043f\u0430\u0432\u0448\u0438\u0445
    addEventListener("pagehide",()=>{ try{myRef().remove();}catch(e){} });
  };
  const room={
    presence(patch){ mine={...mine}; for(const [k,v] of Object.entries(patch||{})){ if(v===null) delete mine[k]; else mine[k]=v; } schedule(); notify(); return Promise.resolve(); },
    onPeers(h,err){ h.err=err; peerHs.push(h); startRoom(); setTimeout(notify,0); return ()=>{ const i=peerHs.indexOf(h); if(i>=0) peerHs.splice(i,1); }; },
    peers:snapPeers, connected:()=>connected,
    onConnection(h){ connHs.push(h); setTimeout(()=>h(connected),0); return ()=>{ const i=connHs.indexOf(h); if(i>=0) connHs.splice(i,1); }; },
    emit:()=>Promise.resolve(), on:()=>()=>{}
  };

  // ---------- user ----------
  const user={id:()=>Promise.resolve(uid),
    profiles:ids=>Promise.resolve(Object.fromEntries([].concat(ids).map(i=>[i,{id:i,name:"",avatarUrl:"",color:"#888",email:null,isMe:i===uid,guest:false}]))),
    me:()=>Promise.resolve({id:uid,name:"",avatarUrl:"",color:"#888",email:null,isOwner:false,canEdit:true}),
    isOwner:()=>Promise.resolve(false),canEdit:()=>Promise.resolve(true),can:()=>Promise.resolve(true)};

  window.claude={use:n=>Promise.resolve(getFb()?(n==="room"?room:n==="db"?db:n==="user"?user:null):null)};
})();
</script>

const SKY=getComputedStyle(document.documentElement).getPropertyValue("--sky").trim()||"#a99ad6";
let scale=2, panX=0, panY=0, follow=true, showGrid=false, hover=null;
function setRot(r){rot=r; const a=r*Math.PI/2; ca=Math.cos(a); sa=Math.sin(a);}
// \u0442\u043e\u0447\u043a\u0430 \u043a\u0430\u0440\u0442\u044b (X,Y \u043e\u0442 \u0446\u0435\u043d\u0442\u0440\u0430 \u0432 \u043a\u043b\u0435\u0442\u043a\u0430\u0445, Z \u0432 \u0443\u0440\u043e\u0432\u043d\u044f\u0445) -> \u043c\u0438\u0440\u043e\u0432\u044b\u0435 \u043f\u0438\u043a\u0441\u0435\u043b\u0438
const proj=(X,Y,Z)=>{const u=X*ca-Y*sa, v=X*sa+Y*ca; return [(u-v)*HW, (u+v)*HH-(Z-1)*LH]};
const depthOf=(X,Y)=>{const u=X*ca-Y*sa, v=X*sa+Y*ca; return u+v};
const quarter=()=>((Math.round(rot)%4)+4)%4;
const rotQ=(v,q)=>{let [a,b]=v;for(let i=0;i<q;i++)[a,b]=[-b,a];return [a,b]};

// ---------- \u0413\u0435\u0440\u043e\u0439 ----------
const hero={x:MAP.start[0], y:MAP.start[1], z:0, path:[], facing:"se", phase:0, moving:false};
hero.z=walkZ(cellAt(hero.x,hero.y));
let marker=null; // {x,y,t,ok}
const HERO_SPEED=2.8; // \u043a\u043b\u0435\u0442\u043e\u043a \u0432 \u0441\u0435\u043a\u0443\u043d\u0434\u0443

// \u043f\u043e\u0438\u0441\u043a \u043f\u0443\u0442\u0438: A* \u043f\u043e 8 \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u044f\u043c, \u043f\u043e\u0434\u044a\u0451\u043c/\u0441\u043f\u0443\u0441\u043a \u043d\u0435 \u0431\u043e\u043b\u044c\u0448\u0435 1 \u0443\u0440\u043e\u0432\u043d\u044f
function canStep(a,b){ return b && !b.blocked && Math.abs(walkZ(a)-walkZ(b))<=1; }
function findPath(sx,sy,tx,ty){
  const start=cellAt(sx,sy), goal=cellAt(tx,ty); if(!start||!goal) return null;
  const key=c=>c.y*W+c.x, open=[[0,start]], g=new Map([[key(start),0]]), prev=new Map();
  const h=c=>{const dx=Math.abs(c.x-goal.x), dy=Math.abs(c.y-goal.y); return Math.max(dx,dy)+0.414*Math.min(dx,dy)};
  while(open.length){
    let bi=0; for(let i=1;i<open.length;i++) if(open[i][0]<open[bi][0]) bi=i;
    const [,cur]=open.splice(bi,1)[0];
    if(cur===goal) break;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy) continue;
      const nb=cellAt(cur.x+dx,cur.y+dy); if(!canStep(cur,nb)) continue;
      if(dx&&dy){ // \u043f\u043e \u0434\u0438\u0430\u0433\u043e\u043d\u0430\u043b\u0438 \u2014 \u0442\u043e\u043b\u044c\u043a\u043e \u0435\u0441\u043b\u0438 \u043e\u0431\u0430 \u0431\u043e\u043a\u043e\u0432\u044b\u0445 \u043f\u0440\u043e\u0445\u043e\u0434\u0430 \u0441\u0432\u043e\u0431\u043e\u0434\u043d\u044b
        const s1=cellAt(cur.x+dx,cur.y), s2=cellAt(cur.x,cur.y+dy);
        if(!canStep(cur,s1)||!canStep(cur,s2)||!canStep(s1,nb)||!canStep(s2,nb)) continue;
      }
      const cost=g.get(key(cur))+(dx&&dy?1.414:1)+Math.abs(walkZ(nb)-walkZ(cur))*0.3;
      if(cost<(g.get(key(nb))??1e9)){g.set(key(nb),cost);prev.set(key(nb),cur);open.push([cost+h(nb),nb]);}
    }
  }
  if(!prev.has(key(goal)) && start!==goal) return null;
  const path=[goal]; while(path[0]!==start) path.unshift(prev.get(key(path[0])));
  return smooth(path.map(c=>[c.x,c.y]));
}
// \u043f\u0440\u044f\u043c\u0430\u044f \u0432\u0438\u0434\u0438\u043c\u043e\u0441\u0442\u044c \u043c\u0435\u0436\u0434\u0443 \u0442\u043e\u0447\u043a\u0430\u043c\u0438: \u043a\u043b\u0435\u0442\u043a\u0438 \u043f\u0440\u043e\u0445\u043e\u0434\u0438\u043c\u044b \u0438 \u0431\u0435\u0437 \u043e\u0431\u0440\u044b\u0432\u043e\u0432
function clearLine(a,b){
  const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])*6);
  let prevC=cellAt(Math.round(a[0]),Math.round(a[1]));
  for(let i=1;i<=n;i++){
    const t=i/n, px=a[0]+(b[0]-a[0])*t, py=a[1]+(b[1]-a[1])*t;
    // \u0437\u0430\u043f\u0430\u0441 0.3 \u043a\u043b\u0435\u0442\u043a\u0438 \u043f\u043e \u0431\u043e\u043a\u0430\u043c, \u0447\u0442\u043e\u0431\u044b \u043d\u0435 \u0446\u0435\u043f\u043b\u044f\u0442\u044c \u0434\u0435\u0440\u0435\u0432\u044c\u044f
    for(const [ox,oy] of [[0,0],[0.3,0.3],[-0.3,-0.3],[0.3,-0.3],[-0.3,0.3]]){
      const c=cellAt(Math.round(px+ox),Math.round(py+oy));
      if(!c||c.blocked) return false;
    }
    const c=cellAt(Math.round(px),Math.round(py));
    if(c!==prevC){ if(!canStep(prevC,c)) return false; prevC=c; }
  }
  return true;
}
// \u0441\u0433\u043b\u0430\u0436\u0438\u0432\u0430\u043d\u0438\u0435: \u0438\u0434\u0451\u043c \u043f\u043e \u043f\u0440\u044f\u043c\u043e\u0439, \u0433\u0434\u0435 \u043c\u043e\u0436\u043d\u043e (\u043a\u0430\u043a \u0432 Lineage 2)
function smooth(pts){
  const out=[pts[0]]; let i=0;
  while(i<pts.length-1){
    let j=pts.length-1;
    while(j>i+1 && !clearLine(pts[i],pts[j])) j--;
    out.push(pts[j]); i=j;
  }
  return out.slice(1);
}
function goTo(c){
  if(!c) return;
  stopFishing(); stopChopping(); closeDialog(); hero.pendingTalk=false; hero.pendingAction=null; building=null; hero.target=null;
  if(fainting) return;
  if(typeof c==="object"&&c.kind==="wolf"){ if(placing) return; attackWolf(c); return; }
  if(placing){ if(c&&typeof c==="object") placeFireAt(c); return; }
  if(typeof c==="object"&&c.fire){ goAdjacent(c,()=>openFireMenu(c.fire),"go_fire"); return; }
  if(c==="npc"||c==="hut"||c.hutPart||c.npcHere){ goTalk(); return; }
  if(c.water){ goFish(c); return; }
  if(treeName(c)){ goChop(c); return; }
  let target=c;
  if(c.blocked){ // \u043a\u043b\u0438\u043a\u043d\u0443\u043b\u0438 \u043f\u043e \u0434\u0435\u0440\u0435\u0432\u0443 \u2014 \u0438\u0434\u0451\u043c \u043a \u0431\u043b\u0438\u0436\u0430\u0439\u0448\u0435\u0439 \u0441\u0432\u043e\u0431\u043e\u0434\u043d\u043e\u0439 \u043a\u043b\u0435\u0442\u043a\u0435 \u0440\u044f\u0434\u043e\u043c
    let best=null,bd=1e9;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const n=cellAt(c.x+dx,c.y+dy); if(!n||n.blocked) continue;
      const d=Math.hypot(n.x-hero.x,n.y-hero.y); if(d<bd){bd=d;best=n}
    }
    if(!best){marker={x:c.x,y:c.y,t:0,ok:false};return}
    target=best;
  }
  const from=[Math.round(hero.x),Math.round(hero.y)];
  const p=findPath(from[0],from[1],target.x,target.y);
  if(!p){marker={x:c.x,y:c.y,t:0,ok:false};say("blocked");return}
  // \u043f\u0435\u0440\u0432\u0430\u044f \u0442\u043e\u0447\u043a\u0430 \u2014 \u0442\u0435\u043a\u0443\u0449\u0430\u044f \u043f\u043e\u0437\u0438\u0446\u0438\u044f \u0433\u0435\u0440\u043e\u044f (\u043e\u043d \u043c\u043e\u0436\u0435\u0442 \u0441\u0442\u043e\u044f\u0442\u044c \u043c\u0435\u0436\u0434\u0443 \u043a\u043b\u0435\u0442\u043a\u0430\u043c\u0438)
  hero.path=p.length?p:[[target.x,target.y]];
  marker={x:target.x,y:target.y,t:0,ok:true};
  follow=true; document.getElementById("follow").setAttribute("aria-pressed","true");
  say("going","going_sub",{x:target.x,y:target.y,h:target.L,kind:"#"+(target.st?"k_st":"k_"+target.t)});
}
function updateHero(dt){
  hero.moving=false;
  if(hero.path.length){
    const [tx,ty]=hero.path[0], dx=tx-hero.x, dy=ty-hero.y, dist=Math.hypot(dx,dy);
    const step=HERO_SPEED*dt;
    if(dist<=step){hero.x=tx;hero.y=ty;hero.path.shift(); if(!hero.path.length){marker=null;if(!hero.target) say("arrived","arrived_sub",{x:tx,y:ty});
      if(hero.pendingFish){const w=hero.pendingFish.water; hero.pendingFish=null; startFishing(w);}
      if(hero.pendingChop){const t=hero.pendingChop.tree; hero.pendingChop=null; startChopping(t);}
      if(hero.pendingTalk){hero.pendingTalk=false; openDialog();}
      if(hero.pendingAction){const fn=hero.pendingAction; hero.pendingAction=null; fn();}}}
    else{hero.x+=dx/dist*step;hero.y+=dy/dist*step}
    if(dist>0.001){
      hero.moving=true;
      // \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u043d\u0430 \u044d\u043a\u0440\u0430\u043d\u0435 \u0441 \u0443\u0447\u0451\u0442\u043e\u043c \u043f\u043e\u0432\u043e\u0440\u043e\u0442\u0430
      const u=dx*ca-dy*sa, v=dx*sa+dy*ca, sx=u-v, sy=u+v;
      hero.facing=(sy>=0?"s":"n")+(sx>=0?"e":"w");
    }
  }
  hero.phase = hero.moving ? hero.phase+dt*HERO_SPEED*Math.PI*1.6 : 0;
  const c=cellAt(Math.round(hero.x),Math.round(hero.y));
  if(c) hero.z += (walkZ(c)-hero.z)*Math.min(1,dt*14);  // \u043c\u044f\u0433\u043a\u0438\u0439 \u0448\u0430\u0433 \u043d\u0430 \u0441\u0442\u0443\u043f\u0435\u043d\u044c\u043a\u0443
}

let hutAnchor=null;
function drawOrder(){
  for(const c of cells) c.depth=depthOf(c.x-MX,c.y-MY);
  cells.sort((a,b)=>a.depth-b.depth || (a.x-a.y)-(b.x-b.y));
  if(HUT) hutAnchor=HUT.cells.reduce((a,b)=>b.depth>a.depth?b:a);
  // \u0433\u0435\u0440\u043e\u0439 \u0440\u0438\u0441\u0443\u0435\u0442\u0441\u044f \u043f\u043e\u0441\u043b\u0435 \u0441\u0430\u043c\u043e\u0439 \u0431\u043b\u0438\u0436\u043d\u0435\u0439 \u043a \u043a\u0430\u043c\u0435\u0440\u0435 \u043a\u043b\u0435\u0442\u043a\u0438 \u0438\u0437 \u0442\u0435\u0445, \u043d\u0430 \u043a\u043e\u0442\u043e\u0440\u044b\u0445 \u043e\u043d \u0441\u0442\u043e\u0438\u0442
  let anchor=null;
  for(const [ox,oy] of [[0,0],[.45,0],[-.45,0],[0,.45],[0,-.45]]){
    const c=cellAt(Math.round(hero.x+ox),Math.round(hero.y+oy));
    if(c&&(!anchor||c.depth>anchor.depth)&&Math.abs(walkZ(c)-hero.z)<1.2) anchor=c;
  }
  return anchor;
}

// \u043a\u043b\u0435\u0442\u043a\u0430 \u043f\u043e\u043f\u0430\u0434\u0430\u0435\u0442 \u043d\u0430 \u044d\u043a\u0440\u0430\u043d? (\u0441 \u0437\u0430\u043f\u0430\u0441\u043e\u043c \u043d\u0430 \u0434\u0435\u0440\u0435\u0432\u044c\u044f \u0432\u0432\u0435\u0440\u0445 \u0438 \u0441\u0442\u0435\u043d\u043a\u0438 \u0432\u043d\u0438\u0437)
function cellVisible(c){
  const p=proj(c.x-MX,c.y-MY,c.L), x=p[0]+ROX, y=p[1]+ROY, w=ctx.canvas.width, h=ctx.canvas.height;
  return x>-80 && x<w+80 && y+c.L*LH+50>0 && y-140<h;
}
function stairSprite(dir,q){
  const [a,b]=rotQ(STAIR_DIR[dir],q);
  if(a===-1) return "stairs_left";
  if(b===-1) return "stairs_right";
  const back=a===1?"stairs_back_left":"stairs_back_right";
  return img[back]?back:"block_stone_path";
}

function drawSprites(anchor){
  worldTransform(); ctx.imageSmoothingEnabled=false;
  const q=quarter();
  for(const c of cells){
    if(c!==anchor&&c!==hutAnchor&&c!==NPCC&&!cellVisible(c)) continue;
    const X=c.x-MX, Y=c.y-MY;
    for(let z=0;z<c.L;z++){
      if(c.water&&z===c.L-1) continue;
      const p=proj(X,Y,z+1), top=z===c.L-1;
      const name=top?TOP_SPRITE[c.t]:(z<2?"block_rock":"block_grass");
      ctx.drawImage(img[name],Math.round(p[0]-HW),Math.round(p[1]-HH-TOP_Y));
    }
    if(c.st){const p=proj(X,Y,c.L+1); ctx.drawImage(img[stairSprite(c.st,q)],Math.round(p[0]-HW),Math.round(p[1]-HH-TOP_Y));}
    if(c.water){ drawWater(c); drawWaterFx(c); }
    if(c.leaves.length) drawLandedLeaves(c);
    if(c.fire) drawFire(c);
    if(c.stump) drawStump(c);
    if(c.props.length){
      const p=proj(X,Y,c.L);
      for(const name of c.props){
        let n=name; if(q%2===1){ if(n==="fence_left") n="fence_right"; else if(n==="fence_right") n="fence_left"; }
        drawProp(img[n],n,p[0],p[1],c);
      }
    }
    if(c===anchor) drawHero();
    if(HUT&&c===hutAnchor) drawHut();
    if(npc&&c===NPCC) drawNPC();
    if(c.ents) for(const a of c.ents) drawEnt(a);
  }
}

// ================= \u0412\u0435\u0442\u0435\u0440 \u0438 \u043b\u0438\u0441\u0442\u044c\u044f =================
let T=0, windOn=!matchMedia("(prefers-reduced-motion: reduce)").matches;
const WIND=[1,-0.45];                         // \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u0435 \u0432\u0435\u0442\u0440\u0430 \u043d\u0430 \u043a\u0430\u0440\u0442\u0435 (\u043d\u0435 \u0437\u0430\u0432\u0438\u0441\u0438\u0442 \u043e\u0442 \u043f\u043e\u0432\u043e\u0440\u043e\u0442\u0430 \u043a\u0430\u043c\u0435\u0440\u044b)
const SWAY={tree_big:4, tree_small:3, bush:1, grass_tuft:1.5, grass_tuft_2:1.5};
// \u0441\u0438\u043b\u0430 \u0432\u0435\u0442\u0440\u0430 0..1: \u0441\u043f\u043e\u043a\u043e\u0439\u043d\u044b\u0439 \u0444\u043e\u043d + \u043f\u043e\u0440\u044b\u0432\u044b
function windAt(t){
  const g=Math.sin(t*0.45)*0.6+Math.sin(t*0.17+1)*0.5+Math.sin(t*1.1+2)*0.2;
  return Math.max(0,Math.min(1,0.3+0.7*Math.max(0,g)));
}
// \u043a\u0443\u0434\u0430 \u0432\u0435\u0442\u0435\u0440 \u0434\u0443\u0435\u0442 \u043d\u0430 \u044d\u043a\u0440\u0430\u043d\u0435 (\u043f\u043e \u0433\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430\u043b\u0438), \u0441 \u0443\u0447\u0451\u0442\u043e\u043c \u043f\u043e\u0432\u043e\u0440\u043e\u0442\u0430 \u043a\u0430\u0440\u0442\u044b
function windScreenX(){const u=WIND[0]*ca-WIND[1]*sa, v=WIND[0]*sa+WIND[1]*ca; return (u-v)/1.45}
// \u043e\u0442\u043a\u043b\u043e\u043d\u0435\u043d\u0438\u0435 \u0432\u0435\u0440\u0445\u0443\u0448\u043a\u0438 \u0432 \u043f\u0438\u043a\u0441\u0435\u043b\u044f\u0445 \u0434\u043b\u044f \u043e\u0431\u044a\u0435\u043a\u0442\u0430 \u0432 \u043a\u043b\u0435\u0442\u043a\u0435 (x,y): \u043f\u043e\u0440\u044b\u0432 \u0438\u0434\u0451\u0442 \u043f\u043e \u043a\u0430\u0440\u0442\u0435 \u0432\u043e\u043b\u043d\u043e\u0439
function swayAt(x,y,amp){
  if(!windOn) return 0;
  const w=windAt(T-(x+y)*0.12);
  return amp*(windScreenX()*w*(0.65+0.35*Math.sin(T*2.6+x*1.7+y*1.3)) + 0.25*Math.sin(T*1.3+x*2.1+y*0.7));
}

const TREES=[]; // \u043a\u043b\u0435\u0442\u043a\u0438 \u0441 \u0434\u0435\u0440\u0435\u0432\u044c\u044f\u043c\u0438

function updateWind(dt){

  // \u0441\u0440\u044b\u0432\u0430\u0435\u043c \u043b\u0438\u0441\u0442\u044c\u044f \u0441 \u043a\u0440\u043e\u043d: \u0447\u0435\u043c \u0441\u0438\u043b\u044c\u043d\u0435\u0435 \u0432\u0435\u0442\u0435\u0440, \u0442\u0435\u043c \u0447\u0430\u0449\u0435
  for(const tr of TREES){
    if(leaves.length>260) break;
    if(tr.c.grow<0.6||tr.c.falling) continue;
    if(Math.random()<dt*(0.2+1.2*w*w)){
      leaves.push({x:tr.c.x+(Math.random()-.5)*0.7, y:tr.c.y+(Math.random()-.5)*0.7,
        z:walkZ(tr.c)*LH+(tr.big?50+Math.random()*50:38+Math.random()*38),
        ph:Math.random()*6.28, spin:3+Math.random()*4, fall:9+Math.random()*7,
        col:LEAF_COLORS[(Math.random()*LEAF_COLORS.length)|0], drift:0.6+Math.random()*0.6});
    }
  }
  for(let i=leaves.length-1;i>=0;i--){
    const L=leaves[i], wl=windAt(T-(L.x+L.y)*0.12);

    const flut=Math.sin(L.ph)*0.35;
    L.x+=(WIND[0]*wl*L.drift + WIND[1]*flut*0.5)*dt;
    L.y+=(WIND[1]*wl*L.drift - WIND[0]*flut*0.5)*dt;

    const c=cellAt(Math.round(L.x),Math.round(L.y)), gz=c?walkZ(c)*LH:-80;
    if(L.z<=gz){
      leaves.splice(i,1);
      if(c&&(!c.blocked||c.water)&&c.leaves.length<8) c.leaves.push({x:L.x,y:L.y,col:L.col,life:5+Math.random()*4,w:1+(Math.random()*2|0)});
    }
  }

  // \u0448\u0442\u0440\u0438\u0445\u0438 \u0432\u0435\u0442\u0440\u0430 \u0432 \u0441\u0438\u043b\u044c\u043d\u044b\u0439 \u043f\u043e\u0440\u044b\u0432
  if(w>0.55&&streaks.length<10&&Math.random()<dt*3*(w-0.5)){
    const c=cells[(Math.random()*cells.length)|0];
    streaks.push({x:c.x-2, y:c.y+1, z:walkZ(c)*LH+15+Math.random()*45, t:0, life:1+Math.random()*0.6, len:10+Math.random()*12});
  }
  for(let i=streaks.length-1;i>=0;i--){const s=streaks[i]; s.t+=dt; s.x+=WIND[0]*2.6*dt; s.y+=WIND[1]*2.6*dt; if(s.t>=s.life) streaks.splice(i,1);}
}

function drawLandedLeaves(c){

// \u043b\u0435\u0442\u044f\u0449\u0438\u0435 \u043b\u0438\u0441\u0442\u044c\u044f \u0438 \u0448\u0442\u0440\u0438\u0445\u0438 \u0432\u0435\u0442\u0440\u0430 \u2014 \u043f\u043e\u0432\u0435\u0440\u0445 \u0441\u0446\u0435\u043d\u044b

    const p=proj(L.x-MX,L.y-MY,L.z/LH), w=1+Math.round(Math.abs(Math.sin(L.ph))*3), x=Math.round(p[0]-w/2), y=Math.round(p[1]);

const hash=(x,y,k)=>{const s=Math.sin(x*127.1+y*311.7+k*74.7)*43758.5453;return s-Math.floor(s)};
const DIRS4=[[1,0],[0,1],[-1,0],[0,-1]];
const EDGE_CORNERS=[[1,2],[2,3],[3,0],[0,1]]; // \u043a\u0430\u043a\u0438\u0435 \u0443\u0433\u043b\u044b \u0440\u043e\u043c\u0431\u0430 \u043e\u0431\u0440\u0430\u0437\u0443\u044e\u0442 \u0441\u0442\u043e\u0440\u043e\u043d\u0443 +x, +y, -x, -y
function drawWater(c){

  const q=[proj(X-e,Y-e,Z),proj(X+e,Y-e,Z),proj(X+e,Y+e,Z),proj(X-e,Y+e,Z)];
  ctx.fillStyle=shore?"#4a95d4":"#3c84c8";
  ctx.beginPath();ctx.moveTo(...q[0]);for(let i=1;i<4;i++)ctx.lineTo(...q[i]);ctx.closePath();ctx.fill();
  // \u0431\u043b\u0438\u043a\u0438: \u043a\u043e\u0440\u043e\u0442\u043a\u0438\u0435 \u0441\u0432\u0435\u0442\u043b\u044b\u0435 \u0447\u0435\u0440\u0442\u043e\u0447\u043a\u0438 \u043c\u0435\u0434\u043b\u0435\u043d\u043d\u043e \u043f\u043b\u044b\u0432\u0443\u0442 \u0438 \u043c\u0435\u0440\u0446\u0430\u044e\u0442
  for(let k=0;k<4;k++){
    const hx=hash(c.x,c.y,k), hy=hash(c.x,c.y,k+9);
    const u=(((hx+T*0.05*(k%2?1:-1))%1)+1)%1;
    const p=proj(X-0.42+0.84*u, Y-0.42+0.84*hy, Z), a=Math.max(0,Math.sin(T*1.7+hx*20))*0.75;
    ctx.fillStyle=`rgba(205,238,255,${a})`; ctx.fillRect(Math.round(p[0]-2),Math.round(p[1]),3+(k%2)*2,1);
  }
  // \u043f\u0435\u043d\u0430 \u0443 \u0431\u0435\u0440\u0435\u0433\u0430
  const cr=[proj(X-.5,Y-.5,Z),proj(X+.5,Y-.5,Z),proj(X+.5,Y+.5,Z),proj(X-.5,Y+.5,Z)];

function catchFish(){
  if(!fishing||fishing.state!=="bite") return;
  const f=fishing; f.fish=pickFish(); f.state="reel"; f.t=0;
  for(let i=0;i<3;i++) ripples.push({x:f.bx,y:f.by,z:walkZ(f.water),t:-i*0.12,big:true});
  say("hooked",null,{fish:"#fish_"+f.fish.id});
}
function updateFishing(dt){
  for(let i=ripples.length-1;i>=0;i--){ripples[i].t+=dt; if(ripples[i].t>1.4) ripples.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){floats[i].t+=dt; if(floats[i].t>1.8) floats.splice(i,1);}
  if(!fishing) return;
  const f=fishing; f.t+=dt; faceTo(f.bx,f.by);
  const z=walkZ(f.water);
  if(f.state==="cast"&&f.t>=0.55){
    f.state="wait"; f.t=0; f.timer=waitTime(); ripples.push({x:f.bx,y:f.by,z,t:0});
    say("waiting","waiting_sub");
  } else if(f.state==="wait"){
    if(Math.random()<dt*0.6) ripples.push({x:f.bx,y:f.by,z,t:0,small:true});
    if(f.t>=f.timer){ f.state="bite"; f.t=0; f.timer=1.4+Math.random()*0.6; ripples.push({x:f.bx,y:f.by,z,t:0});
      say("bite","bite_sub"); }
  } else if(f.state==="bite"&&f.t>=f.timer){
    floats.push({key:"lost",col:"#ffb4a0",t:0});
    f.state="wait"; f.t=0; f.timer=waitTime(); say("lost_st");
  } else if(f.state==="reel"&&f.t>=0.75){
    inv[f.fish.id]=(inv[f.fish.id]||0)+1; renderInv();
    if(f.fish.id!=="boot") prog.st.fish++; addXP(f.fish.id==="gold"?10:f.fish.id==="boot"?1:f.fish.id==="shchuka"?4:2,"fish");
    floats.push({key:"plus",p:{n:1,fish:"#fish_"+f.fish.id},col:f.fish.id==="gold"?"#ffd66b":f.fish.id==="boot"?"#d8c0a8":"#ffffff",t:0});
    say("caught","caught_sub",{fish:"#fish_"+f.fish.id});
    f.state="pause"; f.t=0;
  } else if(f.state==="pause"&&f.t>=0.9){
    startFishing(f.water);
  }
}
// \u043f\u0430\u043d\u0435\u043b\u044c \u0440\u044b\u0431\u0430\u043b\u043a\u0438: \u00ab\u041f\u043e\u0434\u0441\u0435\u0447\u044c!\u00bb \u0442\u043e\u043b\u044c\u043a\u043e \u0432\u043e \u0432\u0440\u0435\u043c\u044f \u043f\u043e\u043a\u043b\u0451\u0432\u043a\u0438, \u00ab\u0421\u043c\u043e\u0442\u0430\u0442\u044c \u0443\u0434\u043e\u0447\u043a\u0443\u00bb \u2014 \u043f\u043e\u043a\u0430 \u0440\u044b\u0431\u0430\u0447\u0438\u043c
let uiState=null;
function syncFishUI(){
  const st=fishing?fishing.state:null;
  if(st!==uiState){
    uiState=st;
    document.getElementById("fishbar").hidden=!st;
    document.getElementById("hook").hidden=st!=="bite";
  }
  if(st==="bite") document.getElementById("hookTime").style.width=Math.max(0,1-fishing.t/fishing.timer)*100+"%";
}
// \u0433\u0434\u0435 \u0441\u0435\u0439\u0447\u0430\u0441 \u043f\u043e\u043f\u043b\u0430\u0432\u043e\u043a \u043d\u0430 \u0432\u043e\u0434\u0435 (\u0432\u043e \u0432\u0440\u0435\u043c\u044f \u043e\u0436\u0438\u0434\u0430\u043d\u0438\u044f \u0438 \u043f\u043e\u043a\u043b\u0451\u0432\u043a\u0438)
function bobberOnWater(){
  const f=fishing; if(!f||(f.state!=="wait"&&f.state!=="bite")) return null;
  const b=proj(f.bx-MX,f.by-MY,walkZ(f.water));
  if(f.state==="bite") return {x:b[0]+(Math.sin(T*25)>0?1:0), y:b[1]+2, under:Math.sin(T*9)>0.2};
  return {x:b[0], y:b[1]+Math.round(Math.sin(T*3)*0.7), under:false};
}
function drawBobber(x,y,under){
  const bx=Math.round(x), by=Math.round(y);
  ctx.fillStyle="#1b1528"; ctx.fillRect(bx-2,by-3,5,5);
  ctx.fillStyle="#e8402c"; ctx.fillRect(bx-1,by-2,3,2);
  if(!under){ ctx.fillStyle="#ffffff"; ctx.fillRect(bx-1,by,3,1); }
  else { ctx.fillStyle="#4a95d4"; ctx.fillRect(bx-2,by,5,2); }
}
// \u043a\u0440\u0443\u0433\u0438 \u0438 \u043f\u043e\u043f\u043b\u0430\u0432\u043e\u043a, \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u043b\u0435\u0436\u0430\u0442 \u043d\u0430 \u044d\u0442\u043e\u0439 \u043a\u043b\u0435\u0442\u043a\u0435 \u0432\u043e\u0434\u044b
function drawWaterFx(c){
  for(const r of ripples){
    if(r.t<0||cellAt(Math.round(r.x),Math.round(r.y))!==c) continue;
    const k=r.t/1.4, rad=(r.small?0.05:0.08)+k*(r.big?0.5:r.small?0.18:0.32), a=(1-k)*(r.small?0.4:0.7);
    ctx.beginPath();
    for(let i=0;i<=20;i++){const an=i/20*Math.PI*2, p=proj(r.x-MX+Math.cos(an)*rad,r.y-MY+Math.sin(an)*rad,r.z); i?ctx.lineTo(...p):ctx.moveTo(...p);}
    ctx.strokeStyle=`rgba(230,246,255,${a})`; ctx.lineWidth=1; ctx.stroke();
  }
  if(fishing&&cellAt(Math.round(fishing.bx),Math.round(fishing.by))===c){
    const b=bobberOnWater(); if(b) drawBobber(b.x,b.y,b.under);
  }
}
// \u043b\u0438\u043d\u0438\u044f \u043f\u043e \u043f\u0438\u043a\u0441\u0435\u043b\u044f\u043c (\u0447\u0451\u0442\u043a\u0430\u044f \u0432 \u043f\u0438\u043a\u0441\u0435\u043b\u044c-\u0430\u0440\u0442\u0435)
function pixLine(x0,y0,x1,y1,col){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1; let err=dx+dy;
  ctx.fillStyle=col;
  for(let i=0;i<400;i++){ ctx.fillRect(x0,y0,1,1); if(x0===x1&&y0===y1) break; const e2=2*err; if(e2>=dy){err+=dy;x0+=sx} if(e2<=dx){err+=dx;y0+=sy} }
}
function drawFishing(){
  worldTransform(); ctx.imageSmoothingEnabled=false;
  const [fx,fy]=proj(hero.x-MX,hero.y-MY,hero.z);
  if(fishing){
    const f=fishing, dir=hero.facing[1]==="e"?1:-1, z=walkZ(f.water);
    const hand=[fx+dir*6, fy-20];
    let tip=[fx+dir*17, fy-37];
    if(f.state==="cast"&&f.t<0.2) tip=[fx-dir*5, fy-41];            // \u0437\u0430\u043c\u0430\u0445 \u043d\u0430\u0437\u0430\u0434
    if(f.state==="bite") tip=[fx+dir*18, fy-31+(Math.sin(T*40)>0?1:0)]; // \u0443\u0434\u043e\u0447\u043a\u0443 \u0442\u044f\u043d\u0435\u0442
    if(f.state==="reel"&&f.t<0.4) tip=[fx+dir*9, fy-43];             // \u043f\u043e\u0434\u0441\u0435\u0447\u043a\u0430 \u0432\u0432\u0435\u0440\u0445
    const b=proj(f.bx-MX,f.by-MY,z);
    const onW=bobberOnWater(); let bob=onW?[onW.x,onW.y]:[b[0],b[1]];
    if(f.state==="cast"){ const k=Math.max(0,(f.t-0.2)/0.35); bob=k<=0?tip:[tip[0]+(b[0]-tip[0])*Math.min(1,k), tip[1]+(b[1]-tip[1])*Math.min(1,k)-Math.sin(Math.min(1,k)*Math.PI)*22]; }
    if(f.state==="reel"||f.state==="pause") bob=tip;
    pixLine(hand[0],hand[1]+1,tip[0],tip[1]+1,"#2a1608");   // \u0443\u0434\u043e\u0447\u043a\u0430 \u0441 \u0442\u0451\u043c\u043d\u043e\u0439 \u043a\u0440\u043e\u043c\u043a\u043e\u0439
    pixLine(hand[0],hand[1],tip[0],tip[1],"#9a6430");
    ctx.fillStyle="#d8d0c0"; ctx.fillRect(Math.round(tip[0]),Math.round(tip[1]),1,1);
    // \u043b\u0435\u0441\u043a\u0430 \u0441 \u043f\u0440\u043e\u0432\u0438\u0441\u043e\u043c
    ctx.fillStyle="rgba(255,255,255,.75)";
    const mx=(tip[0]+bob[0])/2, my=Math.max(tip[1],bob[1])+(f.state==="bite"?-2:6);
    let px=tip[0],py=tip[1];
    for(let i=1;i<=24;i++){const t=i/24, x=(1-t)*(1-t)*tip[0]+2*(1-t)*t*mx+t*t*bob[0], y=(1-t)*(1-t)*tip[1]+2*(1-t)*t*my+t*t*bob[1];
      pixLine(px,py,x,y,"rgba(255,255,255,.7)"); px=x; py=y;}
    // \u043f\u043e\u043f\u043b\u0430\u0432\u043e\u043a
    const bx=Math.round(bob[0]), by=Math.round(bob[1]);
    if(f.state==="cast") drawBobber(bx,by,false);   // \u0432 \u043f\u043e\u043b\u0451\u0442\u0435 \u2014 \u043f\u043e\u0432\u0435\u0440\u0445 \u0432\u0441\u0435\u0433\u043e
    // \u00ab!\u00bb \u043d\u0430\u0434 \u0433\u043e\u043b\u043e\u0432\u043e\u0439
    if(f.state==="bite"){
      const ey=Math.round(fy-60-Math.abs(Math.sin(T*10))*3), ex=Math.round(fx);
      ctx.fillStyle="#1b1528"; ctx.fillRect(ex-2,ey-1,5,10);
      ctx.fillStyle="#ffd66b"; ctx.fillRect(ex-1,ey,3,5); ctx.fillRect(ex-1,ey+6,3,2);
    }
    // \u0440\u044b\u0431\u0430 \u043b\u0435\u0442\u0438\u0442 \u0438\u0437 \u0432\u043e\u0434\u044b \u0432 \u0440\u0443\u043a\u0438
    if(f.state==="reel"){
      const k=Math.min(1,f.t/0.75), ic=ICONS[f.fish.id];
      const x=b[0]+(fx-b[0])*k, y=b[1]+(fy-34-b[1])*k-Math.sin(k*Math.PI)*28;
      ctx.drawImage(ic,Math.round(x-12),Math.round(y-12),24,24);
    }
  }
  // \u0432\u0441\u043f\u043b\u044b\u0432\u0430\u044e\u0449\u0438\u0435 \u043d\u0430\u0434\u043f\u0438\u0441\u0438
  ctx.font="8px Silkscreen, monospace"; ctx.textAlign="center"; ctx.textBaseline="bottom";
  floats.forEach((fl,i)=>{
    const y=Math.round(fy-52-fl.t*16-i*11), a=Math.min(1,(1.8-fl.t)/0.5);
    ctx.globalAlpha=a; ctx.lineWidth=3; ctx.strokeStyle="#1b1528"; const txt=tr(fl.key,fl.p); ctx.strokeText(txt,Math.round(fx),y);
    ctx.fillStyle=fl.col; ctx.fillText(txt,Math.round(fx),y); ctx.globalAlpha=1;
  });
}


// ================= \u0420\u0443\u0431\u043a\u0430 \u0434\u0435\u0440\u0435\u0432\u044c\u0435\u0432 =================
const HITS={tree_big:5, tree_small:3}, LOGS={tree_big:3, tree_small:2};
const SWING=0.75, IMPACT=0.5;           // \u043e\u0434\u0438\u043d \u0432\u0437\u043c\u0430\u0445 \u0442\u043e\u043f\u043e\u0440\u0430 \u0438 \u043c\u043e\u043c\u0435\u043d\u0442 \u0443\u0434\u0430\u0440\u0430 (\u0441\u0435\u043a)
for(const c of cells) c.grow=1;
let chopping=null;                       // {tree, t, hits, cyc, struck}
const chips=[], regrow=[];
const treeName=c=>c&&c.props.find(n=>n.startsWith("tree"));
function refreshBlocked(c){ c.blocked=!!c.water||!!c.hutPart||!!c.npcHere||c.props.some(n=>BLOCKING.has(n)); }
function stopChopping(){ chopping=null; hero.pendingChop=null; }

// \u043a\u043b\u0438\u043a \u043f\u043e \u0434\u0435\u0440\u0435\u0432\u0443: \u043f\u043e\u0434\u0445\u043e\u0434\u0438\u043c \u043a \u0441\u043e\u0441\u0435\u0434\u043d\u0435\u0439 \u043a\u043b\u0435\u0442\u043a\u0435 (\u043b\u0443\u0447\u0448\u0435 \u2014 \u043f\u0435\u0440\u0435\u0434 \u0434\u0435\u0440\u0435\u0432\u043e\u043c, \u0447\u0442\u043e\u0431\u044b \u0435\u0433\u043e \u0431\u044b\u043b\u043e \u0432\u0438\u0434\u043d\u043e)
function goChop(t){
  if(t.grow<1||t.falling){ say("growing"); marker={x:t.x,y:t.y,t:0,ok:false}; return; }
  const spots=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const n=cellAt(t.x+dx,t.y+dy); if(n&&!n.blocked&&Math.abs(walkZ(n)-walkZ(t))<=1) spots.push(n);
  }
  const score=n=>Math.hypot(n.x-hero.x,n.y-hero.y)+(depthOf(n.x-MX,n.y-MY)<depthOf(t.x-MX,t.y-MY)?4:0);
  spots.sort((a,b)=>score(a)-score(b));
  for(const n of spots){
    const p=findPath(Math.round(hero.x),Math.round(hero.y),n.x,n.y); if(!p) continue;
    hero.path=p.length?p:[[n.x,n.y]]; hero.pendingChop={tree:t};
    marker={x:t.x,y:t.y,t:0,ok:true};
    follow=true; document.getElementById("follow").setAttribute("aria-pressed","true");
    say("go_chop"); return;
  }
  marker={x:t.x,y:t.y,t:0,ok:false}; say("no_reach");
}
function startChopping(t){
  marker=null;
  if(!treeName(t)||t.grow<1||t.falling){ say("growing"); return; }
  chopping={tree:t,t:0,hits:0,cyc:-1,struck:false};
  say("chopping","chop_sub");
}
function hitTree(t){
  const ch=chopping; ch.hits++; t.shake=0.3;
  for(let i=0;i<9;i++) chips.push({x:t.x+(hero.x-t.x)*0.3, y:t.y+(hero.y-t.y)*0.3, z:walkZ(t)*LH+9,
    vx:(Math.random()-.5)*1.6+(hero.x-t.x)*0.6, vy:(Math.random()-.5)*1.6+(hero.y-t.y)*0.6, vz:40+Math.random()*55,
    t:0, life:0.55+Math.random()*0.35, col:["#ecd0a0","#c89858","#8a5a2a"][i%3]});
  // \u043b\u0438\u0441\u0442\u044c\u044f \u0441\u044b\u043f\u043b\u044e\u0442\u0441\u044f \u043e\u0442 \u0443\u0434\u0430\u0440\u0430
  for(let i=0;i<3;i++) if(leaves.length<300) leaves.push({x:t.x+(Math.random()-.5)*0.8,y:t.y+(Math.random()-.5)*0.8,
    z:walkZ(t)*LH+40+Math.random()*50, ph:Math.random()*6.28, spin:3+Math.random()*4, fall:12+Math.random()*8,
    col:LEAF_COLORS[(Math.random()*LEAF_COLORS.length)|0], drift:0.3});
  const name=treeName(t);
  if(ch.hits>=HITS[name]){
    t.falling={t:0,dx:t.x-hero.x,dy:t.y-hero.y,name}; netTreeGone(t);
    chopping=null;
    const n=LOGS[name]+(Math.random()<extraLogChance()?1:0); inv.wood=(inv.wood||0)+n; renderInv();
    prog.st.trees++; addXP(3,"chop");
    floats.push({key:"plus",p:{n,fish:"#fish_wood"},col:"#f0c890",t:0});
    say("felled");
  }
}
function finishFall(c){
  const name=c.falling.name; c.falling=null;
  c.props=c.props.filter(n=>!n.startsWith("tree")); refreshBlocked(c);
  const i=TREES.findIndex(tr=>tr.c===c); if(i>=0) TREES.splice(i,1);
  c.stump={t:0,big:name==="tree_big"};
  for(let k=0;k<10;k++) chips.push({x:c.x+(Math.random()-.5)*0.8,y:c.y+(Math.random()-.5)*0.8,z:walkZ(c)*LH+2,
    vx:(Math.random()-.5)*0.8,vy:(Math.random()-.5)*0.8,vz:15+Math.random()*25,t:0,life:0.7,col:"#d8d0c0",dust:true});
  if(!c.remoteFall) regrow.push({t:5+Math.random()*5});   // \u043d\u043e\u0432\u043e\u0435 \u0434\u0435\u0440\u0435\u0432\u043e \u0441\u0430\u0436\u0430\u0435\u0442 \u0442\u043e\u0442, \u043a\u0442\u043e \u0441\u0440\u0443\u0431\u0438\u043b
  c.remoteFall=false;   // \u0447\u0435\u0440\u0435\u0437 5\u201310 \u0441 \u0433\u0434\u0435-\u0442\u043e \u0432\u044b\u0440\u0430\u0441\u0442\u0435\u0442 \u043d\u043e\u0432\u043e\u0435
}
// \u043d\u043e\u0432\u043e\u0435 \u0434\u0435\u0440\u0435\u0432\u0446\u0435 \u0432 \u0441\u0432\u043e\u0431\u043e\u0434\u043d\u043e\u043c \u043c\u0435\u0441\u0442\u0435 \u043d\u0430 \u0442\u0440\u0430\u0432\u0435, \u043f\u043e\u0434\u0430\u043b\u044c\u0448\u0435 \u043e\u0442 \u0433\u0435\u0440\u043e\u044f \u0438 \u0434\u0440\u0443\u0433\u0438\u0445 \u0434\u0435\u0440\u0435\u0432\u044c\u0435\u0432
function sproutTree(){
  const onPath=c=>hero.path.some(([px,py])=>Math.round(px)===c.x&&Math.round(py)===c.y);
  const cand=cells.filter(c=>!c.water&&!c.st&&"gGd".includes(c.t)&&!c.props.length&&!c.stump&&!c.blocked
    &&Math.hypot(c.x-hero.x,c.y-hero.y)>2.5&&!onPath(c)
    &&!TREES.some(tr=>Math.abs(tr.c.x-c.x)+Math.abs(tr.c.y-c.y)<3));
  if(!cand.length){ regrow.push({t:5}); return; }
  const c=cand[(Math.random()*cand.length)|0], big=Math.random()<0.5, name=big?"tree_big":"tree_small";
  c.props.push(name); refreshBlocked(c); c.grow=0.02; c.growTime=big?45:30; TREES.push({c,big}); netTreeGrow(c,name);
  for(let i=0;i<14;i++) chips.push({x:c.x+(Math.random()-.5)*0.6,y:c.y+(Math.random()-.5)*0.6,z:walkZ(c)*LH+2,
    vx:0,vy:0,vz:25+Math.random()*45,t:0,life:1,col:["#b8f070","#ffffff","#7fd040"][i%3],spark:true});
  if(!chopping&&!fishing&&!hero.path.length) say("sprout");
}
function updateChopping(dt){
  for(let i=chips.length-1;i>=0;i--){const p=chips[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    p.vz-=(p.spark?20:160)*dt; if(p.t>p.life) chips.splice(i,1);}
  for(const c of cells){
    if(c.shake>0) c.shake=Math.max(0,c.shake-dt);
    if(c.falling){ c.falling.t+=dt; if(c.falling.t>=0.9) finishFall(c); }
    if(c.stump){ c.stump.t+=dt; if(c.stump.t>30) c.stump=null; }
    if(c.grow<1) c.grow=Math.min(1,c.grow+dt/c.growTime);
  }
  for(let i=regrow.length-1;i>=0;i--){ regrow[i].t-=dt; if(regrow[i].t<=0){ regrow.splice(i,1); sproutTree(); } }
  if(!chopping) return;
  const ch=chopping; faceTo(ch.tree.x,ch.tree.y);
  ch.t+=dt;
  const cyc=Math.floor(ch.t/SWING); if(cyc!==ch.cyc){ch.cyc=cyc;ch.struck=false;}
  if(!ch.struck&&(ch.t%SWING)>=IMPACT){ ch.struck=true; hitTree(ch.tree); }
}

// \u0434\u0435\u0440\u0435\u0432\u043e \u0440\u0430\u0441\u0442\u0451\u0442 / \u043f\u0430\u0434\u0430\u0435\u0442 / \u0432\u0437\u0434\u0440\u0430\u0433\u0438\u0432\u0430\u0435\u0442 (\u0432\u044b\u0437\u044b\u0432\u0430\u0435\u0442\u0441\u044f \u0438\u0437 drawProp)
function drawTreeSpecial(im,px,py,c){
  if(c.falling){
    const k=Math.min(1,c.falling.t/0.9), e=k*k;

    else {
      // \u0432\u043e \u0432\u0440\u0435\u043c\u044f \u043f\u043e\u0432\u043e\u0440\u043e\u0442\u0430 \u2014 \u043a\u0430\u043a \u043f\u0435\u0440\u0435\u0432\u043e\u0440\u043e\u0442 \u043a\u0430\u0440\u0442\u043e\u0447\u043a\u0438: \u0434\u043e \u0441\u0435\u0440\u0435\u0434\u0438\u043d\u044b \u0442\u0435\u043a\u0443\u0449\u0438\u0439 \u0432\u0438\u0434 \u0441\u0443\u0436\u0430\u0435\u0442\u0441\u044f, \u043f\u043e\u0441\u043b\u0435 \u2014 \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0440\u0430\u0441\u0448\u0438\u0440\u044f\u0435\u0442\u0441\u044f.
      // \u041a\u0430\u0440\u0442\u0438\u043d\u043a\u0430 \u0432\u0441\u0451 \u0432\u0440\u0435\u043c\u044f \u043d\u0435\u043f\u0440\u043e\u0437\u0440\u0430\u0447\u043d\u0430\u044f, \u043f\u043e\u044d\u0442\u043e\u043c\u0443 \u043d\u0438\u0447\u0435\u0433\u043e \u043d\u0435 \u043c\u0438\u0433\u0430\u0435\u0442 \u0438 \u043d\u0435 \u043f\u0440\u043e\u0441\u0432\u0435\u0447\u0438\u0432\u0430\u0435\u0442.
      const sm=t=>t*t*(3-2*t);
      if(f<0.5) put(spA,1,1-0.42*sm(f/0.5));
      else put(spB,1,0.58+0.42*sm((f-0.5)/0.5));
      HUT.spr=null;
    }
  } else { drawHutProcedural(); HUT.spr=null; }
  if(windOn||smoke.length) drawSmoke();
}
// \u0434\u044b\u043c \u0438\u0437 \u0442\u0440\u0443\u0431\u044b, \u0441\u043d\u043e\u0441\u0438\u0442\u0441\u044f \u0432\u0435\u0442\u0440\u043e\u043c (\u0432 \u044d\u043a\u0440\u0430\u043d\u043d\u044b\u0445 \u043a\u043e\u043e\u0440\u0434\u0438\u043d\u0430\u0442\u0430\u0445 \u043c\u0438\u0440\u0430)
// \u0432\u0435\u0440\u0445 \u043d\u0430\u0440\u0438\u0441\u043e\u0432\u0430\u043d\u043d\u043e\u0439 \u0442\u0440\u0443\u0431\u044b \u043d\u0430 \u0441\u043f\u0440\u0430\u0439\u0442\u0430\u0445 \u0445\u0438\u0436\u0438\u043d\u044b (\u043f\u0438\u043a\u0441\u0435\u043b\u0438 \u043a\u0430\u0440\u0442\u0438\u043d\u043a\u0438); \u043d\u0430 \u0432\u0438\u0434\u0430\u0445 0 \u0438 1 \u0442\u0440\u0443\u0431\u0430 \u0441\u043a\u0440\u044b\u0442\u0430 \u0437\u0430 \u043a\u0440\u044b\u0448\u0435\u0439
const HUT_CHIMNEY={2:[108,53],3:[40,30]};
function chimneyTop(){
  if(HUT.spr&&!anim){ const c=HUT_CHIMNEY[HUT.spr.q]; if(c) return [HUT.spr.x+c[0],HUT.spr.y+c[1]-2]; }
  const g=hutGeom(); return proj(g.x0-0.2,g.yc+0.27,g.Zr+0.4);
}
function updateSmoke(dt){
  if(!HUT) return;
  HUT.puff=(HUT.puff||0)-dt;
  if(HUT.puff<=0&&!anim){ HUT.puff=0.35+Math.random()*0.25; const o=chimneyTop();
    smoke.push({sx:o[0]+(Math.random()-.5)*2, sy:o[1], t:0, life:3+Math.random()}); }
  const w=windOn?windAt(T):0.15, wx=windOn?windScreenX():0.3;
  for(let i=smoke.length-1;i>=0;i--){ const p=smoke[i]; p.t+=dt;
    p.sy-=(10-p.t*1.6)*dt; p.sx+=wx*(4+16*w)*dt; if(p.t>p.life) smoke.splice(i,1); }
}
function drawSmoke(){
  for(const p of smoke){
    const k=p.t/p.life, r=Math.round(2+k*5);
    ctx.globalAlpha=(1-k)*0.55; ctx.fillStyle=k<0.3?"#e8e4f0":"#d4d0e0";
    ctx.fillRect(Math.round(p.sx-r),Math.round(p.sy-r),r*2,r*2);
    ctx.fillRect(Math.round(p.sx-r-1),Math.round(p.sy-r+1),r*2+2,r*2-2);
  }
  ctx.globalAlpha=1;
}

// ---- NPC: \u0441\u043f\u0440\u0430\u0439\u0442\u044b npc_se_0/1, npc_ne_0/1 (\u0432\u043b\u0435\u0432\u043e \u2014 \u0437\u0435\u0440\u043a\u0430\u043b\u044c\u043d\u043e), \u0438\u043d\u0430\u0447\u0435 \u0441\u0442\u0430\u0440\u0438\u043a \u043a\u043e\u0434\u043e\u043c ----
function drawOldMan(g,facing,t,talking){
  const front=facing[0]==="s", flip=facing[1]==="w"?-1:1, bob=Math.sin(t*2.4)>0.55?1:0;
  g.save(); g.scale(flip,1); g.translate(0,-bob);
  const rects=[]; const R=(x,y,w,h,c)=>rects.push([x,y,w,h,c]);
  R(-4,-8,3,8,"#4a3a2a"); R(1,-8,3,8,"#4a3a2a"); R(-4,-2,3,2,"#2a1f14"); R(1,-2,3,2,"#2a1f14");
  R(-6,-20,12,13,"#7a5a2e"); R(-6,-20,12,2,"#9a7440"); R(-6,-12,12,1,"#c8b070");
  R(-8,-19,2,9,"#6a4a24"); R(6,-19,2,9,"#6a4a24"); R(-8,-10,2,2,"#e8b888"); R(6,-10,2,2,"#e8b888");
  R(-4,-28,8,8,"#e8b888");
  if(front){ R(-4,-23,8,5,"#f0f0f4"); R(-3,-18,6,2,"#f0f0f4"); R(-2,-25,1,1,"#1b1528"); R(2,-25,1,1,"#1b1528"); R(0,-24,1,2,"#d89870");
    if(talking&&Math.sin(t*14)>0) R(-1,-21,3,1,"#8a5a4a"); }
  else R(-4,-27,8,6,"#c8c8d0");
  R(-7,-28,14,2,"#3f5a2e"); R(-4,-32,8,4,"#4f6a3a"); R(-4,-29,8,1,"#2a3a1e");
  g.fillStyle="#1b1528"; for(const [x,y,w,h] of rects) g.fillRect(x-1,y-1,w+2,h+2);
  for(const [x,y,w,h,c] of rects){ g.fillStyle=c; g.fillRect(x,y,w,h); }
  g.fillStyle="#8a5a2a"; for(let i=0;i<26;i++) g.fillRect(7+Math.round(i*0.08),-10-i,1,1);   // \u043f\u043e\u0441\u043e\u0445-\u0443\u0434\u043e\u0447\u043a\u0430
  g.restore();
}
function questMark(){
  if(quest==="none") return "!";
  if(quest==="active"&&(inv.wood||0)>=5) return "?";
  return null;
}
function drawNPC(){
  worldTransform(); ctx.imageSmoothingEnabled=false;
  const [fx,fy]=proj(npc.x-MX,npc.y-MY,npc.z);
  ctx.fillStyle="rgba(20,10,40,.28)"; ctx.beginPath(); ctx.ellipse(fx,fy,9,4.5,0,0,Math.PI*2); ctx.fill();
  const frame=Math.sin(npc.t*2.4)>0.55?1:0;
  let sp=img[`npc_${npc.facing}_${frame}`], mirror=false;
  if(!sp&&npc.facing[1]==="w"){ sp=img[`npc_${npc.facing[0]}e_${frame}`]; mirror=true; }
  ctx.save(); ctx.translate(Math.round(fx),Math.round(fy));
  if(sp){ if(mirror) ctx.scale(-1,1); ctx.drawImage(sp,-Math.round(sp.width/2),-sp.height+2); }
  else drawOldMan(ctx,npc.facing,npc.t,dialogOpen);
  ctx.restore();
  const m=questMark();
  if(m&&!dialogOpen){   // \u00ab!\u00bb \u2014 \u0435\u0441\u0442\u044c \u0437\u0430\u0434\u0430\u043d\u0438\u0435, \u00ab?\u00bb \u2014 \u043c\u043e\u0436\u043d\u043e \u0441\u0434\u0430\u0442\u044c
    const ex=Math.round(fx), ey=Math.round(fy-50-Math.abs(Math.sin(T*3))*3);
    ctx.fillStyle="#1b1528"; ctx.fillRect(ex-3,ey-1,7,11);
    ctx.fillStyle="#ffd66b";
    if(m==="!"){ ctx.fillRect(ex-1,ey,3,6); ctx.fillRect(ex-1,ey+7,3,2); }
    else { ctx.fillRect(ex-2,ey,5,2); ctx.fillRect(ex+1,ey+2,2,2); ctx.fillRect(ex-1,ey+4,2,2); ctx.fillRect(ex-1,ey+7,2,2); }
  }
}
function facingTo(from,x,y){
  const dx=x-from.x, dy=y-from.y, u=dx*ca-dy*sa, v=dx*sa+dy*ca;
  return ((u+v)>=0?"s":"n")+((u-v)>=0?"e":"w");
}
function updateNPC(dt){
  if(!npc) return;
  npc.t+=dt;
  const d=Math.hypot(hero.x-npc.x,hero.y-npc.y);
  if(dialogOpen||d<3.5) npc.facing=facingTo(npc,hero.x,hero.y);   // \u0441\u043c\u043e\u0442\u0440\u0438\u0442 \u043d\u0430 \u0433\u0435\u0440\u043e\u044f, \u043a\u043e\u0433\u0434\u0430 \u0442\u043e\u0442 \u0440\u044f\u0434\u043e\u043c
  else { npc.turnT-=dt; if(npc.turnT<=0){ npc.turnT=3+Math.random()*4; npc.facing=["se","sw","se","ne"][(Math.random()*4)|0]; } }
}

// \u043a\u043b\u0438\u043a \u043f\u043e NPC \u0438\u043b\u0438 \u0445\u0438\u0436\u0438\u043d\u0435 (\u043f\u043e \u043a\u0430\u0440\u0442\u0438\u043d\u043a\u0435, \u0430 \u043d\u0435 \u0442\u043e\u043b\u044c\u043a\u043e \u043f\u043e \u043a\u043b\u0435\u0442\u043a\u0435)
function pickEntity(mx,my){
  const wx=(mx-panX)/scale, wy=(my-panY)/scale;
  if(npc){ const [fx,fy]=proj(npc.x-MX,npc.y-MY,npc.z); if(Math.abs(wx-fx)<=11&&wy>=fy-44&&wy<=fy+4) return "npc"; }
  if(HUT){
    const g=hutGeom(), pts=[];
    for(const x of [g.x0-0.4,g.x1+0.2])for(const y of [g.y0-0.4,g.y1+0.2])for(const z of [g.Z0,g.Zr+0.7]) pts.push(proj(x,y,z));
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
    if(wx>=Math.min(...xs)&&wx<=Math.max(...xs)&&wy>=Math.min(...ys)&&wy<=Math.max(...ys)-12) return "hut";
  }
  return null;
}
function goTalk(){
  if(!npc) return;
  if(Math.hypot(hero.x-npc.x,hero.y-npc.y)<1.6&&!hero.path.length){ openDialog(); return; }
  const spots=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ const n=cellAt(npc.x+dx,npc.y+dy); if(n&&!n.blocked) spots.push(n); }
  const score=n=>Math.hypot(n.x-hero.x,n.y-hero.y)+(depthOf(n.x-MX,n.y-MY)<depthOf(npc.x-MX,npc.y-MY)?3:0);
  spots.sort((a,b)=>score(a)-score(b));
  for(const n of spots){
    const p=findPath(Math.round(hero.x),Math.round(hero.y),n.x,n.y); if(!p) continue;
    hero.path=p.length?p:[[n.x,n.y]]; hero.pendingTalk=true;
    follow=true; document.getElementById("follow").setAttribute("aria-pressed","true");
    say("go_talk"); return;
  }
  say("no_reach");
}

let dialogOpen=false, dlgNode="main", dlgParams={};
const fishValue=()=>FISH.reduce((a,f)=>a+(inv[f.id]||0)*(PRICE[f.id]||0),0)+(inv.cooked||0)*PRICE.cooked;
function openDialog(){
  dialogOpen=true; dlgKind="npc"; dlgNode="main"; faceTo(npc.x,npc.y); closeWin();
  document.getElementById("dialog").hidden=false; document.getElementById("info").hidden=true; document.querySelector(".ctrl").hidden=true;
  drawPortrait(); renderDialog();
  setTimeout(()=>{const b=document.querySelector("#dlgOpts button"); if(b&&matchMedia("(pointer: fine)").matches) b.focus();},0);
}
function closeDialog(){
  if(!dialogOpen) return;
  dialogOpen=false; document.getElementById("dialog").hidden=true; document.getElementById("info").hidden=false; document.querySelector(".ctrl").hidden=false;
  say(dlgKind==="fire"?"fire_left":"arrived_npc"); dlgKind="npc";
}
function renderDialog(){
  if(!dialogOpen) return;
  if(dlgKind==="fire") return renderFireMenu();
  const opts=[];
  let text;
  const wood=inv.wood||0;
  if(dlgNode==="main"){
    text=quest==="none"?tr("npc_hello"):quest==="active"?tr("npc_hello_active",{n:Math.min(wood,5)}):tr("npc_hello_done");
    const fv=fishValue(); if(fv>0) opts.push(["opt_sell_fish",{c:fv},sellFish]);
    if(quest==="none") opts.push(["opt_quest",null,()=>{dlgNode="quest";renderDialog();}]);
    if(quest==="active"&&wood>=5) opts.push(["opt_give_wood",null,giveWood]);
    if(quest==="done"&&wood>0) opts.push(["opt_sell_wood",{c:wood},sellWood]);
    if(quest2==="none") opts.push(["opt_wolfq",null,()=>{dlgNode="wolfq";renderDialog();}]);
    if(quest2==="active"&&(inv.pelt||0)>=2) opts.push(["opt_give_pelts",null,givePelts]);
    const lv=lootValue(); if(lv>0) opts.push(["opt_sell_loot",{c:lv},sellLoot]);
    if(quest2!=="none") opts.push(["opt_craft",null,()=>{dlgNode="craft";renderDialog();}]);
    opts.push(["opt_who",null,()=>{dlgNode="who";renderDialog();}]);
    opts.push(["opt_bye",null,closeDialog]);
  } else if(dlgNode==="craft"){
    text=tr("npc_craft");
    for(const r of RECIPES) opts.push(["craft_opt",{item:"#fish_"+r.id,cost:costText(r)},()=>craft(r),!canCraft(r)]);
    opts.push(["opt_back",null,()=>{dlgNode="main";renderDialog();}]);
  } else if(dlgNode==="wolfq"){
    text=tr("npc_wolfq");
    opts.push(["opt_accept",null,()=>{quest2="active"; if(!equip.weapon&&!inv.club) giveItem("club"); renderInv(); dlgNode="wolf_acc"; renderDialog();}]);
    opts.push(["opt_later",null,()=>{dlgNode="main";renderDialog();}]);
  } else if(dlgNode==="quest"){
    text=tr("npc_quest");
    opts.push(["opt_accept",null,()=>{quest="active";dlgNode="accepted";renderDialog();}]);
    opts.push(["opt_later",null,()=>{dlgNode="main";renderDialog();}]);
  } else {
    text=tr({who:"npc_who",accepted:"npc_accepted",sold:"npc_sold",reward:"npc_reward",wood_sold:"npc_wood_sold",wolf_acc:"npc_wolf_acc",reward2:"npc_reward2",loot_sold:"npc_loot_sold",crafted:"npc_crafted"}[dlgNode],dlgParams);
    opts.push(["opt_back",null,()=>{dlgNode="main";renderDialog();}]);
    opts.push(["opt_bye",null,closeDialog]);
  }
  document.getElementById("dlgName").textContent=tr("npc_name");
  document.getElementById("dlgText").textContent=text;
  const box=document.getElementById("dlgOpts"); box.innerHTML="";
  for(const [k,p,fn,dis] of opts){ const b=document.createElement("button"); b.className="btn"; b.textContent=tr(k,p); b.onclick=fn; b.disabled=!!dis; box.appendChild(b); }
}
function addCoins(n){ inv.coin=(inv.coin||0)+n; floats.push({key:"plus",p:{n,fish:"#fish_coin"},col:"#ffd66b",t:0}); }
function sellFish(){
  const c=fishValue(); for(const f of FISH) delete inv[f.id]; delete inv.cooked;
  addCoins(c); renderInv(); dlgParams={c}; dlgNode="sold"; renderDialog();
}
function sellWood(){
  const c=inv.wood||0; delete inv.wood; addCoins(c); renderInv(); dlgParams={c}; dlgNode="wood_sold"; renderDialog();
}

const lootValue=()=>Object.entries(LOOT_PRICE).reduce((a,[k,p])=>a+(k==="pelt"&&quest2!=="done"?0:(inv[k]||0)*p),0);
function sellLoot(){ const c=lootValue(); for(const k of Object.keys(LOOT_PRICE)) if(!(k==="pelt"&&quest2!=="done")) delete inv[k];

function givePelts(){ inv.pelt-=2; if(!inv.pelt) delete inv.pelt; quest2="done"; addCoins(15); addXP(20); inv.potion=(inv.potion||0)+2;

// ================= \u0414\u0435\u043d\u044c \u0438 \u043d\u043e\u0447\u044c =================
const DAY_LEN=420;                 // \u0441\u0435\u043a\u0443\u043d\u0434 \u043d\u0430 \u0441\u0443\u0442\u043a\u0438 (7 \u043c\u0438\u043d\u0443\u0442)
let clock=8/24;                    // \u0434\u043e\u043b\u044f \u0441\u0443\u0442\u043e\u043a, 0 = \u043f\u043e\u043b\u043d\u043e\u0447\u044c; \u0441\u0442\u0430\u0440\u0442 \u0432 8:00
const hourNow=()=>clock*24;
function darkness(){               // 0 \u2014 \u0434\u0435\u043d\u044c, 1 \u2014 \u0433\u043b\u0443\u0431\u043e\u043a\u0430\u044f \u043d\u043e\u0447\u044c
  const h=hourNow();
  if(h>=7&&h<17.5) return 0;
  if(h>=17.5&&h<21) return (h-17.5)/3.5;
  if(h>=21||h<5) return 1;
  return 1-(h-5)/2;
}
function duskAmt(){                // \u043e\u0440\u0430\u043d\u0436\u0435\u0432\u044b\u0439 \u0437\u0430\u043a\u0430\u0442 \u0438 \u0440\u043e\u0437\u043e\u0432\u044b\u0439 \u0440\u0430\u0441\u0441\u0432\u0435\u0442
  const h=hourNow();
  if(h>=16.5&&h<20.5) return Math.sin((h-16.5)/4*Math.PI);
  if(h>=4.5&&h<7.5) return Math.sin((h-4.5)/3*Math.PI)*0.6;
  return 0;
}
const isNight=()=>{const h=hourNow(); return h>=20.5||h<5.5;};
let wasNight=null, lastClockText="";
function updateClock(dt){
  { const nc=netClock(); clock=nc!==null?nc:(clock+dt/DAY_LEN)%1; }
  const night=isNight();
  if(wasNight!==null&&night!==wasNight){
    if(night) say("night_falls","night_sub"); else say("morning");
  }
  wasNight=night;
  const h=Math.floor(hourNow()), m=Math.floor((hourNow()-h)*60/10)*10;
  const txt=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  if(txt!==lastClockText){
    lastClockText=txt;
    document.getElementById("clkTime").textContent=txt;
    const dayIcon=!night&&darkness()<0.6;
    document.getElementById("clkIcon").innerHTML=dayIcon
      ?'<circle cx="12" cy="12" r="5" fill="#ffd66b"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2" stroke="#ffd66b" stroke-width="2"/>'
      :'<path d="M15 3a9 9 0 1 0 6 13A7 7 0 0 1 15 3z" fill="#e8e4ff"/>';
    document.getElementById("skipTime").textContent=tr(night?"skip_day":"skip_night");
  }
}
function skipTime(){
  clock=isNight()?6.2/24:20.4/24; netSetClock(clock);
  lastClockText="";
}

// ---- \u0441\u0432\u0435\u0442: \u0442\u0451\u043c\u043d\u044b\u0439 \u00ab\u0444\u0438\u043b\u044c\u0442\u0440\u00bb \u043d\u0430 \u0432\u0441\u044e \u0441\u0446\u0435\u043d\u0443, \u043e\u0433\u043d\u0438 \u0432\u044b\u0436\u0438\u0433\u0430\u044e\u0442 \u0432 \u043d\u0451\u043c \u0442\u0451\u043f\u043b\u044b\u0435 \u043f\u044f\u0442\u043d\u0430 ----
const lightCv=document.createElement("canvas"), lightCtx=lightCv.getContext("2d");
const fireflies=[];
const WOLF_EYES={"wolf_se_0":[[30,18],[34,18]],"wolf_se_1":[[40,20]],"wolf_se_2":[[32,18],[37,18]],"wolf_se_3":[[35,19]],"wolf_ne_0":[],"wolf_ne_1":[],"wolf_ne_2":[],"wolf_ne_3":[]};
function collectLights(){
  const L=[];
  for(const f of fires) if(f.fuel>0){
    const p=proj(f.c.x-MX,f.c.y-MY,f.c.L+0.8), fl=Math.sin(T*11)*3+Math.sin(T*17.3)*2;
    L.push({x:p[0],y:p[1],r:82+fl,c:"255,186,110",a:1});
  }
  if(HUT){ const p=proj(HUT.hx+0.5-MX,HUT.hy+0.9-MY,HUT.Z+1.7); L.push({x:p[0],y:p[1],r:48,c:"255,200,120",a:0.75}); }
  const hp=proj(hero.x-MX,hero.y-MY,hero.z+1.5); L.push({x:hp[0],y:hp[1],r:30,c:"170,185,255",a:0.35});
  for(const f of fireflies){ if(f.b<=0.05) continue; const p=proj(f.x-MX,f.y-MY,f.z); L.push({x:p[0],y:p[1],r:9,c:"210,255,130",a:0.55*f.b}); }
  return L;
}
function applyLighting(){
  const d=darkness(), du=duskAmt(); if(d<0.01&&du<0.01) return;
  const bw=buf.width, bh=buf.height;
  if(lightCv.width!==bw||lightCv.height!==bh){lightCv.width=bw;lightCv.height=bh;}
  let r=255,g=255,b=255; const mix=(c,t)=>{r+=(c[0]-r)*t;g+=(c[1]-g)*t;b+=(c[2]-b)*t;};
  mix([255,168,112],du*0.55); mix([58,68,138],d);
  const Lc=lightCtx; Lc.setTransform(1,0,0,1,0,0); Lc.globalCompositeOperation="source-over";
  Lc.fillStyle=`rgb(${r|0},${g|0},${b|0})`; Lc.fillRect(0,0,bw,bh);
  if(d>0.05){
    Lc.globalCompositeOperation="lighter";
    for(const li of collectLights()){
      const x=li.x+ROX, y=li.y+ROY, gr=Lc.createRadialGradient(x,y,0,x,y,li.r);
      gr.addColorStop(0,`rgba(${li.c},${li.a*d})`); gr.addColorStop(0.55,`rgba(${li.c},${li.a*d*0.45})`); gr.addColorStop(1,`rgba(${li.c},0)`);
      Lc.fillStyle=gr; Lc.fillRect(x-li.r,y-li.r,li.r*2,li.r*2);
    }
  }
  const B=bufCtx; B.save(); B.setTransform(1,0,0,1,0,0); B.globalCompositeOperation="multiply"; B.drawImage(lightCv,0,0); B.restore();
}
// \u043f\u043e\u0441\u043b\u0435 \u0441\u0432\u0435\u0442\u0430: \u0441\u0432\u0435\u0442\u043b\u044f\u0447\u043a\u0438, \u0441\u0432\u0435\u0442\u044f\u0449\u0438\u0435\u0441\u044f \u0433\u043b\u0430\u0437\u0430 \u0432\u043e\u043b\u043a\u043e\u0432, \u043e\u0440\u0435\u043e\u043b \u043a\u043e\u0441\u0442\u0440\u0430
function drawNightFx(){
  const d=darkness(); if(d<0.3) return;
  worldTransform(); ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(const f of fires) if(f.fuel>0){
    const p=proj(f.c.x-MX,f.c.y-MY,f.c.L+0.9), gr=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],22);
    gr.addColorStop(0,`rgba(255,150,60,${0.35*d})`); gr.addColorStop(1,"rgba(255,150,60,0)");
    ctx.fillStyle=gr; ctx.fillRect(p[0]-22,p[1]-22,44,44);
  }
  ctx.restore();
  for(const f of fireflies){ if(f.b<=0.05) continue; const p=proj(f.x-MX,f.y-MY,f.z);
    ctx.globalAlpha=f.b*d; ctx.fillStyle="#e4ff8a"; ctx.fillRect(Math.round(p[0]),Math.round(p[1]),1,1);
    ctx.globalAlpha=f.b*d*0.4; ctx.fillRect(Math.round(p[0])-1,Math.round(p[1]),3,1); ctx.fillRect(Math.round(p[0]),Math.round(p[1])-1,1,3); }
  ctx.globalAlpha=1;
  // \u0433\u043b\u0430\u0437\u0430 \u0432\u043e\u043b\u043a\u043e\u0432 \u0441\u0432\u0435\u0442\u044f\u0442\u0441\u044f \u0432 \u0442\u0435\u043c\u043d\u043e\u0442\u0435: \u0443 \u0441\u043f\u0440\u0430\u0439\u0442\u043e\u0432 \u2014 \u0438\u0445 \u0436\u0451\u043b\u0442\u044b\u0435 \u043f\u0438\u043a\u0441\u0435\u043b\u0438, \u0443 \u0437\u0430\u0433\u043b\u0443\u0448\u043a\u0438 \u2014 \u0442\u043e\u0447\u043a\u0430 \u0443 \u043c\u043e\u0440\u0434\u044b
  for(const a of animals){ if(a.kind!=="wolf"||a.alpha<=0.3||!a.drawn) continue;
    const dr=a.drawn, pts=[];
    if(dr.sp){ for(const [ex,ey] of (WOLF_EYES[dr.name]||[])){ const x=dr.mirror?dr.x+Math.round(dr.sp.width/2)-ex-1:dr.x-Math.round(dr.sp.width/2)+ex; pts.push([x,dr.y-dr.sp.height+2+ey]); } }
    else { const dir=a.facing[1]==="e"?1:-1; pts.push([dr.x+dir*10,dr.y-15]); }
    for(const [x,y] of pts){
      ctx.globalAlpha=d*a.alpha; ctx.fillStyle="#fff070"; ctx.fillRect(x,y,1,1);
      ctx.globalAlpha=d*a.alpha*0.35; ctx.fillRect(x-1,y-1,3,3);
    }
  }
  ctx.globalAlpha=1;
}
function initFireflies(){
  const spots=cells.filter(c=>c.water||c.props.some(n=>n.startsWith("tree")));
  for(let i=0;i<18&&spots.length;i++){ const c=spots[(Math.random()*spots.length)|0];
    fireflies.push({bx:c.x+(Math.random()-.5),by:c.y+(Math.random()-.5),bz:walkZ(c)+0.6+Math.random()*1.6,s:Math.random()*10,x:0,y:0,z:0,b:0}); }
}
function updateFireflies(){
  const d=darkness();
  for(const f of fireflies){
    f.x=f.bx+Math.sin(T*0.6+f.s)*0.5; f.y=f.by+Math.cos(T*0.45+f.s*1.3)*0.5; f.z=f.bz+Math.sin(T*1.1+f.s)*0.3;
    f.b=d>0.4?Math.max(0,Math.sin(T*1.8+f.s*3)):0;
  }
}

// ================= \u0417\u0434\u043e\u0440\u043e\u0432\u044c\u0435 \u0433\u0435\u0440\u043e\u044f =================
let HP_MAX=5; hero.hp=HP_MAX; hero.hurtT=0;
let fadeT=0, fainting=false;
const HEART='<svg viewBox="0 0 9 8" width="18" height="16" aria-hidden="true" shape-rendering="crispEdges"><path d="M1 0h2v1h1v1h1V1h1V0h2v1h1v3H8v1H7v1H6v1H5v1H4V7H3V6H2V5H1V4H0V1h1z" fill="#1b1528"/><path d="M1 1h2v1h1v1h1V2h1V1h2v3H7v1H6v1H5v1H4V6H3V5H2V4H1z" fill="FILL"/><path d="M2 1h1v1H2z" fill="HL"/></svg>';
function renderHP(){
  const el=document.getElementById("hp"); let h="";
  for(let i=0;i<HP_MAX;i++) h+=HEART.replace("FILL",i<hero.hp?"#e8402c":"#3d3257").replace("HL",i<hero.hp?"#ff9a8a":"#3d3257");

function hurtHero(n,from){
  if(hero.hp<=0||fainting) return;
  if(Math.random()<blockChance()){ floats.push({key:"blocked_bite",col:"#9fe0ff",t:0}); return; }
  hero.hp=Math.max(0,hero.hp-n); hero.hurtT=0.6; hero.hurtAt=Date.now(); renderHP();
  floats.push({key:"minus_hp",p:{n},col:"#ff6a5a",t:0});
  stopFishing(); stopChopping();
  // \u043e\u0442\u0431\u0440\u0430\u0441\u044b\u0432\u0430\u0435\u0442 \u043e\u0442 \u0432\u043e\u043b\u043a\u0430
  if(from){ const dx=hero.x-from.x, dy=hero.y-from.y, dd=Math.hypot(dx,dy)||1, nx=hero.x+dx/dd*0.35, ny=hero.y+dy/dd*0.35, c=cellAt(Math.round(nx),Math.round(ny));
    if(c&&!c.blocked&&Math.abs(walkZ(c)-hero.z)<1.2){ hero.x=nx; hero.y=ny; } }

}
function faint(){
  fainting=true; fadeT=0; hero.path=[]; marker=null; closeDialog(); prog.st.faints++;
  document.getElementById("fade").style.opacity="1";
  setTimeout(()=>{
    // \u043e\u0447\u043d\u0443\u043b\u0441\u044f \u0443\u0442\u0440\u043e\u043c \u0443 \u0445\u0438\u0436\u0438\u043d\u044b \u0411\u043e\u0433\u0434\u0430\u043d\u0430
    const spot=[...Array(9)].map((_,i)=>cellAt(NPCC.x+(i%3)-1,NPCC.y+((i/3)|0)-1)).find(c=>c&&!c.blocked)||NPCC;
    hero.x=spot.x; hero.y=spot.y; hero.z=walkZ(spot); hero.hp=HP_MAX; renderHP();
    const lost=Math.floor((inv.coin||0)*0.3); if(lost){ inv.coin-=lost; if(!inv.coin) delete inv.coin; renderInv(); }

      clock=7/24; wasNight=false; lastClockText=""; netSetClock(clock); }

function eatCooked(id){
  if(!EDIBLE[id]){ id=["cooked","meat_cooked","potion"].find(k=>inv[k]); }
  if(!id||!inv[id]) return;
  if(hero.hp>=HP_MAX){ say("full_hp"); return; }
  inv[id]--; if(!inv[id]) delete inv[id];
  const before=hero.hp; hero.hp=Math.min(HP_MAX,hero.hp+EDIBLE[id]); renderHP(); renderInv();
  floats.push({key:"heal",p:{n:hero.hp-before},col:"#8aff8a",t:0});
  say("ate","",{hp:hero.hp});
}

// ================= \u041a\u043e\u0441\u0442\u0451\u0440 =================
const fires=[]; const FIRE_FUEL=150, WOOD_FUEL=90, FIRE_COST=3, FIRE_SAFE=3.0, FIRE_SCARE=4.0;
let placing=false, building=null;
const fmtTime=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
// \u043a\u043e\u0441\u0442\u0451\u0440 \u0445\u0440\u0430\u043d\u0438\u0442 \u043c\u043e\u043c\u0435\u043d\u0442, \u043a\u043e\u0433\u0434\u0430 \u0434\u043e\u0433\u043e\u0440\u0438\u0442: \u0442\u0430\u043a \u0435\u0433\u043e \u043e\u0434\u0438\u043d\u0430\u043a\u043e\u0432\u043e \u0432\u0438\u0434\u044f\u0442 \u0432\u0441\u0435 \u0438\u0433\u0440\u043e\u043a\u0438
function addFire(c,until,local){
  const f={c,until,synced:!local,get fuel(){return (this.until-Date.now())/1000},set fuel(v){this.until=Date.now()+v*1000}};
  fires.push(f); c.fire=f; c.blocked=true; if(local) netFire(f); return f;
}
function freeCell(c){ return c&&!c.water&&!c.blocked&&!c.hutPart&&!c.npcHere&&!c.fire; }
// \u0438\u0434\u0451\u043c \u043a \u043a\u043b\u0435\u0442\u043a\u0435 \u0440\u044f\u0434\u043e\u043c \u0441 \u0446\u0435\u043b\u044c\u044e \u0438 \u0432\u044b\u043f\u043e\u043b\u043d\u044f\u0435\u043c \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0435
function goAdjacent(t,fn,sayKey){
  const near=Math.max(Math.abs(hero.x-t.x),Math.abs(hero.y-t.y));
  if(near<=1.05&&near>0.3&&!hero.path.length){ faceTo(t.x,t.y); fn(); return; }
  const spots=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy) continue; const n=cellAt(t.x+dx,t.y+dy); if(n&&!n.blocked&&Math.abs(walkZ(n)-walkZ(t))<=1) spots.push(n); }
  const score=n=>Math.hypot(n.x-hero.x,n.y-hero.y)+(depthOf(n.x-MX,n.y-MY)<depthOf(t.x-MX,t.y-MY)?2:0);
  spots.sort((a,b)=>score(a)-score(b));
  for(const n of spots){
    const p=findPath(Math.round(hero.x),Math.round(hero.y),n.x,n.y); if(!p) continue;
    hero.path=p.length?p:[[n.x,n.y]]; hero.pendingAction=()=>{faceTo(t.x,t.y);fn();};
    marker={x:t.x,y:t.y,t:0,ok:true};
    follow=true; document.getElementById("follow").setAttribute("aria-pressed","true");
    say(sayKey); return;
  }
  marker={x:t.x,y:t.y,t:0,ok:false}; say("no_reach");
}
function startPlacing(){ if((inv.wood||0)<FIRE_COST) return; placing=true; stopFishing(); stopChopping(); say("place_fire"); }
function cancelPlacing(){ placing=false; say("hint","hint_sub"); }
function placeFireAt(c){
  if(!freeCell(c)||c.props.length||c.st||c.stump){ marker={x:c.x,y:c.y,t:0,ok:false}; say("bad_place"); return; }
  placing=false;
  goAdjacent(c,()=>{ building={c,t:0}; say("building"); },"go_build");
}
function updateFires(dt){
  if(building){
    building.t+=dt;
    if(Math.random()<dt*12) chips.push({x:building.c.x,y:building.c.y,z:walkZ(building.c)*LH+2,vx:(Math.random()-.5)*0.6,vy:(Math.random()-.5)*0.6,vz:20+Math.random()*30,t:0,life:0.6,col:"#ffb040",spark:true});
    if(building.t>=1.4){
      const c=building.c; building=null;
      if(freeCell(c)&&(inv.wood||0)>=FIRE_COST){
        inv.wood-=FIRE_COST; if(!inv.wood) delete inv.wood; renderInv();
        addFire(c,Date.now()+FIRE_FUEL*1000,true);
        say("fire_lit"); prog.st.fires++;
      }
    }
  }
  for(const f of fires){
    if(f.fuel>0){
      if(Math.random()<dt*7) chips.push({x:f.c.x+(Math.random()-.5)*0.2,y:f.c.y+(Math.random()-.5)*0.2,z:walkZ(f.c)*LH+12,
        vx:WIND[0]*0.3*(windOn?windAt(T):0)+(Math.random()-.5)*0.3,vy:WIND[1]*0.3*(windOn?windAt(T):0)+(Math.random()-.5)*0.3,vz:25+Math.random()*25,t:0,life:0.7+Math.random()*0.6,col:Math.random()<0.5?"#ffd040":"#ff8a2a",spark:true});
    }
  }
}
function drawFire(c){
  const f=c.fire, p=proj(c.x-MX,c.y-MY,c.L), x=Math.round(p[0]), y=Math.round(p[1]), burning=f.fuel>0;
  const sp=img[burning?"campfire_"+(Math.floor(T*8)%3):"campfire_off"];
  if(sp){ ctx.drawImage(sp,x-Math.round(sp.width/2),y-sp.height+8); return; }
  const R=(a,b,w,h,col)=>{ctx.fillStyle=col;ctx.fillRect(a,b,w,h)};
  ctx.fillStyle="rgba(20,10,40,.28)"; ctx.beginPath(); ctx.ellipse(x,y,11,5.5,0,0,Math.PI*2); ctx.fill();
  const stones=[...Array(8)].map((_,i)=>{const a=i/8*Math.PI*2; return [x+Math.round(Math.cos(a)*9),y+Math.round(Math.sin(a)*4.5)];});
  const stone=([sx,sy])=>{R(sx-2,sy-2,5,4,"#1b1528");R(sx-1,sy-1,3,2,"#9a98a6");R(sx-1,sy-1,2,1,"#c0bec8");};
  stones.filter(s=>s[1]<y).forEach(stone);
  // \u043f\u043e\u043b\u0435\u043d\u044c\u044f \u0448\u0430\u043b\u0430\u0448\u0438\u043a\u043e\u043c
  R(x-6,y-2,12,2,"#1b1528"); R(x-5,y-2,10,1,"#7a4a24"); R(x-2,y-5,2,5,"#1b1528"); R(x+1,y-5,2,5,"#1b1528"); R(x-1,y-4,1,4,"#8a5a2e"); R(x+1,y-4,1,4,"#6a3e1c");
  if(burning){
    const h=11+Math.round(Math.sin(T*13)*2+Math.sin(T*7.3)*1.5), sw=Math.sin(T*9)*1.5;
    const flame=(w,hh,col)=>{ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(x-w,y-2);ctx.quadraticCurveTo(x-w*0.8,y-hh*0.55,x+sw,y-2-hh);ctx.quadraticCurveTo(x+w*0.8,y-hh*0.55,x+w,y-2);ctx.closePath();ctx.fill();};
    flame(6,h,"#ff6a1a"); flame(4,h*0.72,"#ffb030"); flame(2,h*0.42,"#fff2a0");
  } else {
    R(x-4,y-2,8,2,"#3a2a2a"); if(Math.sin(T*3+c.x)>0.6) R(x-1+Math.round(Math.sin(T)*2),y-2,1,1,"#c84020");
  }
  stones.filter(s=>s[1]>=y).forEach(stone);
}

const WOLF_HP=4, ATK_TIME=0.36, ATK_HIT=0.14, ATK_CD=0.75, ATK_RANGE=1.15;

function updateCombat(dt){

function updateRemotes(dt){
  const k=Math.min(1,dt*9);

    if(Math.hypot(r.tx-r.x,r.ty-r.y)>3){ r.x=r.tx; r.y=r.ty; }
    r.x+=(r.tx-r.x)*k; r.y+=(r.ty-r.y)*k; r.z+=(r.tz-r.z)*k;
    r.phase=r.m?r.phase+dt*HERO_SPEED*Math.PI*1.6:0;
    if(r.ak) r.akT=((r.akT||0)+dt)%ATK_CD;

function mirrorAnimals(h,dt){
  const list=h.an||[], ids=new Set();
  for(const e of list){
    if(!e||typeof e!=="object") continue;
    const id=String(e.i).slice(0,20); ids.add(id);
    let a=animals.find(x=>x.nid===id);
    const kind=e.k==="w"?"wolf":"hare";
    if(!a){ a={kind,nid:id,x:num(e.x,-1,W,0),y:num(e.y,-1,D,0),z:num(e.z,0,12,1),path:[],speed:1.5,facing:"se",phase:0,think:1,alpha:0,leaving:false,state:"",attackT:1,lunge:0,howlT:0,fleeing:0}; animals.push(a); }
    a.tx=num(e.x,-1,W,a.x); a.ty=num(e.y,-1,D,a.y); a.tz=num(e.z,0,12,a.z); a.facing=FACINGS.includes(e.f)?e.f:a.facing; a.moving=e.m===1;
    a.alpha+=(num(e.a,0,1,1)-a.alpha)*Math.min(1,dt*6); a.leaving=e.lv===1;
    if(e.l===1&&a.lunge<=0){ a.lunge=0.25; }
    if(e.h===1) a.howlT=Math.max(a.howlT,0.5);
    a.hp=num(e.hp,0,WOLF_HP,WOLF_HP); if(e.hu===1) a.hurtT=Math.max(a.hurtT||0,0.12);
    if(e.dy===1){ if(!(a.dying>0)) a.dying=2.4; } else a.dying=0;
  }
  for(let i=animals.length-1;i>=0;i--){ const a=animals[i]; if(!ids.has(a.nid)) animals.splice(i,1); }
  const k=Math.min(1,dt*8);
  for(const a of animals){ if(a.tx===undefined) continue;
    if(Math.hypot(a.tx-a.x,a.ty-a.y)>3){a.x=a.tx;a.y=a.ty;}
    a.x+=(a.tx-a.x)*k; a.y+=(a.ty-a.y)*k; a.z+=(a.tz-a.z)*k;
    a.phase=a.moving?a.phase+dt*(a.kind==="wolf"?2.5:2)*4:0;
    a.lunge=Math.max(0,a.lunge-dt); a.howlT=Math.max(0,a.howlT-dt); a.hurtT=Math.max(0,(a.hurtT||0)-dt);
    if(a.dying>0) a.moving=false;
    if(a.lunge>0) a.lungeTo=[hero.x,hero.y];
  }
  for(const b of h.bt||[]){
    if(!b||b.p!==NET.myPeer) continue; const s=num(b.s,0,1e9,0);
    if(s>(lastBite[NET.hostPeer]||0)){ lastBite[NET.hostPeer]=s;
      const w=animals.filter(a=>a.kind==="wolf").sort((p,q)=>Math.hypot(p.x-hero.x,p.y-hero.y)-Math.hypot(q.x-hero.x,q.y-hero.y))[0];
      hurtHero(1,w||null); }
  }
  hero.hurtT=Math.max(0,hero.hurtT-dt);
}
