    db.collection("players").onSnapshot(snap=>applyPlayers(snap.docs),()=>{});
    db.collection("chat").onSnapshot(snap=>applyChat(snap.docs),()=>{});
    document.getElementById("chatBtn").hidden=false;
    if(NET.myId) await loadSave();
  }
  if(room){
    NET.room=room;
    room.onPeers(onPeersChange,()=>{ NET.room=null; remotes.clear(); renderPlayers(); });
    document.getElementById("chatBtn").hidden=false;
    renderPlayers();
  }
}


// ================= \u0418\u0433\u0440\u0430 \u043f\u043e \u043e\u0447\u0435\u0440\u0435\u0434\u0438: \u0441\u043f\u044f\u0449\u0438\u0435 \u0438\u0433\u0440\u043e\u043a\u0438 \u0438 \u0438\u0441\u0442\u043e\u0440\u0438\u044f \u0447\u0430\u0442\u0430 =================
const sleepers=new Map();       // id -> {kind:"sleeper", by, x,y,z,c,last}
const chatLog=[];               // [{id,t,by,ts,c}] \u2014 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0438\u0435 \u0441\u043e\u043e\u0431\u0449\u0435\u043d\u0438\u044f \u0438\u0437 \u0431\u0430\u0437\u044b
let lastPlayerWrite=0, lastPlayerJSON="", lastReadTs=0;
try{ lastReadTs=+localStorage.getItem("island_chat_read")||0; }catch(e){}
// \u043c\u043e\u044f \u0437\u0430\u043f\u0438\u0441\u044c \u00ab\u0433\u0434\u0435 \u044f \u0438 \u043a\u043e\u0433\u0434\u0430 \u0431\u044b\u043b\u00bb \u2014 \u0447\u0442\u043e\u0431\u044b \u0434\u0440\u0443\u0437\u044c\u044f \u0432\u0438\u0434\u0435\u043b\u0438 \u043c\u0435\u043d\u044f \u0441\u043f\u044f\u0449\u0438\u043c, \u043a\u043e\u0433\u0434\u0430 \u043c\u0435\u043d\u044f \u043d\u0435\u0442
function tickPlayerDoc(){
  if(!NET.db||!NET.myId) return;
  const now=Date.now(), rec={x:Math.round(hero.x*10)/10,y:Math.round(hero.y*10)/10,z:Math.round(hero.z*10)/10,c:myHueIdx,n:myNick};
  const j=JSON.stringify(rec);
  if(j===lastPlayerJSON&&now-lastPlayerWrite<60000) return;
  if(now-lastPlayerWrite<3000) return;
  lastPlayerWrite=now; lastPlayerJSON=j;
  NET.db.doc("players/"+NET.myId).set({...rec,last:now}).catch(()=>{});
}
function applyPlayers(docs){
  const now=Date.now(), seen=new Set();
  for(const s of docs){
    if(s.id===NET.myId) continue;
    const d=s.data(); if(!d) continue;
    const last=num(d.last,0,1e15,0); if(now-last>7*24*3600*1000) continue;   // \u043d\u0435\u0434\u0435\u043b\u044e \u043d\u0435 \u0437\u0430\u0445\u043e\u0434\u0438\u043b \u2014 \u043d\u0435 \u043f\u043e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u043c
    seen.add(s.id);
    let p=sleepers.get(s.id); if(!p){ p={kind:"sleeper",by:s.id,phase:Math.random()*6}; sleepers.set(s.id,p); }
    p.x=num(d.x,0,W-1,MX); p.y=num(d.y,0,D-1,MY); p.c=num(d.c|0,0,PLAYER_HUES.length-1,0)|0; p.last=last; p.nick=nickOf(d.n);
    const c=cellAt(Math.round(p.x),Math.round(p.y)); p.z=c?walkZ(c):num(d.z,0,12,1);
  }
  for(const k of [...sleepers.keys()]) if(!seen.has(k)){ sleepers.delete(k); const el=document.getElementById("tag-s-"+k); if(el) el.remove(); }
  renderPlayers();
}
// \u0441\u043f\u0438\u0442 \u0442\u043e\u0442, \u043a\u043e\u0433\u043e \u0441\u0435\u0439\u0447\u0430\u0441 \u043d\u0435\u0442 \u0432 \u043a\u043e\u043c\u043d\u0430\u0442\u0435
const onlineIds=()=>new Set([...remotes.values()].map(r=>r.by).filter(Boolean));
function activeSleepers(){ const on=onlineIds(); return [...sleepers.values()].filter(s=>!on.has(s.by)); }
function agoText(ts){
  const m=Math.max(1,Math.round((Date.now()-ts)/60000));
  if(m<60) return tr("ago_min",{n:m});
  const h=Math.round(m/60); if(h<48) return tr("ago_h",{n:h});
  return tr("ago_d",{n:Math.round(h/24)});
}
function drawSleeper(p){
  worldTransform(); ctx.imageSmoothingEnabled=false;
  const [fx,fy]=proj(p.x-MX,p.y-MY,p.z);
  ctx.fillStyle="rgba(20,10,40,.25)"; ctx.beginPath(); ctx.ellipse(fx,fy,14,5,0,0,Math.PI*2); ctx.fill();
  const sp=heroSprite("hero_se_0",p.c);
  // \u043b\u0435\u0436\u0438\u0442 \u043d\u0430 \u0431\u043e\u043a\u0443 \u043f\u043e\u0432\u0435\u0440\u0445 \u0441\u0432\u043e\u0435\u0439 \u043a\u043b\u0435\u0442\u043a\u0438: \u0440\u043e\u0441\u0442 \u0433\u0435\u0440\u043e\u044f \u0438\u0434\u0451\u0442 \u0432\u0434\u043e\u043b\u044c \u044d\u043a\u0440\u0430\u043d\u0430 \u043f\u043e \u0433\u043e\u0440\u0438\u0437\u043e\u043d\u0442\u0430\u043b\u0438
  ctx.save(); ctx.translate(Math.round(fx),Math.round(fy)-9); ctx.rotate(-Math.PI/2);
  if(sp) ctx.drawImage(sp,-Math.round(sp.width/2),-Math.round(sp.height/2)); else { ctx.fillStyle=hueCss(p.c); ctx.fillRect(-5,-22,10,44); }
  ctx.restore();
  // \u00abZzz\u00bb
  ctx.font="8px Silkscreen, monospace"; ctx.textAlign="left"; ctx.textBaseline="bottom";
  const k=((T*0.6+p.phase)%1);
  ctx.globalAlpha=1-k; ctx.lineWidth=3; ctx.strokeStyle="#1b1528"; ctx.strokeText("z",Math.round(fx+6+k*6),Math.round(fy-14-k*14));
  ctx.fillStyle="#e8e4ff"; ctx.fillText("z",Math.round(fx+6+k*6),Math.round(fy-14-k*14)); ctx.globalAlpha=1;
}

// ---- \u0438\u0441\u0442\u043e\u0440\u0438\u044f \u0447\u0430\u0442\u0430 \u0432 \u0431\u0430\u0437\u0435 ----
function postChat(text){
  if(!NET.db) return;
  const ts=Date.now();
  NET.db.collection("chat").doc(ts+"-"+Math.random().toString(36).slice(2,7)).set({t:text,by:NET.myId||"",n:myNick,ts,c:myHueIdx}).catch(()=>{});
}
function applyChat(docs){
  const list=[];
  for(const s of docs){ const d=s.data(); if(!d||typeof d.t!=="string") continue;
    list.push({id:s.id,t:d.t.slice(0,90),by:typeof d.by==="string"?d.by:"",n:nickOf(d.n),ts:num(d.ts,0,1e15,0),c:num(d.c|0,0,PLAYER_HUES.length-1,0)|0}); }
  list.sort((a,b)=>a.ts-b.ts);
  // \u0445\u0440\u0430\u043d\u0438\u043c \u0442\u043e\u043b\u044c\u043a\u043e 40 \u043f\u043e\u0441\u043b\u0435\u0434\u043d\u0438\u0445 \u2014 \u0441\u0442\u0430\u0440\u044b\u0435 \u0443\u0434\u0430\u043b\u044f\u0435\u043c
  if(list.length>40) for(const m of list.slice(0,list.length-40)) NET.db.collection("chat").doc(m.id).delete().catch(()=>{});
  chatLog.length=0; chatLog.push(...list.slice(-40));
  renderChatLog(); updateUnread(true);
}
function unreadCount(){ return chatLog.filter(m=>m.ts>lastReadTs&&m.by!==NET.myId).length; }
let unreadAnnounced=false;
function updateUnread(fromSnapshot){
  const n=unreadCount(), dot=document.getElementById("chatDot");
  if(dot){ dot.hidden=!n; dot.textContent=n>9?"9+":String(n); }
  if(fromSnapshot&&n&&!unreadAnnounced){ unreadAnnounced=true; say("unread","unread_sub",{n}); }
}
function markChatRead(){
  if(chatLog.length) lastReadTs=Math.max(lastReadTs,chatLog[chatLog.length-1].ts);
  try{ localStorage.setItem("island_chat_read",String(lastReadTs)); }catch(e){}
  updateUnread(false);
}
function personName(by){ if(by&&by===NET.myId) return tr("you"); return (by&&names[by])||tr("someone"); }
function renderChatLog(){
  const el=document.getElementById("chatLog"); if(!el) return;
  el.textContent="";
  if(!chatLog.length){ const e=document.createElement("div"); e.className="empty"; e.textContent=tr("chat_empty"); el.appendChild(e); return; }
  const ids=[...new Set(chatLog.map(m=>m.by).filter(b=>b&&!(b in names)))];
  if(ids.length&&NET.user) NET.user.profiles(ids).then(ps=>{ for(const id of ids) names[id]=ps[id]&&ps[id].name||""; renderChatLog(); renderPlayers(); }).catch(()=>{});
  for(const m of chatLog.slice(-12)){
    const row=document.createElement("div"); row.className="msg";
    const t=new Date(m.ts), hh=String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0");
    const tm=document.createElement("time"); tm.textContent=hh;
    const nm=document.createElement("b"); nm.textContent=(m.by&&m.by===NET.myId)?(myNick||tr("you")):(m.n||personName(m.by)); nm.style.color=hueCss(m.c);
    const tx=document.createElement("span"); tx.textContent=m.t;
    row.append(tm,nm,tx); el.appendChild(row);
  }
  el.scrollTop=el.scrollHeight;
}

// ---- 3D-\u0440\u0435\u0436\u0438\u043c \u0432\u043e \u0432\u0440\u0435\u043c\u044f \u043f\u043e\u0432\u043e\u0440\u043e\u0442\u0430: \u0441\u043f\u043b\u043e\u0448\u043d\u044b\u0435 \u0433\u0440\u0430\u043d\u0438 \u0441 \u0442\u0435\u043a\u0441\u0442\u0443\u0440\u0430\u043c\u0438 \u0438\u0437 \u0441\u043f\u0440\u0430\u0439\u0442\u043e\u0432 ----
const TEX={}, TN=34, SH=9;
function buildTextures(){
  const srcData=im=>{const c=document.createElement("canvas");c.width=im.width;c.height=im.height;const g=c.getContext("2d");g.drawImage(im,0,0);return g.getImageData(0,0,im.width,im.height)};
  const make=(w,h,fn,src)=>{const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d"),o=g.createImageData(w,h);
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){let [px,py]=fn(i,j);px=Math.max(0,Math.min(src.width-1,px|0));py=Math.max(0,Math.min(src.height-1,py|0));
      const si=(py*src.width+px)*4,di=(j*w+i)*4;o.data[di]=src.data[si];o.data[di+1]=src.data[si+1];o.data[di+2]=src.data[si+2];o.data[di+3]=255;}
    g.putImageData(o,0,0);return c};
  for(const n of ["block_grass","block_grass_2","block_grass_dark","block_stone_path","block_dirt","block_rock"]){
    const s=srcData(img[n]);
    TEX[n+"_top"]=make(TN,TN,(i,j)=>{const a=(i+.5)/TN,b=(j+.5)/TN;return [32+32*a-32*b,2+17*a+17*b]},s);
    TEX[n+"_L"]=make(TN,SH,(i,r)=>{const a=(i+.5)/TN;return [32*a,Math.floor(19+17*a)+1+r]},s);
    TEX[n+"_R"]=make(TN,SH,(i,r)=>{const a=(i+.5)/TN;return [63.5-32*a,Math.floor(19+17*a)+1+r]},s);
  }
}
function draw3D(anchor){
  const S=RS, OX=ROX, OY=ROY;
  const sub=(p,q)=>[p[0]-q[0],p[1]-q[1]];
  function face(tex,p0,e1,e2){const w=tex.width,h=tex.height;
    ctx.setTransform(S*e1[0]/w,S*e1[1]/w,S*e2[0]/h,S*e2[1]/h,OX+S*p0[0],OY+S*p0[1]);
    ctx.drawImage(tex,-0.6,-0.6,w+1.2,h+1.2);}
  const SIDES=[{n:[1,0],dx:1,dy:0,ax:0,ay:1},{n:[0,1],dx:0,dy:1,ax:1,ay:0},{n:[-1,0],dx:0,dy:0,ax:0,ay:1},{n:[0,-1],dx:0,dy:0,ax:1,ay:0}];
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
  for(const c of cells){
    if(c!==anchor&&c!==hutAnchor&&c!==NPCC&&!cellVisible(c)){ continue; }
    const X0=c.x-MX-.5, Y0=c.y-MY-.5;
    for(const sd of SIDES){
      const nu=sd.n[0]*ca-sd.n[1]*sa, nv=sd.n[0]*sa+sd.n[1]*ca; if(nu+nv<=0.001) continue;
      const nb=cellAt(c.x+sd.n[0],c.y+sd.n[1]), nh=nb?(nb.water?nb.L-1:nb.L):0, side=(nu-nv)<0?"_L":"_R", sx=X0+sd.dx, sy=Y0+sd.dy;
      for(let z=nh;z<c.L;z++){const p0=proj(sx,sy,z+1);face(TEX[(z<2?"block_rock":"block_grass")+side],p0,sub(proj(sx+sd.ax,sy+sd.ay,z+1),p0),sub(proj(sx,sy,z),p0));}
      if(c.st){const p0=proj(sx,sy,c.L+.5);face(TEX["block_stone_path"+side],p0,sub(proj(sx+sd.ax,sy+sd.ay,c.L+.5),p0),sub(proj(sx,sy,c.L),p0));}
    }
    const Z=c.st?c.L+.5:c.L, top=c.st?"block_stone_path":TOP_SPRITE[c.t], p0=proj(X0,Y0,Z);
    if(c.fire){ worldTransform(); drawFire(c); }
    if(c.water){ worldTransform(); drawWater(c); drawWaterFx(c); } else face(TEX[top+"_top"],p0,sub(proj(X0+1,Y0,Z),p0),sub(proj(X0,Y0+1,Z),p0));
    if(c.stump){ worldTransform(); drawStump(c); }
    if(c.props.length){
      const ctr=proj(c.x-MX,c.y-MY,c.L);
      for(const name of c.props){
        if(name.startsWith("fence")){ // \u0437\u0430\u0431\u043e\u0440 \u043f\u043b\u0430\u0432\u043d\u043e \u043d\u0430\u043a\u043b\u043e\u043d\u044f\u0435\u0442\u0441\u044f \u0432\u0434\u043e\u043b\u044c \u0441\u0432\u043e\u0435\u0439 \u043e\u0441\u0438
          const im=img.fence_left, ax=name==="fence_left"?[0,1]:[1,0];
          const u=ax[0]*ca-ax[1]*sa, v=ax[0]*sa+ax[1]*ca; let ex=(u-v)*HW, ey=(u+v)*HH; if(ey<0){ex=-ex;ey=-ey}
          ctx.setTransform(S*(-ex/32),S*((17-ey)/32),0,S,OX+S*ctr[0],OY+S*(ctr[1]+4)); ctx.drawImage(im,-im.width/2,-im.height);
        } else { worldTransform(); drawProp(img[name],name,ctr[0],ctr[1],c); }
      }
    }
    if(c===anchor){ worldTransform(); drawHero(); }
    if(HUT&&c===hutAnchor) drawHut();
    if(npc&&c===NPCC) drawNPC();
    if(c.ents) for(const a of c.ents) drawEnt(a);
  }
}

// ---- \u0413\u0435\u0440\u043e\u0439: \u0441\u043f\u0440\u0430\u0439\u0442\u044b hero_<se|sw|ne|nw>_<0..3>, \u0435\u0441\u043b\u0438 \u0435\u0441\u0442\u044c; \u0438\u043d\u0430\u0447\u0435 \u0432\u0440\u0435\u043c\u0435\u043d\u043d\u044b\u0439 \u043f\u0438\u043a\u0441\u0435\u043b\u044c\u043d\u044b\u0439 \u0447\u0435\u043b\u043e\u0432\u0435\u0447\u0435\u043a ----
function drawHero(){
  if(hero.hurtT>0&&Math.floor(hero.hurtT*14)%2) return;
  const [fx,fy]=proj(hero.x-MX,hero.y-MY,hero.z);
  ctx.save(); ctx.imageSmoothingEnabled=false;
  ctx.fillStyle="rgba(20,10,40,.28)"; ctx.beginPath(); ctx.ellipse(fx,fy,9,4.5,0,0,Math.PI*2); ctx.fill();
  // \u0446\u0438\u043a\u043b \u0448\u0430\u0433\u0430 1-2-3-2, \u043a\u0430\u0434\u0440 0 \u2014 \u0441\u0442\u043e\u0439\u043a\u0430
  const frame=hero.moving?[1,2,3,2][Math.floor(hero.phase/Math.PI*2)%4]:0;
  // \u0441\u043f\u0440\u0430\u0439\u0442\u044b \u0441\u043c\u043e\u0442\u0440\u044f\u0442 \u0432\u043f\u0440\u0430\u0432\u043e (se/ne); \u0432\u043b\u0435\u0432\u043e \u2014 \u0437\u0435\u0440\u043a\u0430\u043b\u044c\u043d\u043e, \u0435\u0441\u043b\u0438 \u043d\u0435\u0442 \u0441\u0432\u043e\u0438\u0445 sw/nw
  let hn=`hero_${hero.facing}_${frame}`, mirror=false;
  if(!img[hn]&&hero.facing[1]==="w"){ hn=`hero_${hero.facing[0]}e_${frame}`; mirror=true; }
  if(hero.atk){ const as=atkSprite(hero.facing,hero.atk.t,myHueIdx), [lx,ly]=atkLunge(hero.facing,hero.atk.t);
    if(as&&as.sp){ ctx.save(); ctx.translate(Math.round(fx)+lx,Math.round(fy)+ly); if(as.mirror) ctx.scale(-1,1); ctx.drawImage(as.sp,-Math.round(as.sp.width/2),-as.sp.height+2); ctx.restore();
      drawSlash(fx,fy,hero.facing,hero.atk.t); ctx.restore(); return; } }
  const sp=heroSprite(hn,myHueIdx);
  if(sp){ ctx.translate(Math.round(fx),Math.round(fy)); if(mirror) ctx.scale(-1,1);
    ctx.drawImage(sp,-Math.round(sp.width/2),-sp.height+2); ctx.restore();
    if(hero.atk){ ctx.save(); drawClubSwing(fx,fy,hero.facing[1]==="e"?1:-1,hero.atk.t); ctx.restore(); }
    return; }
  const front=hero.facing[0]==="s", flip=hero.facing[1]==="w"?-1:1;
  const sw=hero.moving?Math.round(Math.sin(hero.phase)*2):0, bob=hero.moving&&Math.abs(Math.sin(hero.phase))>0.7?1:0;
  ctx.translate(Math.round(fx),Math.round(fy)-bob); ctx.scale(flip,1);
  const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
  // \u043a\u043e\u043d\u0442\u0443\u0440
  const O="#1b1528";
  R(-6,-30,12,11,O); R(-7,-20,14,13,O); R(-9,-19,3,10,O); R(6,-19,3,10,O);
  R(-5,-10,5,10,O); R(0,-10,5,10,O);
  // \u043d\u043e\u0433\u0438
  const lL=Math.max(0,sw), lR=Math.max(0,-sw);
  R(-4,-9,3,9-lL,"#3b3550"); R(-4,-2-lL,3,2,"#2a1f14");
  R(1,-9,3,9-lR,"#3b3550");  R(1,-2-lR,3,2,"#2a1f14");
  // \u0440\u0443\u043a\u0438
  R(-8,-18+sw,2,8,front?"#f1c27d":"#2f5fc4"); R(6,-18-sw,2,8,"#f1c27d");
  // \u0442\u0443\u043d\u0438\u043a\u0430 \u0438 \u043f\u043e\u044f\u0441
  R(-6,-19,12,11,"#3a6fd8"); R(-6,-19,12,2,"#5a8ff0"); R(-6,-11,12,2,"#6b4423"); R(-1,-11,2,2,"#ffd66b");
  // \u0433\u043e\u043b\u043e\u0432\u0430
  R(-5,-29,10,10,"#f1c27d");
  if(front){ R(-5,-30,10,3,"#6a3f1c"); R(-5,-27,2,3,"#6a3f1c"); R(0,-25,1,2,"#1b1528"); R(3,-25,1,2,"#1b1528"); R(1,-21,2,1,"#c98a5a"); }
  else { R(-5,-30,10,8,"#6a3f1c"); R(-5,-22,10,1,"#57321a"); }
  ctx.restore();
}

function cellQuad(c){
  const Z=walkZ(c), X=c.x-MX, Y=c.y-MY;
  return [proj(X-.5,Y-.5,Z),proj(X+.5,Y-.5,Z),proj(X+.5,Y+.5,Z),proj(X-.5,Y+.5,Z)];
}
function quadPath(pts){ctx.beginPath();ctx.moveTo(...pts[0]);for(let i=1;i<4;i++)ctx.lineTo(...pts[i]);ctx.closePath()}
function drawOverlay(now){
  worldTransform();
  if(showGrid){ctx.strokeStyle="rgba(255,255,255,.3)";ctx.lineWidth=1;for(const c of cells){quadPath(cellQuad(c));ctx.stroke()}}
  if(hover&&!anim){quadPath(cellQuad(hover));ctx.fillStyle="rgba(255,255,255,.16)";ctx.fill();ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=1;ctx.stroke()}
  if(marker){ // \u043a\u043e\u043b\u044c\u0446\u043e \u0432 \u0442\u043e\u0447\u043a\u0435 \u043d\u0430\u0437\u043d\u0430\u0447\u0435\u043d\u0438\u044f, \u043b\u0435\u0436\u0438\u0442 \u043d\u0430 \u0437\u0435\u043c\u043b\u0435

  // \u0442\u0435\u043b\u0435\u0444\u043e\u043d: ~1.3x, \u043a\u043e\u043c\u043f\u044c\u044e\u0442\u0435\u0440: 2x \u2014 \u0432 \u0440\u043e\u0432\u043d\u044b\u0445 \u0444\u0438\u0437\u0438\u0447\u0435\u0441\u043a\u0438\u0445 \u043f\u0438\u043a\u0441\u0435\u043b\u044f\u0445
  zoomK=Math.max(kMin(),Math.round((Math.min(r.width,r.height)<560?1.34:2)*dprNow())); scale=zoomK/dprNow();
  document.getElementById("zVal").textContent=(Math.round(scale*10)/10)+"x";
  panX=r.width/2-hx*scale; panY=r.height/2-(hy-14)*scale;
  requestAnimationFrame(frame);
});
</script>
