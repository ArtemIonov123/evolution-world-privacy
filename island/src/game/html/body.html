
<div class="bar hud">
  <h1 data-i18n="title_h" hidden>Wyspa</h1>
  <button class="hface" id="hudFace" type="button" data-i18n-label="win_hero" aria-label="Postać"><canvas id="hudFaceCv" width="48" height="48" aria-hidden="true"></canvas><b id="hudLv">1</b></button>
  <div class="hmid">
    <div class="hrow"><b id="hudName">—</b><span class="clock" aria-live="off"><svg id="clkIcon" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"></svg><span id="clkTime">12:00</span></span></div>
    <div class="hbar hhp" role="img" id="hudHp" aria-label="HP"><i id="hudHpFill"></i><svg class="hheart" viewBox="0 0 9 8" width="14" height="13" aria-hidden="true" shape-rendering="crispEdges"><path d="M1 0h2v1h1v1h1V1h1V0h2v1h1v3H8v1H7v1H6v1H5v1H4V7H3V6H2V5H1V4H0V1h1z" fill="#1b1528"/><path d="M1 1h2v1h1v1h1V2h1V1h2v3H7v1H6v1H5v1H4V6H3V5H2V4H1z" fill="#e8402c"/><path d="M2 1h1v1H2z" fill="#ff9a8a"/></svg><span id="hudHpTxt">5 / 5</span></div>
    <div class="hbar hxp" role="img" id="hudXp" aria-label="XP"><i id="hudXpFill"></i><em id="hudLvTag">Lv 1</em><span id="hudXpTxt">0 / 20 XP</span></div>
  </div>
  <div class="hcur">
    <div class="hpill" id="hdCoins" role="img" aria-label="0"><img id="hdCoinIcon" alt="" width="18" height="18"><b id="hdCoinN">0</b></div>
    <div class="hpill hcr" id="hudCr" role="img" aria-label="0"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" shape-rendering="crispEdges"><path d="M8 0l6 5-6 11-6-11z" fill="#1b1528"/><path d="M8 1.5l4.6 3.8L8 13.8 3.4 5.3z" fill="#7a6cff"/><path d="M8 1.5l4.6 3.8H3.4z" fill="#b8a8ff"/><path d="M6 3h2v2H6z" fill="#fff"/></svg><b id="hudCrN">0</b><button class="hplus" id="crPlus" type="button" data-i18n-label="cr_buy" aria-label="+">+</button></div>
  </div>
  <button class="btn" id="menuBtn" aria-expanded="false" aria-controls="menu" data-i18n-label="menu" aria-label="Menu"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <div class="menu" id="menu">
    <div class="lang" role="group" aria-label="Język / Язык">
    <button class="btn" data-lang="pl" aria-pressed="true">PL</button><button class="btn" data-lang="ru" aria-pressed="false">RU</button>
  </div>
    <button class="btn" id="grid" aria-pressed="false" data-i18n="grid">Siatka</button>
    <button class="btn" id="wind" aria-pressed="true" data-i18n="wind">Wiatr</button>
    <button class="btn" id="follow" aria-pressed="true" data-i18n="follow">Kamera za bohaterem</button>
    <button class="btn" id="skipTime">Przewiń do nocy</button>
    <button class="btn" id="nickBtn" data-i18n="nick_change">Zmień nick</button>
    <button class="btn" id="inviteBtn" hidden data-i18n="invite">Zaproś znajomego</button>
    <button class="btn" id="editBtn" hidden data-i18n="ed_open">Edytor mapy</button>
    <button class="btn" id="fsBtn" hidden data-i18n="fs_on">Pełny ekran</button>
  </div>
</div>
<div class="stage">
  <canvas id="cv"></canvas>
  <div class="ctrl">
    <button class="round" id="rotL" data-i18n-label="rot_l" aria-label="Obróć w lewo (Q)"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M8 7a7 7 0 1 1-3 7"/><path d="M3 4v5h5" stroke-linecap="butt"/></svg></button>
    <button class="round" id="chatBtn" hidden data-i18n-label="chat" aria-label="Czat"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 5h16v11H10l-5 4v-4H4z" stroke-linejoin="round"/></svg><span class="dot" id="chatDot" hidden></span></button>
    <button class="round" id="rotR" data-i18n-label="rot_r" aria-label="Obróć w prawo (E)"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="square"><path d="M16 7a7 7 0 1 0 3 7"/><path d="M21 4v5h-5" stroke-linecap="butt"/></svg></button>
  </div>
  <div class="tags" id="tags" aria-hidden="true"></div>
  <div class="players panel" id="players" hidden></div>
  <div class="chatbar panel" id="chatbar" hidden>
    <div class="chatlog" id="chatLog" aria-live="polite"></div>
    <form id="chatForm" class="chatrow"><input id="chatIn" maxlength="80" autocomplete="off" data-i18n-ph="chat_ph" placeholder="Napisz wiadomość…"><button class="btn" data-i18n="send">Wyślij</button></form>
    <div class="quick"><button class="btn" data-q="q_hi">Cześć!</button><button class="btn" data-q="q_come">Chodź tu!</button><button class="btn" data-q="q_wolves">Wilki!</button><button class="btn" data-q="q_thanks">Dzięki!</button></div>
  </div>
  <div class="hp panel" id="hp" role="img" aria-label="Zdrowie"></div>
  <div class="party panel" id="party" hidden></div>
  <div class="skarc" id="skArc" aria-hidden="true"></div>
  <div class="skills" id="skills" hidden></div>
  <button class="atkb" id="atkBtn" type="button" data-i18n-label="atk_btn" aria-label="Atak"></button>
  <div class="upd panel pask" id="partyAsk" hidden role="alertdialog"><span id="partyAskText"></span><button class="btn big" id="partyYes" type="button"></button><button class="btn" id="partyNo" type="button"></button></div>
  <div class="bossbar panel" id="bossBar" hidden><b id="bossName"></b><i><s id="bossHp"></s></i><small id="bossNum"></small></div>
  <div class="inv panel" id="inv" hidden></div>
  <div class="hotbar" id="hotbar">
    <button class="hb" data-win="bag" data-i18n-label="win_bag" aria-label="Torba" aria-pressed="false"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M7 8h10l2 12H5z M9 8V6a3 3 0 0 1 6 0v2" stroke-linejoin="round"/></svg></button>
    <button class="hb" data-win="equip" data-i18n-label="win_equip" aria-label="Ekwipunek" aria-pressed="false"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z" stroke-linejoin="round"/></svg></button>
    <button class="hb" data-win="hero" data-i18n-label="win_hero" aria-label="Postać" aria-pressed="false"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 4-7 8-7s7 2 8 7"/></svg></button>
    <button class="hb" data-win="quests" data-i18n-label="win_quests" aria-label="Zadania" aria-pressed="false"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 4h11v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-2h9M9 8h5M9 12h5" stroke-linejoin="round"/></svg><span class="dot" id="qDot" hidden>!</span></button>
  </div>
  <div class="edpanel panel" id="edPanel" hidden></div>
  <div class="win panel" id="win" hidden role="dialog" aria-labelledby="winTitle">
    <div class="whead"><b id="winTitle"></b><button class="btn wx" id="winClose" data-i18n-label="close" aria-label="Zamknij">✕</button></div>
    <div class="wbody" id="winBody"></div>
  </div>
  <div class="actions" id="actions" hidden>
    <button class="btn big" id="buildFire" data-i18n="build_fire">Ognisko (3 drewna)</button>
    <button class="btn" id="cancelPlace" data-i18n="cancel" hidden>Anuluj</button>
  </div>
  <div class="fishbar" id="fishbar" hidden>
    <button id="hook" class="hook" hidden><span data-i18n="hook_btn">ZATNIJ!</span><i id="hookTime"></i></button>
    <button id="reelIn" class="reel" data-i18n="reel_btn">Zwiń wędkę</button>
  </div>
  <div class="dialog panel" id="dialog" hidden role="dialog" aria-labelledby="dlgName">
    <canvas id="portrait" width="64" height="64" aria-hidden="true"></canvas>
    <div class="dlg-body"><b id="dlgName"></b><p id="dlgText"></p><div class="dlg-opts" id="dlgOpts"></div></div>
  </div>
  <div class="fade" id="fade"></div>
  <div class="upd panel" id="upd" hidden role="status"><span data-i18n="upd_text">Nowa wersja gry!</span><button class="btn big" id="updBtn" data-i18n="upd_btn">Odśwież</button></div>
  <div class="nickwrap" id="nickWrap" hidden>
    <form class="nickdlg panel" id="nickForm" role="dialog" aria-modal="true" aria-labelledby="nickTitle">
      <b id="nickTitle" data-i18n="nick_title">Jak masz na imię?</b>
      <p data-i18n="nick_text">Ten nick zobaczą inni gracze nad twoim bohaterem.</p>
      <input id="nickIn" maxlength="16" autocomplete="nickname" spellcheck="false" data-i18n-ph="nick_ph" placeholder="Twój nick">
      <span class="nickerr" id="nickErr" hidden data-i18n="nick_err">Wpisz co najmniej 2 znaki</span>
      <button class="btn big" data-i18n="nick_ok">Graj</button>
    </form>
  </div>
  <div class="toast panel" id="toast" role="status" aria-live="polite"></div>
</div>
