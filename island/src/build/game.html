<meta charset="utf-8">
<title>Изометрический остров</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2d2440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=PT+Sans:wght@400;700&display=swap">
<style>
/* Layout: full-screen game canvas on lavender; compact pixel toolbar on top (toggles fold into a menu on phones);
   round zoom/rotate controls float on the right for the thumb; status bottom-left, catch panel bottom-right (top-left on phones). */
:root{
  --sky:#a99ad6; --panel:#2d2440; --panel-2:#3d3257; --edge:#1b1528;
  --ink:#f4efff; --muted:#c9bde8; --accent:#ffd66b;
  --f-display:"Silkscreen","Courier New",monospace;
  --f-body:"PT Sans",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);overflow:hidden;display:flex;flex-direction:column;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}

/* верхняя панель */
.bar{position:relative;z-index:5;display:flex;align-items:center;gap:8px;background:var(--panel);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar h1{font-family:var(--f-display);font-size:15px;font-weight:400;letter-spacing:.06em;margin:0 auto 0 0;color:var(--accent);white-space:nowrap}
.btn{font-family:var(--f-display);font-size:12px;color:var(--ink);background:var(--panel-2);border:2px solid var(--edge);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);padding:6px 10px;cursor:pointer;border-radius:0;min-height:34px}
.btn:hover{background:#4b3e6b}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.lang{display:flex}
.lang .btn{padding:6px 9px}
.lang .btn+.btn{border-left:0}
.menu{position:absolute;top:100%;right:max(10px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:stretch;
  background:var(--panel);border:2px solid var(--edge);padding:8px;gap:8px;min-width:200px;max-height:calc(100dvh - 80px);overflow-y:auto}
.menu:not(.open){display:none}
.menu .btn{min-height:42px;font-size:12px;text-align:left}
.menu .lang .btn{flex:1;text-align:center}
#menuBtn{display:block;line-height:0;padding:8px 10px;align-self:stretch;min-width:44px}
/* HUD: портрет, здоровье, опыт, золото, кристаллы */
.hud{gap:10px;padding-block:6px;align-items:center}
.hface{position:relative;flex:none;width:52px;height:52px;padding:0;border-radius:50%;border:3px solid #c8a040;background:radial-gradient(circle at 40% 35%,#5a4a84,#2b2340);cursor:pointer;
  box-shadow:0 0 0 2px var(--edge),inset 0 -3px 0 rgba(0,0,0,.35);overflow:visible}
.hface canvas{width:46px;height:46px;border-radius:50%;image-rendering:pixelated;display:block}
.hface b{position:absolute;right:-5px;bottom:-4px;min-width:17px;height:17px;padding:0 3px;border-radius:9px;background:var(--panel);border:2px solid #c8a040;
  font:400 10px/13px var(--f-display);color:#ffd66b;text-align:center;box-sizing:border-box}
.hmid{flex:1;min-width:0;max-width:440px;display:flex;flex-direction:column;gap:3px}
.hcur{margin-left:auto}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:6px;min-width:0}
.hrow b{font-family:var(--f-display);font-weight:400;font-size:13px;color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hud .clock{margin:0;padding:1px 6px;font-size:11px;flex:none}
.hbar{position:relative;height:16px;border:2px solid var(--edge);background:#2b2340;overflow:hidden;box-shadow:inset 0 2px 0 rgba(0,0,0,.35)}
.hbar i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .25s}
.hhp i{background:linear-gradient(#ff6a5a,#d8302a)}
.hxp i{background:linear-gradient(#a890ff,#6a4ed8)}
.hbar span{position:relative;display:block;text-align:center;font:700 11px/12px var(--f-body);color:#fff;text-shadow:1px 1px 0 #1b1528}
.hhp .hheart{position:absolute;left:2px;top:0;z-index:1}
.hxp em{position:absolute;left:0;top:0;bottom:0;z-index:1;padding:0 5px;background:#3d2e7a;border-right:2px solid var(--edge);font:400 10px/12px var(--f-display);font-style:normal;color:#e8dcff}
.hcur{flex:none;display:flex;flex-direction:column;gap:4px}
.hpill{display:flex;align-items:center;gap:5px;height:22px;padding:0 6px;background:var(--panel-2);border:2px solid var(--edge);min-width:78px}
.hpill img{width:18px;height:18px;image-rendering:pixelated}
.hpill b{font-family:var(--f-display);font-weight:400;font-size:12px;color:#ffd66b;flex:1}
.hcr b{color:#b8a8ff}
.hplus{width:24px;height:24px;margin-right:-5px;padding:0;border:2px solid #1b1528;background:linear-gradient(#ffe680,#ffb820);color:#1b1528;font:900 18px/18px var(--f-body);cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 6px rgba(255,214,107,.6)}
.hplus:active{transform:translateY(1px)}
.hp{display:none!important}
.hbar.art{border:0;background:none;box-shadow:none;height:22px;image-rendering:pixelated;overflow:visible}
.hbar.art i{left:6px;top:5px;bottom:5px;background:none;border-style:solid;image-rendering:pixelated}
.hbar.art span{line-height:22px;font-size:12px}
.hhp.art .hheart{left:6px;top:4px}
.hxp.art em{left:6px;top:5px;bottom:5px;line-height:12px;border-right:0;background:rgba(27,21,40,.75)}
.hface.art{border:0;box-shadow:none;background:radial-gradient(circle,#4a3c70 62%,transparent 63%);width:66px;height:66px;margin-bottom:8px}
.hface.art canvas{position:absolute;left:9px;top:9px;width:48px;height:48px}
.hface .hframe{position:absolute;left:-2px;top:-2px;width:70px;height:70px;image-rendering:pixelated;pointer-events:none}
.hface b{left:50%;right:auto!important;bottom:-12px!important;transform:translateX(-50%);border-radius:0!important;height:18px!important;min-width:30px!important;padding:0 5px!important;
  background:#1b1528!important;border:2px solid #ffd66b!important;font:400 12px/14px var(--f-display)!important;color:#ffd66b;z-index:2;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.hface b.art{border:0;background:center/100% 100% no-repeat;width:22px;height:22px;min-width:0;padding:0;line-height:22px;right:-4px;bottom:-3px;z-index:1;text-shadow:1px 1px 0 #1b1528}
.hpill img{width:20px;height:20px;image-rendering:pixelated}
.hplus.art{border:0;background:center/100% 100% no-repeat;width:24px;height:24px;image-rendering:pixelated}
#menuBtn.art{background:none;border:0;box-shadow:none;padding:0;min-width:0}
#menuBtn.art img{width:44px;height:44px;image-rendering:pixelated;display:block}

/* сцена */
.stage{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:none;outline:none}
canvas.drag{cursor:grabbing}
.panel{background:var(--panel);border:2px solid var(--edge)}
.panel b{font-family:var(--f-display);font-weight:400;color:var(--accent);font-size:12px;letter-spacing:.05em}

/* круглые кнопки зума и поворота справа */
.ctrl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px}
.round{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;padding:0;
  font-family:var(--f-body);font-weight:700;color:var(--ink);background:var(--panel);border:2px solid var(--edge);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);cursor:pointer}
.round:active{transform:translateY(1px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.round:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zoom{font-family:var(--f-display);font-size:11px;color:var(--panel);background:rgba(255,255,255,.55);padding:1px 5px}
.ctrl .gap{height:6px}

.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:4;
  padding:6px 12px;font-size:14px;line-height:1.4;max-width:min(460px,calc(100% - 24px));text-align:center;pointer-events:none;
  opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
.toast span{color:var(--muted)}
.inv{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding:8px 10px;max-width:calc(100% - 32px)}
.inv .empty{font-size:13px;color:var(--muted);margin-top:2px}
.inv .slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.inv .slot{position:relative;width:44px;height:44px;background:var(--panel-2);border:2px solid var(--edge);display:grid;place-items:center}
.inv .slot img{width:32px;height:32px;image-rendering:pixelated}
.inv .slot span{position:absolute;right:2px;bottom:0;font-family:var(--f-display);font-size:11px;color:var(--ink);text-shadow:1px 1px 0 var(--edge)}

/* рыбалка */
.fishbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;gap:10px}
.fishbar button{font-family:var(--f-display);color:var(--ink);background:var(--panel-2);border:2px solid var(--edge);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);cursor:pointer;border-radius:0}
.fishbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fishbar .reel{font-size:12px;padding:8px 14px;min-height:40px}
.fishbar .hook{position:relative;overflow:hidden;font-size:22px;padding:16px 30px 20px;min-width:200px;background:var(--accent);color:var(--panel);
  border:3px solid var(--edge);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 0 0 4px rgba(255,214,107,.35);animation:pulse .45s ease-in-out infinite alternate}
.fishbar .hook i{position:absolute;left:0;bottom:0;height:6px;width:100%;background:#e8402c}
@keyframes pulse{to{transform:scale(1.08);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 0 0 8px rgba(255,214,107,.15)}}
@media (prefers-reduced-motion:reduce){.fishbar .hook{animation:none}}

/* часы, здоровье, действия, затемнение */
.bar h1{margin-right:0}
.hdcoin{display:flex;align-items:center;gap:3px;margin-left:4px;padding-left:7px;border-left:2px solid var(--edge);color:#ffd66b}
.hdcoin img{width:16px;height:16px;image-rendering:pixelated}
.clock{display:flex;align-items:center;gap:5px;margin-right:auto;font-family:var(--f-display);font-size:12px;color:var(--ink);
  background:var(--panel-2);border:2px solid var(--edge);padding:3px 7px;font-variant-numeric:tabular-nums}
.hp{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12px;display:flex;gap:2px;padding:5px 7px}
.hp svg{display:block}
.actions{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center}
.actions .big{font-size:14px;padding:10px 16px;min-height:44px;background:var(--accent);color:var(--panel)}
.actions .btn{min-height:44px}
.fade{position:absolute;inset:0;background:#0b0814;opacity:0;pointer-events:none;transition:opacity .6s ease}
.inv .slot.edible{cursor:pointer;outline:2px solid #ffb070;outline-offset:-2px}
/* мультиплеер: подписи, облачка, игроки, чат */
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;transform-origin:0 0;width:0}
.tag .nm{font-size:11px;font-weight:700;color:#fff;background:rgba(27,21,40,.78);border:2px solid #3a7be0;padding:0 5px;white-space:nowrap;line-height:15px}
.tag .bubble{max-width:180px;width:max-content;font-size:13px;line-height:1.3;color:#1b1528;background:#fffdf4;border:2px solid #1b1528;padding:3px 7px;
  box-shadow:2px 2px 0 rgba(27,21,40,.35);overflow-wrap:anywhere;text-align:center}
.players{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:12px;padding:6px 9px;font-size:12px;max-width:180px}
.players .prow{display:flex;align-items:center;gap:6px;min-width:0;line-height:1.5}
.players .prow i{width:9px;height:9px;flex:none;border:1px solid var(--edge)}
.players .prow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatbar{position:absolute;left:50%;transform:translateX(-50%);top:12px;width:min(520px,calc(100% - 280px));padding:8px;display:flex;flex-direction:column;gap:6px;z-index:5}
.chatrow{display:flex;gap:6px}
.chatrow input{flex:1;min-width:0;font:15px var(--f-body);padding:8px 10px;border:2px solid var(--edge);background:#fffdf4;color:#1b1528;border-radius:0}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.chatlog{max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.35;padding:2px 2px 4px;border-bottom:1px solid var(--panel-2)}
.chatlog .msg{display:flex;gap:6px;min-width:0}
.chatlog time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.chatlog b{flex:none;font-weight:700}
.chatlog span{min-width:0;overflow-wrap:anywhere}
.chatlog .empty{color:var(--muted)}
.round{position:relative}
.round .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#e8402c;color:#fff;
  font:700 11px/14px var(--f-body);border:2px solid var(--edge);display:grid;place-items:center}
.players .prow.off{opacity:.65}
.quick .btn{font-family:var(--f-body);font-weight:700;font-size:13px;letter-spacing:0}
/* кнопки окон и окна персонажа */
.hotbar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:3}
.skills{position:absolute;right:calc(max(16px,env(safe-area-inset-right,0px)) + 62px);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:3;display:flex;gap:8px;align-items:flex-end}
.skb{position:relative;width:52px;height:52px;padding:0;display:grid;place-items:center;background:var(--panel);border:2px solid var(--edge);border-radius:50%;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);cursor:pointer;overflow:hidden}
.skb::after{content:"";position:absolute;inset:0;background:conic-gradient(rgba(10,6,20,.72) calc(var(--cd,0)*360deg),transparent 0);pointer-events:none}
.skb.active{box-shadow:inset 0 0 0 2px #7cf07a,0 0 10px rgba(124,240,122,.6)}
.skb::after{border-radius:50%}
.skb .sklv{bottom:6px}
.skb.locked{filter:grayscale(1) brightness(.6);cursor:default}
.skb .sklv{display:none;position:absolute;bottom:1px;left:0;right:0;font:700 9px/1 var(--f-body);font-style:normal;color:#fff;text-align:center;z-index:1}
.skb.locked .sklv{display:block}
.skb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skic{display:inline-grid;place-items:center;image-rendering:pixelated}
.skrow{display:flex;gap:8px;align-items:flex-start;margin:4px 0}
.skrow small{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.classdlg{width:min(520px,100%)}
.clrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.clcard{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 8px;background:var(--panel-2);border:2px solid var(--edge);color:var(--ink);cursor:pointer;text-align:center;font:inherit}
.clcard.on{box-shadow:inset 0 0 0 2px var(--accent)}
.clcard:hover,.clcard:focus-visible{border-color:var(--accent);outline:none}
.clcard b{font-family:var(--f-display);font-weight:400;color:var(--accent);font-size:14px}
.clcard small{font-size:12px;color:var(--muted);line-height:1.35}
.clcard ul{margin:4px 0 0;padding:0;list-style:none;font-size:12px;line-height:1.5}
.clcard ul li::before{content:"\25C6  ";color:var(--accent)}
.clpic{width:72px;height:90px;image-rendering:pixelated}
@media (max-width:720px){ .skills{right:calc(max(10px,env(safe-area-inset-right,0px)) + 60px);bottom:calc(10px + env(safe-area-inset-bottom,0px));flex-direction:column-reverse;gap:6px} .skb{width:48px;height:48px} }
@media (max-height:500px){ .skills{right:calc(max(10px,env(safe-area-inset-right,0px)) + 166px);bottom:calc(8px + env(safe-area-inset-bottom,0px));flex-direction:row} .skb{width:42px;height:42px} }
.party{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12px;z-index:3;padding:5px 8px;font-size:12px;min-width:150px;max-width:220px}
.party b{display:block;font-family:var(--f-display);font-weight:400;font-size:11px;color:var(--accent);letter-spacing:.05em;margin-bottom:2px}
.party .pm{display:flex;align-items:center;gap:6px;line-height:1.6;min-width:0}
.party .pm i{width:9px;height:9px;flex:none;border:1px solid var(--edge)}
.party .pm span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.party .hpb{display:block;flex:none;width:42px;height:6px;border:1px solid var(--edge);background:#3d3257}
.party .hpb s{display:block;height:100%;background:#e8402c}
.party .zn{min-height:20px;padding:0 5px;font-size:10px}
.players .prow.pick{width:100%;background:none;border:0;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer}
.players .prow.pick:hover span{text-decoration:underline}
.players .pmenu{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0 5px 15px}
.players .pmenu .btn{min-height:28px;padding:2px 7px;font-size:11px}
.upd.pask{top:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));flex-wrap:wrap;justify-content:center;max-width:min(520px,calc(100% - 20px))}
.upd.pask span{white-space:normal;text-align:center}
@media (max-width:720px){ .party{left:max(10px,env(safe-area-inset-left,0px));top:10px;font-size:11px;min-width:130px;max-width:170px} .upd.pask{bottom:calc(66px + env(safe-area-inset-bottom,0px));width:calc(100% - 20px)} }
@media (max-height:500px){ .party{top:8px;padding:3px 6px} .upd.pask{bottom:calc(56px + env(safe-area-inset-bottom,0px))} }
.bossbar{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:4;width:min(320px,calc(100% - 360px));min-width:200px;padding:5px 10px;text-align:center}
.bossbar b{display:block;font-family:var(--f-display);font-weight:400;font-size:12px;color:#ff9a7a;letter-spacing:.05em}
.bossbar i{display:block;height:10px;margin-top:4px;border:2px solid var(--edge);background:#3d3257}
.bossbar s{display:block;height:100%;width:100%;background:#e8402c;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);transition:width .2s}
.bossbar small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
@media (max-width:720px){ .bossbar{top:60px;width:min(260px,calc(100% - 40px))} }
.hb{position:relative;width:44px;height:44px;display:grid;place-items:center;padding:0;background:var(--panel);border:2px solid var(--edge);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);cursor:pointer;color:var(--ink)}
.hb img{width:32px;height:32px;image-rendering:pixelated}
.hb:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hb[aria-pressed="true"]{background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--accent)}
.hb .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--panel);
  font:700 12px/14px var(--f-body);border:2px solid var(--edge);display:grid;place-items:center}
.win{position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 24px));max-height:calc(100% - 24px);
  display:flex;flex-direction:column;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.whead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 12px;border-bottom:2px solid var(--edge)}
.whead b{font-family:var(--f-display);font-weight:400;color:var(--accent);font-size:14px;letter-spacing:.05em}
.wx{min-height:32px;padding:2px 10px;font-family:var(--f-body)}

let LANG="pl";
try{ const v=localStorage.getItem("island_lang"); if(v==="ru"||v==="pl") LANG=v; }catch(e){}
// перевод; параметр вида "#ключ" тоже переводится (например, название рыбы)
const TOUCH=matchMedia("(pointer: coarse)").matches;
// тексты и цены, которые админ поменял в редакторе (world/config)
const CFG={texts:{pl:{},ru:{}},buy:{},sell:{},off:{},drops:{},xp:{},xpFish:{},fishW:{},logs:{},fisher:{},mobHp:{},rods:{},mobTime:{}};
function tr(k,p){
  const ck=CFG.texts[LANG]&&CFG.texts[LANG][k];
  if(TOUCH&&I18N.pl[k+"_t"]) k=k+"_t";   // на телефоне — подсказки для пальцев вместо клавиш
  const s=typeof ck==="string"&&ck?ck:(I18N[LANG][k]??I18N.pl[k]??k);
  return p?s.replace(/\{(\w+)\}/g,(_,n)=>{const v=p[n]; return typeof v==="string"&&v[0]==="#"?tr(v.slice(1)):(v??"")}):s;
}
let lastStatus=["hint","hint_sub",null];
// короткая всплывашка над панелью кнопок; рутинные статусы (иду, пришёл…) не показываем
const QUIET_SAY=new Set(["hint","going","arrived","waiting","go_talk","go_fish","go_chop","go_attack","go_trade","chopping","casting","building","growing","ed_hint","loaded"]);
let toastT=0;
function say(main,sub,p,force){
  const same=lastStatus[0]===main&&lastStatus[1]===sub;
  lastStatus=[main,sub,p||null];
  if(force===false||QUIET_SAY.has(main)) return;
  const el=document.getElementById("toast"); if(!el) return;
  el.innerHTML=`${tr(main,p)}${sub?` <span>· ${tr(sub,p)}</span>`:""}`;
  el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),same?2200:3200);
}
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=tr(CAVE&&el.dataset.i18n==="title_h"?"title_h_cave":el.dataset.i18n));
  { const sk=document.getElementById("skipTime"); if(sk&&(CAVE||ALWAYS_DAY)) sk.hidden=true; }
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=tr(el.dataset.i18nPh));
  document.querySelectorAll("[data-q]").forEach(el=>el.textContent=tr(el.dataset.q));
  if(typeof renderPlayers==="function") renderPlayers();
  if(typeof renderChatLog==="function"&&document.getElementById("chatLog")) renderChatLog();
  document.querySelectorAll("[data-i18n-label]").forEach(el=>{const t=tr(el.dataset.i18nLabel);el.setAttribute("aria-label",t);el.title=t;});
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===LANG));

const proj=(X,Y,Z)=>{const u=X*ca-Y*sa, v=X*sa+Y*ca; return [(u-v)*HW, (u+v)*HH-(Z-1)*LH]};
const depthOf=(X,Y)=>{const u=X*ca-Y*sa, v=X*sa+Y*ca; return u+v};

// поиск пути: A* по 8 направлениям, подъём/спуск не больше 1 уровня
function canStep(a,b){ return b && !b.blocked && Math.abs(walkZ(a)-walkZ(b))<=1; }
function findPath(sx,sy,tx,ty){
  const start=cellAt(sx,sy), goal=cellAt(tx,ty); if(!start||!goal) return null;
  const key=c=>c.y*W+c.x, open=[[0,start]], g=new Map([[key(start),0]]), prev=new Map();
  const h=c=>{const dx=Math.abs(c.x-goal.x), dy=Math.abs(c.y-goal.y); return Math.max(dx,dy)+0.414*Math.min(dx,dy)};
  while(open.length){
    let bi=0; for(let i=1;i<open.length;i++) if(open[i][0]<open[bi][0]) bi=i;
    const [,cur]=open.splice(bi,1)[0];
    if(cur===goal) break;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy) continue;
      const nb=cellAt(cur.x+dx,cur.y+dy); if(!canStep(cur,nb)) continue;
      if(dx&&dy){ // по диагонали — только если оба боковых прохода свободны
        const s1=cellAt(cur.x+dx,cur.y), s2=cellAt(cur.x,cur.y+dy);
        if(!canStep(cur,s1)||!canStep(cur,s2)||!canStep(s1,nb)||!canStep(s2,nb)) continue;
      }
      const cost=g.get(key(cur))+(dx&&dy?1.414:1)+Math.abs(walkZ(nb)-walkZ(cur))*0.3;
      if(cost<(g.get(key(nb))??1e9)){g.set(key(nb),cost);prev.set(key(nb),cur);open.push([cost+h(nb),nb]);}
    }
  }
  if(!prev.has(key(goal)) && start!==goal) return null;
  const path=[goal]; while(path[0]!==start) path.unshift(prev.get(key(path[0])));

}
// прямая видимость между точками: клетки проходимы и без обрывов
function clearLine(a,b){
  const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])*6);
  let prevC=cellAt(Math.round(a[0]),Math.round(a[1]));
  for(let i=1;i<=n;i++){
    const t=i/n, px=a[0]+(b[0]-a[0])*t, py=a[1]+(b[1]-a[1])*t;
    // запас 0.3 клетки по бокам, чтобы не цеплять деревья
    for(const [ox,oy] of [[0,0],[0.3,0.3],[-0.3,-0.3],[0.3,-0.3],[-0.3,0.3]]){
      const c=cellAt(Math.round(px+ox),Math.round(py+oy));
      if(!c||c.blocked) return false;
    }
    const c=cellAt(Math.round(px),Math.round(py));
    if(c!==prevC){ if(!canStep(prevC,c)) return false; prevC=c; }
  }
  return true;
}
// сглаживание: идём по прямой, где можно (как в Lineage 2)
function smooth(pts){
  const out=[pts[0]]; let i=0;
  while(i<pts.length-1){
    let j=pts.length-1;
    while(j>i+1 && !clearLine(pts[i],pts[j])) j--;
    out.push(pts[j]); i=j;
  }
  return out.slice(1);
}
function goTo(c){
  if(!c) return;
  stopFishing(); stopChopping(); closeDialog(); hero.pendingTalk=false; hero.pendingAction=null; building=null; hero.target=null;
  if(fainting) return;
  if(typeof c==="object"&&isMob(c)){ if(placing) return; attackWolf(c); return; }
  if(placing){ if(c&&typeof c==="object") placeFireAt(c); return; }
  if(typeof c==="object"&&c.fire){ goAdjacent(c,()=>openFireMenu(c.fire),"go_fire"); return; }
  if(c==="portal"||c.portal){ goAdjacent(PORTAL,usePortal,CAVE?"go_exit":"go_cave"); return; }
  if(c==="merchant"||c.merchHere||c.stall){ goTrade(); return; }
  if(c==="npc"||c==="hut"||c.hutPart||c.npcHere){ goTalk(); return; }
  if(c.water){ goFish(c); return; }
  if(treeName(c)){ goChop(c); return; }
  let target=c;
  if(c.blocked){ // кликнули по дереву — идём к ближайшей свободной клетке рядом
    let best=null,bd=1e9;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const n=cellAt(c.x+dx,c.y+dy); if(!n||n.blocked) continue;
      const d=Math.hypot(n.x-hero.x,n.y-hero.y); if(d<bd){bd=d;best=n}
    }
    if(!best){marker={x:c.x,y:c.y,t:0,ok:false};return}
    target=best;
  }
  const from=[Math.round(hero.x),Math.round(hero.y)];
  const p=findPath(from[0],from[1],target.x,target.y);
  if(!p){marker={x:c.x,y:c.y,t:0,ok:false};say("blocked");return}
  // первая точка — текущая позиция героя (он может стоять между клетками)
  hero.path=p.length?p:[[target.x,target.y]];
  marker={x:target.x,y:target.y,t:0,ok:true};
  follow=true; document.getElementById("follow").setAttribute("aria-pressed","true");
  say("going","going_sub",{x:target.x,y:target.y,h:target.L,kind:"#"+(target.st?"k_st":"k_"+target.t)});
}
function updateHero(dt){
  hero.moving=false;
  if(hero.path.length){
    const [tx,ty]=hero.path[0], dx=tx-hero.x, dy=ty-hero.y, dist=Math.hypot(dx,dy);
    if(hero.dash) return;
    const step=HERO_SPEED*(form==="wolf"?1.8:1)*dt;
    if(dist<=step){hero.x=tx;hero.y=ty;hero.path.shift(); if(!hero.path.length){marker=null;if(!hero.target) say("arrived","arrived_sub",{x:tx,y:ty});
      if(hero.pendingFish){const w=hero.pendingFish.water; hero.pendingFish=null; startFishing(w);}
      if(hero.pendingChop){const t=hero.pendingChop.tree; hero.pendingChop=null; startChopping(t);}
      if(hero.pendingTalk){hero.pendingTalk=false; openDialog();}
      if(hero.pendingAction){const fn=hero.pendingAction; hero.pendingAction=null; fn();}}}
    else{hero.x+=dx/dist*step;hero.y+=dy/dist*step}
    if(dist>0.001){
      hero.moving=true;
      { const hc=cellAt(Math.round(hero.x),Math.round(hero.y)); if(hc&&hc.shallow&&Math.random()<dt*5) ripples.push({x:hero.x,y:hero.y,z:walkZ(hc),t:0,small:true}); }
      // направление на экране с учётом поворота

      hero.facing=(sy>=0?"s":"n")+(sx>=0?"e":"w");
    }
  }
  hero.phase = hero.moving ? hero.phase+dt*HERO_SPEED*Math.PI*1.6 : 0;
  const c=cellAt(Math.round(hero.x),Math.round(hero.y));

}

function stairSprite(dir,q){

// лестница, которая поднимается к камере (видна «со спины»): три ступеньки кодом
function drawStairsBack(c){
  const [dx,dy]=STAIR_DIR[c.st], px=-dy, py=dx, X=c.x-MX, Y=c.y-MY, L=c.L;
  const P=(t,s,z)=>proj(X+dx*t+px*s,Y+dy*t+py*s,z);
  const poly=(pts,fill)=>{ ctx.beginPath(); ctx.moveTo(...pts[0]); for(const p of pts.slice(1)) ctx.lineTo(...p); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle="#1b1528"; ctx.lineWidth=1; ctx.stroke(); };

    const t0=-0.5+k/3, t1=t0+1/3, z=L+(k+1)/3;
    poly([P(t0,side,z),P(t1,side,z),P(t1,side,L),P(t0,side,L)],"#7a5232");              // бок

    poly([P(t0,-.5,z),P(t1,-.5,z),P(t1,.5,z),P(t0,.5,z)],k%2?"#c2b79e":"#b5aa92");       // ступень
  }
}

let T=0, windOn=!matchMedia("(prefers-reduced-motion: reduce)").matches;
const WIND=[1,-0.45];                         // направление ветра на карте (не зависит от поворота камеры)
const SWAY={tree_big:4, tree_small:3, bush:1, grass_tuft:1.5, grass_tuft_2:1.5, prop_reeds:2, prop_flowers:1.2, prop_bush_berry:1};
// сила ветра 0..1: спокойный фон + порывы
function windAt(t){
  const g=Math.sin(t*0.45)*0.6+Math.sin(t*0.17+1)*0.5+Math.sin(t*1.1+2)*0.2;
  return Math.max(0,Math.min(1,0.3+0.7*Math.max(0,g)));
}
// куда ветер дует на экране (по горизонтали), с учётом поворота карты
function windScreenX(){const u=WIND[0]*ca-WIND[1]*sa, v=WIND[0]*sa+WIND[1]*ca; return (u-v)/1.45}
// отклонение верхушки в пикселях для объекта в клетке (x,y): порыв идёт по карте волной
function swayAt(x,y,amp){
  if(!windOn) return 0;
  const w=windAt(T-(x+y)*0.12);
  return amp*(windScreenX()*w*(0.65+0.35*Math.sin(T*2.6+x*1.7+y*1.3)) + 0.25*Math.sin(T*1.3+x*2.1+y*0.7));
}
// рисует декор; деревья и трава гнутся полосками по 3 px (ствол на месте, крона сильнее)
function drawProp(im,name,px,py,c){

  if(!amp||!windOn){ ctx.drawImage(im,x0,y0); return; }

const WATER_TEX={};
function waterTex(kind,f){
  const k=kind+f; if(k in WATER_TEX) return WATER_TEX[k];
  const im=img[`water_${kind}_${f}`]; if(!im) return WATER_TEX[k]=null;
  const sc=document.createElement("canvas"); sc.width=im.width; sc.height=im.height; const sg=sc.getContext("2d"); sg.drawImage(im,0,0);

  const g=c.getContext("2d"), o=g.createImageData(N,N);

  for(let j=0;j<N;j++)for(let i=0;i<N;i++){ const a=0.08+0.84*(i+.5)/N,b=0.08+0.84*(j+.5)/N, px=Math.max(0,Math.min(im.width-1,(32+32*a-32*b)|0)), py=Math.max(0,Math.min(im.height-1,(16*a+16*b)|0));

  } else if(f.id==="wood"){   // бревно: кора и светлый срез с кольцами

      const e=((x-cx)/3.5)**2+((y-cy)/5.5)**2;

}

function goFish(w){

  const shore=[];

function updateFishing(dt){

function pixLine(x0,y0,x1,y1,col){

  const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1; let err=dx+dy;
  ctx.fillStyle=col;

function drawFishing(){
  worldTransform(); ctx.imageSmoothingEnabled=false;

    let tip=[fx+dir*17, fy-37];
    if(f.state==="cast"&&f.t<0.2) tip=[fx-dir*5, fy-41];            // замах назад
    if(f.state==="bite") tip=[fx+dir*18, fy-31+(Math.sin(T*40)>0?1:0)]; // удочку тянет
    if(f.state==="reel"&&f.t<0.4) tip=[fx+dir*9, fy-43];             // подсечка вверх
    const b=proj(f.bx-MX,f.by-MY,z);

    if(f.state==="reel"||f.state==="pause") bob=tip;

    pixLine(hand[0],hand[1],tip[0],tip[1],"#9a6430");
    ctx.fillStyle="#d8d0c0"; ctx.fillRect(Math.round(tip[0]),Math.round(tip[1]),1,1);
    // леска с провисом
    ctx.fillStyle="rgba(255,255,255,.75)";
    const mx=(tip[0]+bob[0])/2, my=Math.max(tip[1],bob[1])+(f.state==="bite"?-2:6);
    let px=tip[0],py=tip[1];
    for(let i=1;i<=24;i++){const t=i/24, x=(1-t)*(1-t)*tip[0]+2*(1-t)*t*mx+t*t*bob[0], y=(1-t)*(1-t)*tip[1]+2*(1-t)*t*my+t*t*bob[1];

// ================= Рубка деревьев =================
const HITS={tree_big:5, tree_small:3}, LOGS={tree_big:3, tree_small:2};

const treeName=c=>c&&c.props.find(n=>n.startsWith("tree"));
function refreshBlocked(c){ c.shallow=c.t==="v"; c.blocked=!!c.water||!!c.hutPart||!!c.npcHere||!!c.merchHere||!!c.stall||c.props.some(n=>BLOCKING.has(n)); }

// клик по дереву: подходим к соседней клетке (лучше — перед деревом, чтобы его было видно)
function goChop(t){
  if(t.grow<1||t.falling){ say("growing"); marker={x:t.x,y:t.y,t:0,ok:false}; return; }
  const spots=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const n=cellAt(t.x+dx,t.y+dy); if(n&&!n.blocked&&Math.abs(walkZ(n)-walkZ(t))<=1) spots.push(n);
  }
  const score=n=>Math.hypot(n.x-hero.x,n.y-hero.y)+(depthOf(n.x-MX,n.y-MY)<depthOf(t.x-MX,t.y-MY)?4:0);
  spots.sort((a,b)=>score(a)-score(b));
  for(const n of spots){
    const p=findPath(Math.round(hero.x),Math.round(hero.y),n.x,n.y); if(!p) continue;
    hero.path=p.length?p:[[n.x,n.y]]; hero.pendingChop={tree:t};
    marker={x:t.x,y:t.y,t:0,ok:true};
    follow=true; document.getElementById("follow").setAttribute("aria-pressed","true");
    say("go_chop"); return;
  }
  marker={x:t.x,y:t.y,t:0,ok:false}; say("no_reach");
}
function startChopping(t){

function hitTree(t){

    t:0, life:0.55+Math.random()*0.35, col:["#ecd0a0","#c89858","#8a5a2a"][i%3]});
  // листья сыплются от удара
  for(let i=0;i<3;i++) if(leaves.length<300) leaves.push({x:t.x+(Math.random()-.5)*0.8,y:t.y+(Math.random()-.5)*0.8,

function finishFall(c){
  const name=c.falling.name; c.falling=null;
  c.props=c.props.filter(n=>!n.startsWith("tree")); refreshBlocked(c);
  const i=TREES.findIndex(tr=>tr.c===c); if(i>=0) TREES.splice(i,1);

// новое деревце в свободном месте на траве, подальше от героя и других деревьев
function sproutTree(){ if(CAVE) return;
  const onPath=c=>hero.path.some(([px,py])=>Math.round(px)===c.x&&Math.round(py)===c.y);
  const cand=cells.filter(c=>!c.water&&!c.st&&GRASSY.includes(c.t)&&!c.props.length&&!c.stump&&!c.blocked
    &&Math.hypot(c.x-hero.x,c.y-hero.y)>2.5&&!onPath(c)
    &&!TREES.some(tr=>Math.abs(tr.c.x-c.x)+Math.abs(tr.c.y-c.y)<3));
  if(!cand.length){ regrow.push({t:5}); return; }
  const c=cand[(Math.random()*cand.length)|0], big=Math.random()<0.5, name=big?"tree_big":"tree_small";
  c.props.push(name); refreshBlocked(c); c.grow=0.02; c.growTime=big?45:30; TREES.push({c,big}); netTreeGrow(c,name);
  for(let i=0;i<14;i++) chips.push({x:c.x+(Math.random()-.5)*0.6,y:c.y+(Math.random()-.5)*0.6,z:walkZ(c)*LH+2,
    vx:0,vy:0,vz:25+Math.random()*45,t:0,life:1,col:["#b8f070","#ffffff","#7fd040"][i%3],spark:true});
  if(!chopping&&!fishing&&!hero.path.length) say("sprout");
}
function updateChopping(dt){
  for(let i=chips.length-1;i>=0;i--){const p=chips[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    p.vz-=(p.spark?20:160)*dt; if(p.t>p.life) chips.splice(i,1);}
  for(const c of cells){
    if(c.shake>0) c.shake=Math.max(0,c.shake-dt);
    if(c.falling){ c.falling.t+=dt; if(c.falling.t>=0.9) finishFall(c); }
    if(c.stump){ c.stump.t+=dt; if(c.stump.t>30) c.stump=null; }
    if(c.grow<1) c.grow=Math.min(1,c.grow+dt/c.growTime);
  }
  for(let i=regrow.length-1;i>=0;i--){ regrow[i].t-=dt; if(regrow[i].t<=0){ regrow.splice(i,1); sproutTree(); } }
  if(!chopping) return;
  const ch=chopping; faceTo(ch.tree.x,ch.tree.y);
  ch.t+=dt;
  const cyc=Math.floor(ch.t/SWING); if(cyc!==ch.cyc){ch.cyc=cyc;ch.struck=false;}
  if(!ch.struck&&(ch.t%SWING)>=IMPACT){ ch.struck=true; hitTree(ch.tree); }
}

function drawTreeSpecial(im,px,py,c){
  if(c.falling){

    ctx.save(); ctx.translate(Math.round(px),Math.round(py)+2); ctx.rotate(dir*e*Math.PI*0.48);

}

// коробка: видимые бока + верх; deco(n,a,b,z0,z1) — украшение на боку
function box(x0,x1,y0,y1,z0,z1,cl,cd,ct,deco){
  const sides=[{n:[1,0],a:[x1,y0],b:[x1,y1]},{n:[-1,0],a:[x0,y1],b:[x0,y0]},{n:[0,1],a:[x1,y1],b:[x0,y1]},{n:[0,-1],a:[x0,y0],b:[x1,y0]}];
  for(const s of sides){ if(!facesCam(s.n)) continue;

    {n:[-1,0],a:[x0,y1], b:[x0,y0], kind:"plain", gable:true},
  ];
  for(const w of walls){

    const P=(t,z)=>[A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, z];
    poly([[A[0],A[1],Z0],[B[0],B[1],Z0],[B[0],B[1],Zw],[A[0],A[1],Zw]], lit?"#a26c3e":"#7e5230");
    for(let z=Z0+0.45; z<Zw-0.05; z+=0.42) seg([A[0],A[1],z],[B[0],B[1],z], lit?"#7a4c26":"#5c3a1c");   // брёвна
    if(w.gable){ poly([[A[0],A[1],Zw],[B[0],B[1],Zw],[mid[0],mid[1],Zr]], lit?"#b8844c":"#8e6236", "#1b1528");
      for(let k=1;k<4;k++) seg(P(k/4,Zw),[...P(k/4,Zw).slice(0,2), Zw+(Zr-Zw)*(1-Math.abs(k/4-0.5)*2)], lit?"#9a6a3a":"#76502a"); }
    poly([[A[0],A[1],Z0],[B[0],B[1],Z0],[B[0],B[1],Z0+0.45],[A[0],A[1],Z0+0.45]], lit?"#9a98a6":"#76747f");   // каменный цоколь
    poly([[A[0],A[1],Z0],[B[0],B[1],Z0],[B[0],B[1],Zw],[A[0],A[1],Zw]], null, "#1b1528");
    if(w.kind==="door"){
      poly([P(0.36,Z0+0.12),P(0.64,Z0+0.12),P(0.64,Z0+2.0),P(0.36,Z0+2.0)],"#4a2c14","#1b1528");
      seg(P(0.5,Z0+0.2),P(0.5,Z0+1.95),"#2e1a0a");
      const h=proj(...P(0.59,Z0+1.0)); ctx.fillStyle="#ffd66b"; ctx.fillRect(Math.round(h[0]),Math.round(h[1]),1,2);
      // фонарь над дверью
      const l=proj(...P(0.72,Z0+2.25)); ctx.fillStyle="#1b1528"; ctx.fillRect(Math.round(l[0])-2,Math.round(l[1])-3,5,6);
      ctx.fillStyle=`rgba(255,214,107,${0.75+0.25*Math.sin(T*3)})`; ctx.fillRect(Math.round(l[0])-1,Math.round(l[1])-2,3,4);
    }
    if(w.kind==="window"){
      poly([P(0.3,Z0+1.0),P(0.7,Z0+1.0),P(0.7,Z0+1.95),P(0.3,Z0+1.95)],"#2a1608");
      poly([P(0.34,Z0+1.08),P(0.66,Z0+1.08),P(0.66,Z0+1.87),P(0.34,Z0+1.87)],"#9fd4ff");
      seg(P(0.5,Z0+1.08),P(0.5,Z0+1.87),"#2a1608"); seg(P(0.34,Z0+1.47),P(0.66,Z0+1.47),"#2a1608");
      poly([P(0.26,Z0+0.82),P(0.74,Z0+0.82),P(0.74,Z0+1.0),P(0.26,Z0+1.0)],"#6a3e18","#1b1528");   // ящик с цветами
      for(let i=0;i<4;i++){const p=proj(...P(0.32+i*0.12,Z0+1.06)); ctx.fillStyle=i%2?"#ff7aa0":"#ffd66b"; ctx.fillRect(Math.round(p[0]),Math.round(p[1])-1,2,2);}
    }
  }
}
function hutRoof(g){
  const {x0,x1,y0,y1,yc,Zw,Zr}=g, ov=0.22, ze=Zw-0.35;
  const slopes=[
    {n:[0,-1], pts:[[x0-ov,y0-ov,ze],[x1+ov,y0-ov,ze],[x1+ov,yc,Zr],[x0-ov,yc,Zr]]},
    {n:[0,1],  pts:[[x1+ov,y1+ov,ze],[x0-ov,y1+ov,ze],[x0-ov,yc,Zr],[x1+ov,yc,Zr]]},
  ];
  slopes.sort((a,b)=>(facesCam(a.n)?1:0)-(facesCam(b.n)?1:0));     // дальний скат — первым
  for(const s of slopes){
    const front=facesCam(s.n), [a,b,c,d]=s.pts;
    poly(s.pts, front?"#b5523a":"#8e3e2c", "#1b1528");
    for(let k=1;k<5;k++){ const t=k/5;   // ряды черепицы
      seg([a[0]+(d[0]-a[0])*t,a[1]+(d[1]-a[1])*t,a[2]+(d[2]-a[2])*t],[b[0]+(c[0]-b[0])*t,b[1]+(c[1]-b[1])*t,b[2]+(c[2]-b[2])*t], front?"#8e3e2c":"#6e2e20"); }
  }
  seg([x0-ov,yc,Zr],[x1+ov,yc,Zr],"#5a2418");
}
function drawHutProcedural(){
  const g=hutGeom();
  poly([[g.x0-0.15,g.y0-0.15,g.Z0],[g.x1+0.15,g.y0-0.15,g.Z0],[g.x1+0.15,g.y1+0.15,g.Z0],[g.x0-0.15,g.y1+0.15,g.Z0]],"rgba(20,10,40,.22)");
  const chimFront=facesCam([-1,0]), pileFront=facesCam([0,-1]);
  if(!pileFront) hutWoodpile(g);
  if(!chimFront) hutChimney(g);
  hutWalls(g); hutRoof(g);
  if(pileFront) hutWoodpile(g);
  if(chimFront) hutChimney(g);
}
// у спрайта хижины ищем нижнюю точку и центр, чтобы точно поставить на клетки
const hutBBox={};
function spriteBottom(im){
  if(hutBBox[im.src.length+"_"+im.width]) return hutBBox[im.src.length+"_"+im.width];
  const c=document.createElement("canvas"); c.width=im.width; c.height=im.height; const g=c.getContext("2d"); g.drawImage(im,0,0);
  const d=g.getImageData(0,0,im.width,im.height).data; let bottom=0, minX=im.width, maxX=0;
  for(let y=0;y<im.height;y++)for(let x=0;x<im.width;x++) if(d[(y*im.width+x)*4+3]>128){ bottom=Math.max(bottom,y); minX=Math.min(minX,x); maxX=Math.max(maxX,x); }
  return hutBBox[im.src.length+"_"+im.width]={bottom,cx:(minX+maxX)/2};
}
function drawHut(){
  worldTransform(); ctx.imageSmoothingEnabled=false;
  const q0=((Math.floor(rot+1e-6)%4)+4)%4, f=rot-Math.floor(rot+1e-6);
  const spA=img["hut_"+q0], spB=img["hut_"+((q0+1)%4)];
  if(spA&&spB){
    // точка опоры — центр основания хижины; нижний угол ромба 2×2 всегда на 34 px ниже центра
    const c=proj(HUT.hx+0.5-MX,HUT.hy+0.5-MY,HUT.Z), baseY=c[1]+34;
    const put=(sp,alpha,sxScale)=>{
      if(alpha<=0.01) return;
      const bb=spriteBottom(sp), w=sp.width*sxScale;
      ctx.globalAlpha=alpha;
      ctx.drawImage(sp,Math.round(c[0]-w/2),Math.round(baseY-bb.bottom-1),Math.round(w),sp.height);
      ctx.globalAlpha=1;
      return [Math.round(c[0]-sp.width/2),Math.round(baseY-bb.bottom-1)];
    };
    if(f<1e-3){ const xy=put(spA,1,1); HUT.spr={x:xy[0],y:xy[1],q:q0}; }
    else {
      // во время поворота — как переворот карточки: до середины текущий вид сужается, после — следующий расширяется.
      // Картинка всё время непрозрачная, поэтому ничего не мигает и не просвечивает.
      const sm=t=>t*t*(3-2*t);
      if(f<0.5) put(spA,1,1-0.42*sm(f/0.5));
      else put(spB,1,0.58+0.42*sm((f-0.5)/0.5));
      HUT.spr=null;
    }
  } else { drawHutProcedural(); HUT.spr=null; }
  if(windOn||smoke.length) drawSmoke();
}
// дым из трубы, сносится ветром (в экранных координатах мира)
// верх нарисованной трубы на спрайтах хижины (пиксели картинки); на видах 0 и 1 труба скрыта за крышей
const HUT_CHIMNEY={2:[108,53],3:[40,30]};
function chimneyTop(){
  if(HUT.spr&&!anim){ const c=HUT_CHIMNEY[HUT.spr.q]; if(c) return [HUT.spr.x+c[0],HUT.spr.y+c[1]-2]; }
  const g=hutGeom(); return proj(g.x0-0.2,g.yc+0.27,g.Zr+0.4);
}
function updateSmoke(dt){
  if(!HUT) return;
  HUT.puff=(HUT.puff||0)-dt;
  if(HUT.puff<=0&&!anim){ HUT.puff=0.35+Math.random()*0.25; const o=chimneyTop();
    smoke.push({sx:o[0]+(Math.random()-.5)*2, sy:o[1], t:0, life:3+Math.random()}); }
  const w=windOn?windAt(T):0.15, wx=windOn?windScreenX():0.3;
  for(let i=smoke.length-1;i>=0;i--){ const p=smoke[i]; p.t+=dt;
    p.sy-=(10-p.t*1.6)*dt; p.sx+=wx*(4+16*w)*dt; if(p.t>p.life) smoke.splice(i,1); }
}
function drawSmoke(){
  for(const p of smoke){
    const k=p.t/p.life, r=Math.round(2+k*5);
    ctx.globalAlpha=(1-k)*0.55; ctx.fillStyle=k<0.3?"#e8e4f0":"#d4d0e0";
    ctx.fillRect(Math.round(p.sx-r),Math.round(p.sy-r),r*2,r*2);
    ctx.fillRect(Math.round(p.sx-r-1),Math.round(p.sy-r+1),r*2+2,r*2-2);
  }
  ctx.globalAlpha=1;
}

function drawOldMan(g,facing,t,talking){

  g.save(); g.scale(flip,1); g.translate(0,-bob);
  const rects=[]; const R=(x,y,w,h,c)=>rects.push([x,y,w,h,c]);
  R(-4,-8,3,8,"#4a3a2a"); R(1,-8,3,8,"#4a3a2a"); R(-4,-2,3,2,"#2a1f14"); R(1,-2,3,2,"#2a1f14");
  R(-6,-20,12,13,"#7a5a2e"); R(-6,-20,12,2,"#9a7440"); R(-6,-12,12,1,"#c8b070");
  R(-8,-19,2,9,"#6a4a24"); R(6,-19,2,9,"#6a4a24"); R(-8,-10,2,2,"#e8b888"); R(6,-10,2,2,"#e8b888");
  R(-4,-28,8,8,"#e8b888");
  if(front){ R(-4,-23,8,5,"#f0f0f4"); R(-3,-18,6,2,"#f0f0f4"); R(-2,-25,1,1,"#1b1528"); R(2,-25,1,1,"#1b1528"); R(0,-24,1,2,"#d89870");
    if(talking&&Math.sin(t*14)>0) R(-1,-21,3,1,"#8a5a4a"); }
  else R(-4,-27,8,6,"#c8c8d0");
  R(-7,-28,14,2,"#3f5a2e"); R(-4,-32,8,4,"#4f6a3a"); R(-4,-29,8,1,"#2a3a1e");
  g.fillStyle="#1b1528"; for(const [x,y,w,h] of rects) g.fillRect(x-1,y-1,w+2,h+2);
  for(const [x,y,w,h,c] of rects){ g.fillStyle=c; g.fillRect(x,y,w,h); }
  g.fillStyle="#8a5a2a"; for(let i=0;i<26;i++) g.fillRect(7+Math.round(i*0.08),-10-i,1,1);   // посох-удочка
  g.restore();
}

function facingTo(from,x,y){
  const dx=x-from.x, dy=y-from.y, u=dx*ca-dy*sa, v=dx*sa+dy*ca;
  return ((u+v)>=0?"s":"n")+((u-v)>=0?"e":"w");
}

// клик по NPC или хижине (по картинке, а не только по клетке)
function pickEntity(mx,my){
  const wx=(mx-panX)/scale, wy=(my-panY)/scale;
  if(npc){ const [fx,fy]=proj(npc.x-MX,npc.y-MY,npc.z); if(Math.abs(wx-fx)<=11&&wy>=fy-44&&wy<=fy+4) return "npc"; }
  if(pickPortal(wx,wy)) return "portal";
  if(pickMerchant(wx,wy)) return "merchant";
  if(HUT){
    const g=hutGeom(), pts=[];
    for(const x of [g.x0-0.4,g.x1+0.2])for(const y of [g.y0-0.4,g.y1+0.2])for(const z of [g.Z0,g.Zr+0.7]) pts.push(proj(x,y,z));
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
    if(wx>=Math.min(...xs)&&wx<=Math.max(...xs)&&wy>=Math.min(...ys)&&wy<=Math.max(...ys)-12) return "hut";
  }
  return null;
}
function goTalk(){
  if(!npc) return;
  if(Math.hypot(hero.x-npc.x,hero.y-npc.y)<1.6&&!hero.path.length){ openDialog(); return; }
  const spots=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ const n=cellAt(npc.x+dx,npc.y+dy); if(n&&!n.blocked) spots.push(n); }
  const score=n=>Math.hypot(n.x-hero.x,n.y-hero.y)+(depthOf(n.x-MX,n.y-MY)<depthOf(npc.x-MX,npc.y-MY)?3:0);
  spots.sort((a,b)=>score(a)-score(b));
  for(const n of spots){
    const p=findPath(Math.round(hero.x),Math.round(hero.y),n.x,n.y); if(!p) continue;
    hero.path=p.length?p:[[n.x,n.y]]; hero.pendingTalk=true;
    follow=true; document.getElementById("follow").setAttribute("aria-pressed","true");
    say("go_talk"); return;
  }
  say("no_reach");
}

// ================= День и ночь =================
const DAY_LEN=420;                 // секунд на сутки (7 минут)
let clock=8/24;                    // доля суток, 0 = полночь; старт в 8:00
const hourNow=()=>clock*24;
const ALWAYS_DAY=true;             // пока ночь выключена: на острове всегда день
function darkness(){               // 0 — день, 1 — глубокая ночь
  if(CAVE) return 0.94;
  if(ALWAYS_DAY) return 0;
  const h=hourNow();
  if(h>=7&&h<17.5) return 0;
  if(h>=17.5&&h<21) return (h-17.5)/3.5;
  if(h>=21||h<5) return 1;
  return 1-(h-5)/2;
}
function duskAmt(){                // оранжевый закат и розовый рассвет
  if(CAVE||ALWAYS_DAY) return 0;
  const h=hourNow();
  if(h>=16.5&&h<20.5) return Math.sin((h-16.5)/4*Math.PI);
  if(h>=4.5&&h<7.5) return Math.sin((h-4.5)/3*Math.PI)*0.6;
  return 0;
}
const isNight=()=>{ if(CAVE) return true; if(ALWAYS_DAY) return false; const h=hourNow(); return h>=20.5||h<5.5;};
let wasNight=null, lastClockText="";
function updateClock(dt){
  { const nc=netClock(); clock=ALWAYS_DAY?12/24:nc!==null?nc:(clock+dt/DAY_LEN)%1; }
  const night=isNight();
  if(wasNight!==null&&night!==wasNight){
    if(night) say("night_falls","night_sub"); else say("morning");
  }
  wasNight=night;
  const h=Math.floor(hourNow()), m=Math.floor((hourNow()-h)*60/10)*10;
  const txt=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  if(txt!==lastClockText){
    lastClockText=txt;
    document.getElementById("clkTime").textContent=txt;
    const dayIcon=!night&&darkness()<0.6;
    document.getElementById("clkIcon").innerHTML=dayIcon
      ?'<circle cx="12" cy="12" r="5" fill="#ffd66b"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2" stroke="#ffd66b" stroke-width="2"/>'
      :'<path d="M15 3a9 9 0 1 0 6 13A7 7 0 0 1 15 3z" fill="#e8e4ff"/>';
    document.getElementById("skipTime").textContent=tr(night?"skip_day":"skip_night");
  }
}
function skipTime(){
  clock=isNight()?6.2/24:20.4/24; netSetClock(clock);
  lastClockText="";
}

  for(const f of fires) if(f.fuel>0){

    for(const a of animals) if(a.kind==="golem"&&a.alpha>0.2){ const q=proj(a.x-MX,a.y-MY,a.z+1.6); L.push({x:q[0],y:q[1],r:a.slamT>0?60:34,c:a.slamT>0?"255,120,90":"120,220,255",a:0.8}); } }

function applyLighting(){
  const d=darkness(), du=duskAmt(); if(d<0.01&&du<0.01) return;
  const bw=buf.width, bh=buf.height;
  if(lightCv.width!==bw||lightCv.height!==bh){lightCv.width=bw;lightCv.height=bh;}
  let r=255,g=255,b=255; const mix=(c,t)=>{r+=(c[0]-r)*t;g+=(c[1]-g)*t;b+=(c[2]-b)*t;};
  mix([255,168,112],du*0.55); mix([58,68,138],d);
  const Lc=lightCtx; Lc.setTransform(1,0,0,1,0,0); Lc.globalCompositeOperation="source-over";
  Lc.fillStyle=`rgb(${r|0},${g|0},${b|0})`; Lc.fillRect(0,0,bw,bh);
  if(d>0.05){
    Lc.globalCompositeOperation="lighter";
    for(const li of collectLights()){
      const x=li.x+ROX, y=li.y+ROY, gr=Lc.createRadialGradient(x,y,0,x,y,li.r);
      gr.addColorStop(0,`rgba(${li.c},${li.a*d})`); gr.addColorStop(0.55,`rgba(${li.c},${li.a*d*0.45})`); gr.addColorStop(1,`rgba(${li.c},0)`);
      Lc.fillStyle=gr; Lc.fillRect(x-li.r,y-li.r,li.r*2,li.r*2);
    }
  }
  const B=bufCtx; B.save(); B.setTransform(1,0,0,1,0,0); B.globalCompositeOperation="multiply"; B.drawImage(lightCv,0,0); B.restore();
}

function drawNightFx(){

  for(const f of fires) if(f.fuel>0){
    const p=proj(f.c.x-MX,f.c.y-MY,f.c.L+0.9), gr=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],22);
    gr.addColorStop(0,`rgba(255,150,60,${0.35*d})`); gr.addColorStop(1,"rgba(255,150,60,0)");
    ctx.fillStyle=gr; ctx.fillRect(p[0]-22,p[1]-22,44,44);
  }

    ctx.globalAlpha=f.b*d; ctx.fillStyle="#e4ff8a"; ctx.fillRect(Math.round(p[0]),Math.round(p[1]),1,1);
    ctx.globalAlpha=f.b*d*0.4; ctx.fillRect(Math.round(p[0])-1,Math.round(p[1]),3,1); ctx.fillRect(Math.round(p[0]),Math.round(p[1])-1,1,3); }

function goAdjacent(t,fn,sayKey){
  const near=Math.max(Math.abs(hero.x-t.x),Math.abs(hero.y-t.y));
  if(near<=1.05&&near>0.3&&!hero.path.length){ faceTo(t.x,t.y); fn(); return; }
  const spots=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy) continue; const n=cellAt(t.x+dx,t.y+dy); if(n&&!n.blocked&&Math.abs(walkZ(n)-walkZ(t))<=1) spots.push(n); }
  const score=n=>Math.hypot(n.x-hero.x,n.y-hero.y)+(depthOf(n.x-MX,n.y-MY)<depthOf(t.x-MX,t.y-MY)?2:0);
  spots.sort((a,b)=>score(a)-score(b));
  for(const n of spots){
    const p=findPath(Math.round(hero.x),Math.round(hero.y),n.x,n.y); if(!p) continue;
    hero.path=p.length?p:[[n.x,n.y]]; hero.pendingAction=()=>{faceTo(t.x,t.y);fn();};

function randomCell(filter){ for(let i=0;i<80;i++){ const c=cells[(Math.random()*cells.length)|0]; if(filter(c)) return c; } return null; }

function fleeCell(a,fx,fy,minD,maxD){

    const c=cellAt(Math.round(a.x+Math.cos(ang)*r),Math.round(a.y+Math.sin(ang)*r)); if(!freeCell(c)) continue;
    const s=Math.hypot(c.x-fx,c.y-fy)+Math.random()*0.5; if(s>bs){bs=s;best=c;} }
  return best;
}
function nearestFire(x,y){ let best=null,d=1e9; for(const f of fires) if(f.fuel>0){ const dd=Math.hypot(f.c.x-x,f.c.y-y); if(dd<d){d=dd;best=f;} } return [best,d]; }
function moveAnimal(a,dt){

  if(a.path.length){
    const [tx,ty]=a.path[0], dx=tx-a.x, dy=ty-a.y, dist=Math.hypot(dx,dy), step=a.speed*dt;
    if(dist<=step){a.x=tx;a.y=ty;a.path.shift();} else {a.x+=dx/dist*step;a.y+=dy/dist*step;}
    if(dist>1e-3){ a.moving=true; const u=dx*ca-dy*sa, v=dx*sa+dy*ca; a.facing=((u+v)>=0?"s":"n")+((u-v)>=0?"e":"w"); }
  }

  const c=cellAt(Math.round(a.x),Math.round(a.y)); if(c) a.z+=(walkZ(c)-a.z)*Math.min(1,dt*12);
}
function updateAnimals(dt){
  const d=darkness(), night=isNight(), day=d<0.25, P=playersForAI();
  const nearestP=(x,y,a)=>{ let b=null,bd=1e9;
    for(const p of P){ if(p.hp<=0||(p.fw&&a&&a.kind==="wolf")) continue; const dd=Math.hypot(p.x-x,p.y-y); if(p.tn&&dd<4) return [p,dd]; if(dd<bd){bd=dd;b=p;} } return [b,bd]; };
  const farFromAll=(c,r)=>P.every(p=>Math.hypot(c.x-p.x,c.y-p.y)>r);
  spawnT-=dt;
  if(spawnT<=0){ spawnT=1;
    if(CAVE) caveSpawn(farFromAll); else {
    const hares=animals.filter(a=>a.kind==="hare"&&!a.leaving), wolves=animals.filter(a=>a.kind==="wolf"&&!a.leaving&&!(a.dying>0));
    if(day){ if(hares.length<3){ const z=zonePick("hare",c=>freeCell(c)&&farFromAll(c,4)), c=z!==undefined?z:randomCell(c=>freeCell(c)&&GRASSY.includes(c.t)&&farFromAll(c,5)); if(c) spawnAnimal("hare",c); }
    }
    else for(const a of hares){ a.leaving=true; const [tp]=nearestP(a.x,a.y); setPath(a,fleeCell(a,tp?tp.x:a.x,tp?tp.y:a.y,3,6)); a.speed=3; }
    // мобы: в редакторе для каждого — днём / ночью и сколько; днём нейтральны, пока их не тронешь
    const per=night?"n":(day?"d":null);
    if(per) for(const kind of MOBS){
      const list=animals.filter(a=>a.kind===kind&&!a.leaving&&!(a.dying>0));
      if(!mobOn(kind,per)){ for(const a of list) if(!a.aggro) mobLeave(a); continue; }
      const base=mobCount(kind,per), want=base+(per==="n"&&base>0&&(hourNow()>=23||hourNow()<4)?1:0);
      if(list.length>want+1){ const a=list.find(x=>!x.aggro); if(a) mobLeave(a); }
      else if(list.length<want&&Math.random()<(kind==="bat"?0.35:per==="n"?1:0.1)) spawnMob(kind,per,farFromAll,list.length);
    }
  } }
  let anyChase=false;
  for(let i=animals.length-1;i>=0;i--){
    const a=animals[i];
    if(a.dead){ animals.splice(i,1); continue; }
    a.hurtT=Math.max(0,(a.hurtT||0)-dt);
    if(a.dying>0){ a.dying-=dt; a.moving=false; if(a.dying<0.8) a.alpha=Math.max(0,a.dying/0.8); if(a.dying<=0) animals.splice(i,1); continue; }
    if(a.leaving){ if(!a.path.length) a.alpha-=dt*1.2; if(a.alpha<=0&&!a.path.length){ animals.splice(i,1); continue; } }
    else a.alpha=Math.min(1,a.alpha+dt*0.8);
    if(a.bleedT>0){ a.bleedT-=dt; a.bleedTick=(a.bleedTick||0)+dt; if(a.bleedTick>=1){ a.bleedTick=0; applyHit(a,a.bleedBy,a.x,a.y,1); if(a.dying>0) continue; } }
    if(a.stunT>0){ a.stunT-=dt; a.path=[]; a.moving=false; a.lunge=0; if(a.kind==="golem") a.slamT=0; continue; }
    a.think-=dt; a.howlT=Math.max(0,a.howlT-dt); a.lunge=Math.max(0,a.lunge-dt);
    const [tp,dh]=nearestP(a.x,a.y,a);
    if(a.kind==="hare"&&!a.leaving){
      if(tp&&dh<2.6&&a.fleeing<=0){ setPath(a,fleeCell(a,tp.x,tp.y,3,5)); a.speed=3.6; a.fleeing=1.6; }
      if(a.fleeing>0) a.fleeing-=dt;
      else if(a.think<=0&&!a.path.length){ a.think=2+Math.random()*4; if(Math.random()<0.6){ setPath(a,fleeCell(a,a.x,a.y,1,3)); a.speed=1.5; } }
    }
    if(a.kind==="wolf"&&a.aggro){ if(!tp||dh>9){ a.aggroT=(a.aggroT||0)+dt; if(a.aggroT>6){ a.aggro=false; a.aggroT=0; } } else a.aggroT=0; }
    if(a.kind==="wolf"&&!a.leaving&&!night&&!a.aggro){            // днём волк мирный: бродит и сторонится людей
      if(tp&&dh<2.2&&a.state!=="shy"){ a.state="shy"; setPath(a,fleeCell(a,tp.x,tp.y,2.5,4)); a.speed=1.8; }
      else if(a.state==="shy"&&!a.path.length) a.state="";
      else if(a.state!=="shy"&&a.think<=0&&!a.path.length){ a.state="wander"; a.think=3+Math.random()*4; if(Math.random()<0.7) setPath(a,fleeCell(a,a.x,a.y,1.5,3.5)); a.speed=1.1; }
    } else if(a.kind==="wolf"&&!a.leaving){
      const [wf,df]=nearestFire(a.x,a.y), [hf,dhf]=tp?nearestFire(tp.x,tp.y):[null,1e9], safe=dhf<FIRE_SAFE;
      if(wf&&df<FIRE_SCARE){                                   // огонь пугает
        if(a.state!=="flee"||!a.path.length){ a.state="flee"; setPath(a,fleeCell(a,wf.c.x,wf.c.y,2.5,4.5)); a.speed=3; }
      } else if(tp&&dh<8&&!safe){                               // чует ближайшего игрока и бежит к нему

        a.speed=2.5;
        if(dh<0.95){
          a.path=[]; a.facing=facingTo(a,tp.x,tp.y); a.lungeTo=[tp.x,tp.y];
          if(!tp.busy){ a.attackT-=dt; if(a.attackT<=0){ a.attackT=1.4; a.lunge=0.25; biteTarget(tp,a); } }
        } else if(a.think<=0){ a.think=0.4; setPath(a,cellAt(Math.round(tp.x),Math.round(tp.y))); a.attackT=Math.min(a.attackT,0.7); }
      } else if(tp&&safe&&dh<10){                                // кружит в темноте вокруг костра
        if(a.state!=="circle"||a.think<=0){ a.state="circle"; a.think=1.6+Math.random();
          const ang=Math.atan2(a.y-hf.c.y,a.x-hf.c.x)+0.7, c=cellAt(Math.round(hf.c.x+Math.cos(ang)*5.2),Math.round(hf.c.y+Math.sin(ang)*5.2));
          if(freeCell(c)) setPath(a,c); a.speed=1.6; if(Math.random()<0.12) a.howlT=1.5; }
      } else if(a.state!=="wander"||(a.think<=0&&!a.path.length)){ a.state="wander"; a.think=3+Math.random()*3; setPath(a,fleeCell(a,a.x,a.y,2,4)); a.speed=1.3; }
    }
    if(a.kind==="spider"){ updateSpider(a,dt,tp,dh); moveAnimal(a,dt); continue; }
    if(a.kind==="golem"){ updateGolem(a,dt,tp,dh,P); moveAnimal(a,dt); continue; }
    if(a.kind==="bat"){ if(a.aggro&&(!tp||dh>8)) a.aggro=false; updateBat(a,dt,tp,dh); continue; }
    moveAnimal(a,dt);
  }
  if(!anyChase) wolfWarned=false;
  hero.hurtT=Math.max(0,hero.hurtT-dt);
}

function drawAnimal(a){

function rollDrops(mob){
  const got=[];
  for(const r of dropTable(mob)){ if(Math.random()*100>=r.ch) continue; const n=r.a+Math.floor(Math.random()*(r.b-r.a+1)); if(n>0) got.push([r.id,n]); }
  return got;
}

function pickWolf(mx,my){
  const wx=(mx-panX)/scale, wy=(my-panY)/scale; let best=null, bd=1e9;
  for(const a of animals){ if(!isMob(a)||a.dying>0||a.alpha<0.3||!a.drawn) continue;
    const big=a.kind==="golem", dx=wx-a.drawn.x, dy=wy-(a.drawn.y-(big?24:12));
    if(Math.abs(dx)<=(big?28:20)&&dy>=(big?-30:-22)&&dy<=(big?26:14)){ const d=Math.hypot(dx,dy); if(d<bd){bd=d;best=a;} } }
  return best;
}
function attackWolf(a){
  if(!hasWeapon()){ say("need_weapon","need_weapon_sub"); marker={x:Math.round(a.x),y:Math.round(a.y),t:0,ok:false}; return; }
  hero.target=a; hero.retarget=0; marker=null;

  say("go_attack","attack_sub");
}
// ответный удар: если моб напал, а герой стоит без дела — герой сам бьёт его
function autoRetaliate(){
  if(hero.target||hero.path.length||hero.dash||fainting||dialogOpen||EDIT||placing||fishing||chopping) return;
  const a=hero.attacker; if(!a||Date.now()-(hero.attackedAt||0)>5000) return;
  if(!animals.includes(a)||a.dying>0||a.alpha<0.3||Math.hypot(a.x-hero.x,a.y-hero.y)>3){ hero.attacker=null; return; }
  if(hasWeapon()){ hero.target=a; hero.retarget=0; return; }
  if(heroClass==="druid"&&!(skillCd.thorn>0)&&heroLevel()>=1) useSkill("thorn");
}
function updateCombat(dt){
  hero.atkCd=Math.max(0,hero.atkCd-dt); autoRetaliate();
  if(hero.atk){ const k=hero.atk; k.t+=dt;
    if(!k.hit&&k.t>=ATK_HIT){ k.hit=true; landHit(k.a); }
    if(k.t>=ATK_TIME) hero.atk=null; }
  const a=hero.target; if(!a) return;
  if(!animals.includes(a)||a.dying>0||a.alpha<0.2||fainting||dialogOpen){ hero.target=null; return; }
  const d=Math.hypot(a.x-hero.x,a.y-hero.y);
  if(d<=ATK_RANGE){ hero.path=[]; faceTo(a.x,a.y);
    if(!hero.atk&&hero.atkCd<=0){ hero.atk={t:0,a,hit:false}; hero.atkCd=ATK_CD; } }
  else if(!hero.atk){ hero.retarget-=dt;
    if(hero.retarget<=0||!hero.path.length){ hero.retarget=0.3;
      const p=findPath(Math.round(hero.x),Math.round(hero.y),Math.round(a.x),Math.round(a.y));
      if(p) hero.path=p.length?p:[[Math.round(a.x),Math.round(a.y)]]; else { hero.target=null; say("no_reach"); } } }
}
function landHit(a){
  if(!a||!animals.includes(a)||a.dying>0) return;
  if(Math.hypot(a.x-hero.x,a.y-hero.y)>ATK_RANGE+0.5) return;          // волк отскочил — промах
  for(let i=0;i<8;i++) chips.push({x:a.x,y:a.y,z:a.z*LH+10,vx:(Math.random()-.5)*1.2,vy:(Math.random()-.5)*1.2,vz:25+Math.random()*25,t:0,life:0.4,col:Math.random()<.5?"#ffffff":"#ffd66b",spark:true});
  const crit=Math.random()<critChance(), dmg=Math.max(1,heroAtk())*(crit?2:1);
  dealHit(a,dmg,crit,{bleed:form==="wolf"});
  if(form==="bear") for(const b of animals) if(b!==a&&isMob(b)&&!(b.dying>0)&&b.alpha>0.3&&Math.hypot(b.x-hero.x,b.y-hero.y)<1.5) dealHit(b,Math.max(1,heroAtk()-1),false);
}
// урон зверю от меня: хозяин считает сам, остальные отправляют удар хозяину
function dealHit(a,dmg,crit,o={}){
  if(!a||!animals.includes(a)||a.dying>0) return; lastCombat=Date.now();
  if(!NET.room||NET.host) applyHit(a,NET.myPeer,hero.x,hero.y,dmg,crit,o);
  else { a.hurtT=0.3; hitFx.push({x:a.x,y:a.y,z:a.z,t:0,txt:"-"+dmg+(crit?"!":""),col:crit?"#ff8a2a":"#ffd66b"});
    if(o.stun) a.stunT=Math.max(a.stunT||0,o.stun);
    myHits.push({i:a.nid,s:++hitSeq,d:dmg,st:o.stun||0,bl:o.bleed?1:0,r:o.ranged?1:0}); if(myHits.length>8) myHits.shift(); }
}
// урон зверю — считает только хозяин зверей (или одиночная игра)
function applyHit(a,peer,fromX,fromY,dmg=1,crit=false,o={}){
  if(a.dying>0) return;
  if(o.stun) a.stunT=Math.max(a.stunT||0,a.kind==="golem"?o.stun/2:o.stun);
  if(o.bleed){ a.bleedT=3; a.bleedBy=peer; }
  a.hp=(a.hp??mobHp(a.kind))-dmg; a.hurtT=0.3; a.lunge=0;
  hitFx.push({x:a.x,y:a.y,z:a.z,t:0,txt:"-"+dmg+(crit?"!":""),col:crit?"#ff8a2a":"#ffd66b"});
  (a.hitters||(a.hitters=new Set())).add(peer||"me");
  if(a.kind!=="golem"){
    const dx=a.x-fromX, dy=a.y-fromY, dd=Math.hypot(dx,dy)||1, nx=a.x+dx/dd*0.4, ny=a.y+dy/dd*0.4, c=cellAt(Math.round(nx),Math.round(ny));
    if(c&&!c.blocked&&Math.abs(walkZ(c)-a.z)<1.2){ a.x=nx; a.y=ny; }
    a.path=[]; a.state="chase"; a.attackT=Math.max(a.attackT,0.25); }
  a.aggro=true; a.aggroT=0; a.think=0.2;
  if(a.hp<=0&&a.kind==="golem"){ a.dying=3; a.path=[]; a.slamT=0; bossDeadAt=Date.now();
    if(NET.db) NET.db.doc("world/cave_boss").set({dead:bossDeadAt}).catch(()=>{});
    for(const pr of a.hitters){ if(!NET.room||pr===NET.myPeer||pr==="me") giveLoot(a); else { kills.push({i:a.nid,p:pr,s:++killSeq,k:a.kind}); if(kills.length>6) kills.shift(); } }
    return; }
  if(a.hp<=0){ a.dying=2.4; a.path=[]; a.howlT=0;
    if(!NET.room||peer===NET.myPeer) giveLoot(a);
    else { kills.push({i:a.nid,p:peer,s:++killSeq,k:a.kind}); if(kills.length>6) kills.shift(); }
    shareXP(a.kind,peer,a.x,a.y); }
}
function giveLoot(a){
  const got=rollDrops(a&&a.kind?a.kind:"wolf");
  for(const [id,n] of got){ inv[id]=(inv[id]||0)+n; floats.push({key:"plus",p:{n,fish:"#fish_"+id},col:id==="coin"?"#ffd66b":"#f0e0c0",t:-0.25*floats.length}); }
  const kind=a&&a.kind||"wolf"; renderInv();
  if(kind==="bat"){ say("bat_killed","bat_killed_sub"); prog.st.bats=(prog.st.bats||0)+1; }
  else if(kind==="spider"){ say("spider_killed","bat_killed_sub"); prog.st.spiders=(prog.st.spiders||0)+1; }
  else if(kind==="golem"){ say("boss_killed","boss_killed_sub"); prog.st.bosses=(prog.st.bosses||0)+1; }
  else { say("wolf_killed","wolf_killed_sub"); prog.st.wolves++; }
  addXP(xpOf(kind),"fight");
  if(quest2==="active"&&(inv.pelt||0)>=2) setTimeout(()=>say("pelts_ready","pelts_ready_sub"),1600);
}
// хозяин: удары от других игроков и награды за убийства
function processRemoteHits(){

    for(const h of r.ht){ if(!h||typeof h!=="object") continue; const s=num(h.s,0,1e9,0);
      if(s<=(lastHitFrom[r.peer]||0)) continue; lastHitFrom[r.peer]=s;
      const a=animals.find(x=>x.nid===String(h.i)); if(isMob(a)&&Math.hypot(a.x-r.tx,a.y-r.ty)<(h.r?7:ATK_RANGE+2.2)) applyHit(a,r.peer,r.tx,r.ty,num(h.d|0,1,12,1),false,{stun:num(h.st,0,3,0),bleed:h.bl===1}); } }
}
function checkMyKills(h){

}

function drawClubSwing(fx,fy,dir,t){

  ctx.save(); ctx.translate(Math.round(fx+dir*4),Math.round(fy-20)); ctx.scale(dir,1); ctx.rotate(ang);

}

function drawSlash(fx,fy,facing,t){
  if(t<0.1||t>0.3) return; const k=(t-0.1)/0.2, dir=facing[1]==="e"?1:-1, up=facing[0]==="n";
  ctx.save(); ctx.translate(Math.round(fx+dir*9),Math.round(fy-(up?24:16))); ctx.scale(dir,up?-1:1);
  ctx.globalAlpha=1-k; ctx.strokeStyle="#ffffff"; ctx.lineWidth=2; ctx.lineCap="round";
  ctx.beginPath(); ctx.arc(0,0,11+k*3,-1.5+k*0.6,0.9+k*0.4); ctx.stroke();
  ctx.globalAlpha=(1-k)*0.5; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,0,8+k*3,-1.0+k*0.6,0.6+k*0.4); ctx.stroke();
  ctx.restore();
}

// ---- генератор случайного острова ----
function genIsland(w,d){

    else if(r<0.05) props.push([x,y,"bush"]); else if(r<0.07) props.push([x,y,"rock_small"]); else if(r<0.14) props.push([x,y,rnd()<0.5?"grass_tuft":"grass_tuft_2"]); }

}

function updateRemotes(dt){

    r.phase=r.m?r.phase+dt*HERO_SPEED*Math.PI*1.6:0;
    if(r.ak) r.akT=((r.akT||0)+dt)%ATK_CD;
  }
  // звери от хозяина и укусы по мне
  if(NET.room&&!NET.host){
    const h=remotes.get(NET.hostPeer); if(h){ mirrorAnimals(h,dt); checkMyKills(h); checkXpShares(h); }

let lastBite={};
function mirrorAnimals(h,dt){
  const list=h.an||[], ids=new Set();
  for(const e of list){
    if(!e||typeof e!=="object") continue;
    const id=String(e.i).slice(0,20); ids.add(id);
    let a=animals.find(x=>x.nid===id);
    const kind=CODE_KIND[e.k]||"hare";
    if(!a){ a={kind,nid:id,x:num(e.x,-1,W,0),y:num(e.y,-1,D,0),z:num(e.z,0,12,1),path:[],speed:1.5,facing:"se",phase:0,think:1,alpha:0,leaving:false,state:"",attackT:1,lunge:0,howlT:0,fleeing:0}; animals.push(a); }
    a.tx=num(e.x,-1,W,a.x); a.ty=num(e.y,-1,D,a.y); a.tz=num(e.z,0,12,a.z); a.facing=FACINGS.includes(e.f)?convF(e.f,0,quarter()):a.facing; a.moving=e.m===1;
    a.alpha+=(num(e.a,0,1,1)-a.alpha)*Math.min(1,dt*6); a.leaving=e.lv===1;
    if(e.l===1&&a.lunge<=0){ a.lunge=0.25; }
    if(e.h===1) a.howlT=Math.max(a.howlT,0.5);
    a.hp=num(e.hp,0,999,mobHp(a.kind)); if(a.kind==="bat") a.fly=num(e.fy,0,6,1.5); if(e.hu===1) a.hurtT=Math.max(a.hurtT||0,0.12);
    if(e.dy===1){ if(!(a.dying>0)) a.dying=2.4; } else a.dying=0;
    a.stunT=e.sn===1?Math.max(a.stunT||0,0.25):0;
    if(a.kind==="golem"){ const tg=num(e.tg,0,3,0); if(a.slamT>0&&tg<=0) a.slamFx=0.5; a.slamT=tg; }
  }
  for(let i=animals.length-1;i>=0;i--){ const a=animals[i]; if(!ids.has(a.nid)) animals.splice(i,1); }
  const k=Math.min(1,dt*8);
  for(const a of animals){ if(a.tx===undefined) continue;
    if(Math.hypot(a.tx-a.x,a.ty-a.y)>3){a.x=a.tx;a.y=a.ty;}
    a.x+=(a.tx-a.x)*k; a.y+=(a.ty-a.y)*k; a.z+=(a.tz-a.z)*k;
    a.phase=a.moving?a.phase+dt*(a.kind==="wolf"?2.5:2)*4:0;
    a.lunge=Math.max(0,a.lunge-dt); a.howlT=Math.max(0,a.howlT-dt); a.hurtT=Math.max(0,(a.hurtT||0)-dt);
    if(a.dying>0) a.moving=false;
    if(a.lunge>0) a.lungeTo=[hero.x,hero.y];
  }
  for(const b of h.bt||[]){
    if(!b||b.p!==NET.myPeer) continue; const s=num(b.s,0,1e9,0);
    if(s>(lastBite[NET.hostPeer]||0)){ lastBite[NET.hostPeer]=s;

      hurtHero(num(b.n,1,5,1)|0,w||null); }
  }
  hero.hurtT=Math.max(0,hero.hurtT-dt);
}

function applyTreeDoc(c,d){

    else { c.props=c.props.filter(n=>!n.startsWith("tree")); refreshBlocked(c); const i=TREES.findIndex(t=>t.c===c); if(i>=0) TREES.splice(i,1);

const fireDocs=new Set();
function applyFires(docs){
  const now=Date.now(), keep=new Set();

  for(const s of docs){
    const d=s.data(); if(!d) continue; fireDocs.add(s.id);
    const c=cellAt(num(d.x,0,W-1,0)|0,num(d.y,0,D-1,0)|0); if(!c) continue;

    keep.add(c);
    if(c.fire){ if(Math.abs(c.fire.until-until)>500) c.fire.until=until; }
    else if(!c.water&&!c.hutPart&&!c.npcHere&&!treeName(c)){ addFire(c,until,false); }
  }
  for(let i=fires.length-1;i>=0;i--){ const f=fires[i]; if(!keep.has(f.c)&&f.synced){ fires.splice(i,1); f.c.fire=null; refreshBlocked(f.c); } }

}

// ---- 3D-режим во время поворота: сплошные грани с текстурами из спрайтов ----
const TEX={}, TN=34, SH=9;
function buildTextures(){
  const srcData=im=>{const c=document.createElement("canvas");c.width=im.width;c.height=im.height;const g=c.getContext("2d");g.drawImage(im,0,0);return g.getImageData(0,0,im.width,im.height)};
  const make=(w,h,fn,src)=>{const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d"),o=g.createImageData(w,h);
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){let [px,py]=fn(i,j);px=Math.max(0,Math.min(src.width-1,px|0));py=Math.max(0,Math.min(src.height-1,py|0));
      const si=(py*src.width+px)*4,di=(j*w+i)*4;o.data[di]=src.data[si];o.data[di+1]=src.data[si+1];o.data[di+2]=src.data[si+2];o.data[di+3]=255;}
    g.putImageData(o,0,0);return c};
  for(const n of ["block_grass","block_grass_2","block_grass_dark","block_stone_path","block_dirt","block_rock",...Object.values(TOP_SPRITE)].filter((n,i,a)=>a.indexOf(n)===i&&img[n])){
    const s=srcData(img[n]);
    TEX[n+"_top"]=make(TN,TN,(i,j)=>{const a=(i+.5)/TN,b=(j+.5)/TN;return [32+32*a-32*b,2+17*a+17*b]},s);
    TEX[n+"_L"]=make(TN,SH,(i,r)=>{const a=(i+.5)/TN;return [32*a,Math.floor(19+17*a)+1+r]},s);
    TEX[n+"_R"]=make(TN,SH,(i,r)=>{const a=(i+.5)/TN;return [63.5-32*a,Math.floor(19+17*a)+1+r]},s);
  }
}
function draw3D(anchor){
  const S=RS, OX=ROX, OY=ROY;
  const sub=(p,q)=>[p[0]-q[0],p[1]-q[1]];
  function face(tex,p0,e1,e2){const w=tex.width,h=tex.height;
    ctx.setTransform(S*e1[0]/w,S*e1[1]/w,S*e2[0]/h,S*e2[1]/h,OX+S*p0[0],OY+S*p0[1]);
    ctx.drawImage(tex,-0.6,-0.6,w+1.2,h+1.2);}
  const SIDES=[{n:[1,0],dx:1,dy:0,ax:0,ay:1},{n:[0,1],dx:0,dy:1,ax:1,ay:0},{n:[-1,0],dx:0,dy:0,ax:0,ay:1},{n:[0,-1],dx:0,dy:0,ax:1,ay:0}];
  ctx.imageSmoothingEnabled=true; ctx.imageSmoothingQuality="high";
  for(const c of cells){
    if(c!==anchor&&c!==hutAnchor&&c!==NPCC&&c!==MERCHC&&!cellVisible(c)){ continue; }
    const X0=c.x-MX-.5, Y0=c.y-MY-.5;
    for(const sd of SIDES){
      const nu=sd.n[0]*ca-sd.n[1]*sa, nv=sd.n[0]*sa+sd.n[1]*ca; if(nu+nv<=0.001) continue;
      const nb=cellAt(c.x+sd.n[0],c.y+sd.n[1]), nh=nb?(wet(nb)?nb.L-1:nb.L):0, side=(nu-nv)<0?"_L":"_R", sx=X0+sd.dx, sy=Y0+sd.dy;
      for(let z=nh;z<c.L;z++){const p0=proj(sx,sy,z+1);face(TEX[(CAVE?"block_cave_wall":z<2?"block_rock":"block_grass")+side],p0,sub(proj(sx+sd.ax,sy+sd.ay,z+1),p0),sub(proj(sx,sy,z),p0));}
      if(c.st){const p0=proj(sx,sy,c.L+.5);face(TEX["block_stone_path"+side],p0,sub(proj(sx+sd.ax,sy+sd.ay,c.L+.5),p0),sub(proj(sx,sy,c.L),p0));}
    }
    const Z=c.st?c.L+.5:c.L, top=c.st?"block_stone_path":TOP_SPRITE[c.t], p0=proj(X0,Y0,Z);
    if(c.fire){ worldTransform(); drawFire(c); }
    if(wet(c)){ worldTransform(); drawWater(c); drawWaterFx(c); if(c.pier) drawMarketProp(c.pier,c); } else face(TEX[top+"_top"],p0,sub(proj(X0+1,Y0,Z),p0),sub(proj(X0,Y0+1,Z),p0));
    if(c.stump){ worldTransform(); drawStump(c); }

    if(c.props.length){

      for(const name of c.props){

          const im=img.fence_left, ax=name==="fence_left"?[0,1]:[1,0];
          const u=ax[0]*ca-ax[1]*sa, v=ax[0]*sa+ax[1]*ca; let ex=(u-v)*HW, ey=(u+v)*HH; if(ey<0){ex=-ex;ey=-ey}
          ctx.setTransform(S*(-ex/32),S*((17-ey)/32),0,S,OX+S*ctr[0],OY+S*ctr[1]); ctx.drawImage(im,-im.width/2,-FENCE_BASE);
        } else if(MARKET_PROPS.test(name)) drawMarketProp(name,c);
        else { worldTransform(); if(img[name]) drawProp(img[name],name,ctr[0],ctr[1],c); else drawPropFallback(name,ctr[0],ctr[1]); }
      }

    if(HUT&&c===hutAnchor) drawHut();

}

// ---- Герой: спрайты hero_<se|sw|ne|nw>_<0..3>, если есть; иначе временный пиксельный человечек ----
function drawHero(){
  if(hero.hurtT>0&&Math.floor(hero.hurtT*14)%2) return;
  const [fx,fy]=proj(hero.x-MX,hero.y-MY,hero.z);
  if(shieldT>0) drawShieldFx(fx,fy);

  if(heroClass==="druid") afterHeroFx=()=>drawDruidMark(fx,fy,hero.facing);
  ctx.save(); ctx.imageSmoothingEnabled=false;
  ctx.fillStyle="rgba(20,10,40,.28)"; ctx.beginPath(); ctx.ellipse(fx,fy,9,4.5,0,0,Math.PI*2); ctx.fill();
  // цикл шага 1-2-3-2, кадр 0 — стойка
  const frame=hero.moving?[1,2,3,2][Math.floor(hero.phase/Math.PI*2)%4]:0;
  // спрайты смотрят вправо (se/ne); влево — зеркально, если нет своих sw/nw
  const pre=heroClass==="druid"&&img.druid_se_0?"druid":"hero";
  let hn=`${pre}_${hero.facing}_${frame}`, mirror=false;
  if(!img[hn]&&hero.facing[1]==="w"){ hn=`${pre}_${hero.facing[0]}e_${frame}`; mirror=true; }
  if(pre==="druid"&&(hero.atk||hero.castT>0)){ const sp=druidAtk(hero.facing,myHueIdx), lk=hero.atk?Math.sin(Math.min(1,hero.atk.t/ATK_TIME)*Math.PI)*3:2, dir=hero.facing[1]==="e"?1:-1;
    if(sp){ ctx.translate(Math.round(fx)+dir*Math.round(lk),Math.round(fy)); if(hero.facing[1]==="w") ctx.scale(-1,1); ctx.drawImage(sp,-Math.round(sp.width/2),-sp.height+2); ctx.restore(); return; } }
  if(hero.atk){ const as=atkSprite(hero.facing,hero.atk.t,myHueIdx), [lx,ly]=atkLunge(hero.facing,hero.atk.t);
    if(as&&as.sp){ ctx.save(); ctx.translate(Math.round(fx)+lx,Math.round(fy)+ly); if(as.mirror) ctx.scale(-1,1); ctx.drawImage(as.sp,-Math.round(as.sp.width/2),-as.sp.height+2); ctx.restore();
      drawSlash(fx,fy,hero.facing,hero.atk.t); ctx.restore(); return; } }
  const sp=heroSprite(hn,myHueIdx);
  if(sp){ ctx.translate(Math.round(fx),Math.round(fy)); if(mirror) ctx.scale(-1,1);
    ctx.drawImage(sp,-Math.round(sp.width/2),-sp.height+2); ctx.restore();
    if(hero.atk){ ctx.save(); drawClubSwing(fx,fy,hero.facing[1]==="e"?1:-1,hero.atk.t); ctx.restore(); }
    return; }
  const front=hero.facing[0]==="s", flip=hero.facing[1]==="w"?-1:1;

  // контур

  R(-6,-30,12,11,O); R(-7,-20,14,13,O); R(-9,-19,3,10,O); R(6,-19,3,10,O);
  R(-5,-10,5,10,O); R(0,-10,5,10,O);
  // ноги
  const lL=Math.max(0,sw), lR=Math.max(0,-sw);
  R(-4,-9,3,9-lL,"#3b3550"); R(-4,-2-lL,3,2,"#2a1f14");
  R(1,-9,3,9-lR,"#3b3550");  R(1,-2-lR,3,2,"#2a1f14");
  // руки
  R(-8,-18+sw,2,8,front?"#f1c27d":"#2f5fc4"); R(6,-18-sw,2,8,"#f1c27d");
  // туника и пояс
  R(-6,-19,12,11,"#3a6fd8"); R(-6,-19,12,2,"#5a8ff0"); R(-6,-11,12,2,"#6b4423"); R(-1,-11,2,2,"#ffd66b");
  // голова
  R(-5,-29,10,10,"#f1c27d");
  if(front){ R(-5,-30,10,3,"#6a3f1c"); R(-5,-27,2,3,"#6a3f1c"); R(0,-25,1,2,"#1b1528"); R(3,-25,1,2,"#1b1528"); R(1,-21,2,1,"#c98a5a"); }
  else { R(-5,-30,10,8,"#6a3f1c"); R(-5,-22,10,1,"#57321a"); }
  ctx.restore();
}

function cellQuad(c){
  const Z=walkZ(c), X=c.x-MX, Y=c.y-MY;
  return [proj(X-.5,Y-.5,Z),proj(X+.5,Y-.5,Z),proj(X+.5,Y+.5,Z),proj(X-.5,Y+.5,Z)];
}
function quadPath(pts){ctx.beginPath();ctx.moveTo(...pts[0]);for(let i=1;i<4;i++)ctx.lineTo(...pts[i]);ctx.closePath()}
function drawOverlay(now){
  worldTransform();
  if(showGrid){ctx.strokeStyle="rgba(255,255,255,.3)";ctx.lineWidth=1;for(const c of cells){quadPath(cellQuad(c));ctx.stroke()}}
  if(hover&&!anim){quadPath(cellQuad(hover));ctx.fillStyle="rgba(255,255,255,.16)";ctx.fill();ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=1;ctx.stroke()}
  if(marker){ // кольцо в точке назначения, лежит на земле
    const c=cellAt(marker.x,marker.y); if(c){
      const Z=walkZ(c), X=c.x-MX, Y=c.y-MY, t=marker.t;
      const col=marker.ok?"255,214,107":"255,90,90";
      for(const k of [0,1]){
        const ph=((t*1.2+k*0.5)%1), r=0.15+ph*0.35, a=(1-ph)*0.9;
        ctx.beginPath();
        for(let i=0;i<=24;i++){const an=i/24*Math.PI*2, p=proj(X+Math.cos(an)*r,Y+Math.sin(an)*r,Z); i?ctx.lineTo(...p):ctx.moveTo(...p);}
        ctx.strokeStyle=`rgba(${col},${a})`; ctx.lineWidth=1; ctx.stroke();
      }
      ctx.beginPath();
      for(let i=0;i<=16;i++){const an=i/16*Math.PI*2, p=proj(X+Math.cos(an)*.1,Y+Math.sin(an)*.1,Z); i?ctx.lineTo(...p):ctx.moveTo(...p);}
      ctx.fillStyle=`rgba(${col},.9)`; ctx.fill();
      if(!marker.ok&&t>1.2) marker=null;
    }
  }
}

function render(now){
  const anchor=drawOrder(), d=dprNow(), r=cv.getBoundingClientRect();
  assignEnts();
  const sky=SKY;

  if(buf.width!==bw||buf.height!==bh){buf.width=bw;buf.height=bh}

  RS=1; ROX=offX; ROY=offY;
  ctx=bufCtx; ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1;
  ctx.fillStyle=sky; ctx.fillRect(0,0,bw,bh);
  if(!anim){ drawSprites(anchor); }
  else {

      spriteCtx.setTransform(1,0,0,1,0,0); spriteCtx.clearRect(0,0,bw,bh);
      ctx=spriteCtx; drawSprites(anchor); ctx=bufCtx;
      ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=alpha; ctx.drawImage(spriteLayer,0,0); ctx.globalAlpha=1;
    }
  }
  drawWindFx();
  drawFishing();
  drawChopFx();
  applyLighting();      // закат, ночь и огни
  drawNightFx();
  if(afterHeroFx){ worldTransform(); afterHeroFx(); afterHeroFx=null; }
  drawProjectiles(); drawStatusFx(); drawHitFx();
  edDrawMarks();
  drawOverlay(now);
  updateTags();
  // вывод на экран

// ---------- Цикл ----------
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let last=performance.now(), dirty=true;
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  T+=dt; updateWind(dt); updateFishing(dt); updateChopping(dt); updateSmoke(dt); updateNPC(dt); updateMerchant(dt); updateClock(dt); updateFires(dt); prog.st.time+=dt; updateCombat(dt); updateSkills(dt); updateBossBar(); updateAnimalsNet(dt); updateRemotes(dt); updateHitFx(dt); sendPresence(now); tickSave(dt); tickPlayerDoc(); updateFireflies(); syncActions(); syncFishUI(); dirty=true;
  if(anim){
    const t=Math.min(1,(now-anim.t0)/anim.dur), e=t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
    setRot(anim.from+(anim.to-anim.from)*e); if(t>=1){setRot(anim.to);anim=null} dirty=true;
  }
  updateHero(dt);
  if(marker){marker.t+=dt;dirty=true}
  if(hero.moving) dirty=true;
  if(follow){ // камера мягко держит героя в центре
    const r=cv.getBoundingClientRect(), [hx,hy]=proj(hero.x-MX,hero.y-MY,hero.z);
    const tx=r.width/2-hx*scale, ty=r.height/2-(hy-14)*scale;
    const k=Math.min(1,dt*6); const nx=panX+(tx-panX)*k, ny=panY+(ty-panY)*k;
    if(Math.abs(nx-panX)>0.01||Math.abs(ny-panY)>0.01){panX=nx;panY=ny;dirty=true}
  }
  if(dirty){render(now);dirty=false}
  requestAnimationFrame(frame);
}
