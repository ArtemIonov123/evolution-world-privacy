<meta charset="utf-8">
<title>Изометрический остров</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#2d2440">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=PT+Sans:wght@400;700&display=swap">
<style>
/* Layout: full-screen game canvas on lavender; compact pixel toolbar on top (toggles fold into a menu on phones);
   round zoom/rotate controls float on the right for the thumb; status bottom-left, catch panel bottom-right (top-left on phones). */
:root{
  --sky:#a99ad6; --panel:#2d2440; --panel-2:#3d3257; --edge:#1b1528;
  --ink:#f4efff; --muted:#c9bde8; --accent:#ffd66b;
  --f-display:"Silkscreen","Courier New",monospace;
  --f-body:"PT Sans",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--f-body);overflow:hidden;display:flex;flex-direction:column;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{touch-action:manipulation;-webkit-user-select:none;user-select:none}

/* верхняя панель */
.bar{position:relative;z-index:5;display:flex;align-items:center;gap:8px;background:var(--panel);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar h1{font-family:var(--f-display);font-size:15px;font-weight:400;letter-spacing:.06em;margin:0 auto 0 0;color:var(--accent);white-space:nowrap}
.btn{font-family:var(--f-display);font-size:12px;color:var(--ink);background:var(--panel-2);border:2px solid var(--edge);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);padding:6px 10px;cursor:pointer;border-radius:0;min-height:34px}
.btn:hover{background:#4b3e6b}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--panel)}
.lang{display:flex}
.lang .btn{padding:6px 9px}
.lang .btn+.btn{border-left:0}
.menu{display:flex;gap:8px}
#menuBtn{display:none;line-height:0;padding:6px 9px}

/* сцена */
.stage{position:relative;flex:1;min-height:0}
canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:none;outline:none}
canvas.drag{cursor:grabbing}
.panel{background:var(--panel);border:2px solid var(--edge)}
.panel b{font-family:var(--f-display);font-weight:400;color:var(--accent);font-size:12px;letter-spacing:.05em}

/* круглые кнопки зума и поворота справа */
.ctrl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%);
  display:flex;flex-direction:column;align-items:center;gap:8px}
.round{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-size:20px;line-height:1;padding:0;
  font-family:var(--f-body);font-weight:700;color:var(--ink);background:var(--panel);border:2px solid var(--edge);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);cursor:pointer}
.round:active{transform:translateY(1px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.35)}
.round:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.zoom{font-family:var(--f-display);font-size:11px;color:var(--panel);background:rgba(255,255,255,.55);padding:1px 5px}
.ctrl .gap{height:6px}

.info{position:absolute;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding:8px 12px;font-size:14px;line-height:1.45;max-width:min(460px,calc(100% - 32px))}
.info span{color:var(--muted)}
.inv{position:absolute;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding:8px 10px;max-width:calc(100% - 32px)}
.inv .empty{font-size:13px;color:var(--muted);margin-top:2px}
.inv .slots{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.inv .slot{position:relative;width:44px;height:44px;background:var(--panel-2);border:2px solid var(--edge);display:grid;place-items:center}
.inv .slot img{width:32px;height:32px;image-rendering:pixelated}
.inv .slot span{position:absolute;right:2px;bottom:0;font-family:var(--f-display);font-size:11px;color:var(--ink);text-shadow:1px 1px 0 var(--edge)}

/* рыбалка */
.fishbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));
  display:flex;flex-direction:column;align-items:center;gap:10px}
.fishbar button{font-family:var(--f-display);color:var(--ink);background:var(--panel-2);border:2px solid var(--edge);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);cursor:pointer;border-radius:0}
.fishbar button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fishbar .reel{font-size:12px;padding:8px 14px;min-height:40px}
.fishbar .hook{position:relative;overflow:hidden;font-size:22px;padding:16px 30px 20px;min-width:200px;background:var(--accent);color:var(--panel);
  border:3px solid var(--edge);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 0 0 4px rgba(255,214,107,.35);animation:pulse .45s ease-in-out infinite alternate}
.fishbar .hook i{position:absolute;left:0;bottom:0;height:6px;width:100%;background:#e8402c}
@keyframes pulse{to{transform:scale(1.08);box-shadow:inset 0 -5px 0 rgba(0,0,0,.2),0 0 0 8px rgba(255,214,107,.15)}}
@media (prefers-reduced-motion:reduce){.fishbar .hook{animation:none}}

/* часы, здоровье, действия, затемнение */
.bar h1{margin-right:0}
.clock{display:flex;align-items:center;gap:5px;margin-right:auto;font-family:var(--f-display);font-size:12px;color:var(--ink);
  background:var(--panel-2);border:2px solid var(--edge);padding:3px 7px;font-variant-numeric:tabular-nums}
.hp{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:12px;display:flex;gap:2px;padding:5px 7px}
.hp svg{display:block}
.actions{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center}
.actions .big{font-size:14px;padding:10px 16px;min-height:44px;background:var(--accent);color:var(--panel)}
.actions .btn{min-height:44px}
.fade{position:absolute;inset:0;background:#0b0814;opacity:0;pointer-events:none;transition:opacity .6s ease}
.inv .slot.edible{cursor:pointer;outline:2px solid #ffb070;outline-offset:-2px}
/* мультиплеер: подписи, облачка, игроки, чат */
.tags{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.tag{position:absolute;left:0;top:0;display:flex;flex-direction:column;align-items:center;gap:3px;transform-origin:0 0;width:0}
.tag .nm{font-size:11px;font-weight:700;color:#fff;background:rgba(27,21,40,.78);border:2px solid #3a7be0;padding:0 5px;white-space:nowrap;line-height:15px}
.tag .bubble{max-width:180px;width:max-content;font-size:13px;line-height:1.3;color:#1b1528;background:#fffdf4;border:2px solid #1b1528;padding:3px 7px;
  box-shadow:2px 2px 0 rgba(27,21,40,.35);overflow-wrap:anywhere;text-align:center}
.players{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:12px;padding:6px 9px;font-size:12px;max-width:180px}
.players .prow{display:flex;align-items:center;gap:6px;min-width:0;line-height:1.5}
.players .prow i{width:9px;height:9px;flex:none;border:1px solid var(--edge)}
.players .prow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chatbar{position:absolute;left:50%;transform:translateX(-50%);top:12px;width:min(520px,calc(100% - 280px));padding:8px;display:flex;flex-direction:column;gap:6px;z-index:5}
.chatrow{display:flex;gap:6px}
.chatrow input{flex:1;min-width:0;font:15px var(--f-body);padding:8px 10px;border:2px solid var(--edge);background:#fffdf4;color:#1b1528;border-radius:0}
.quick{display:flex;flex-wrap:wrap;gap:6px}
.chatlog{max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;font-size:13px;line-height:1.35;padding:2px 2px 4px;border-bottom:1px solid var(--panel-2)}
.chatlog .msg{display:flex;gap:6px;min-width:0}
.chatlog time{color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.chatlog b{flex:none;font-weight:700}
.chatlog span{min-width:0;overflow-wrap:anywhere}
.chatlog .empty{color:var(--muted)}
.round{position:relative}
.round .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:#e8402c;color:#fff;
  font:700 11px/14px var(--f-body);border:2px solid var(--edge);display:grid;place-items:center}
.players .prow.off{opacity:.65}
.quick .btn{font-family:var(--f-body);font-weight:700;font-size:13px;letter-spacing:0}
/* кнопки окон и окна персонажа */
.hotbar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:52px;display:flex;gap:6px;z-index:3}
.hb{position:relative;width:44px;height:44px;display:grid;place-items:center;padding:0;background:var(--panel);border:2px solid var(--edge);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);cursor:pointer;color:var(--ink)}
.hb img{width:32px;height:32px;image-rendering:pixelated}
.hb:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hb[aria-pressed="true"]{background:var(--panel-2);box-shadow:inset 0 0 0 2px var(--accent)}
.hb .dot{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--accent);color:var(--panel);
  font:700 12px/14px var(--f-body);border:2px solid var(--edge);display:grid;place-items:center}
.win{position:absolute;z-index:7;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100% - 24px));max-height:calc(100% - 24px);
  display:flex;flex-direction:column;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.whead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 12px;border-bottom:2px solid var(--edge)}
.whead b{font-family:var(--f-display);font-weight:400;color:var(--accent);font-size:14px;letter-spacing:.05em}
.wx{min-height:32px;padding:2px 10px;font-family:var(--f-body)}
.wbody{overflow-y:auto;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.wbody .grid{display:flex;flex-wrap:wrap;gap:6px}
.wbody .slot{position:relative;width:48px;height:48px;background:var(--panel-2);border:2px solid var(--edge);display:grid;place-items:center;padding:0;cursor:pointer;color:var(--ink)}
.wbody .slot img{width:36px;height:36px;image-rendering:pixelated}
.wbody .slot span{position:absolute;right:2px;bottom:0;font-family:var(--f-display);font-size:11px;text-shadow:1px 1px 0 var(--edge)}
.wbody .slot.sel{box-shadow:inset 0 0 0 2px var(--accent);background:#4b3e6b}
.wbody .slot.empty{opacity:.4;cursor:default}
.wbody .slot:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.detail{border-top:1px solid var(--panel-2);padding-top:8px}
.drow{display:flex;gap:10px;align-items:center}
.drow img{width:48px;height:48px;image-rendering:pixelated;flex:none}
.drow b{font-size:15px}
.drow p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.acts .btn{font-family:var(--f-body);font-weight:700;font-size:13px;min-height:40px;letter-spacing:0}
.acts .big{background:var(--accent);color:var(--panel)}
.wbody .muted{color:var(--muted);font-size:13px;margin:0}
.wbody .center{text-align:center}
.wbody .sub{font-family:var(--f-display);font-weight:400;color:var(--accent);font-size:12px;margin-top:4px;letter-spacing:.04em}
.doll{display:grid;grid-template-columns:1fr 96px 1fr;grid-template-areas:"head hero neck" "body hero weapon" "feet hero .";gap:6px 10px;align-items:center;justify-items:center}
.eslot{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.eslot small{font-size:11px;color:var(--muted);text-align:center;line-height:1.2}
.heroPrev{width:96px;height:144px;image-rendering:pixelated}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stats3 div{background:var(--panel-2);border:2px solid var(--edge);padding:5px;text-align:center;display:flex;flex-direction:column}
.stats3 b{font-family:var(--f-display);font-size:16px;font-weight:400}
.stats3 small{font-size:11px;color:var(--muted)}
.wbody .bar{height:8px;background:var(--panel-2);border:2px solid var(--edge)}
.wbody .bar i{display:block;height:100%;background:var(--accent)}
.hhead{display:flex;flex-direction:column;gap:4px}
.hhead b{font-size:15px}
.hhead small{font-size:12px;color:var(--muted)}
.skill{display:grid;grid-template-columns:120px 1fr;gap:2px 8px;align-items:center;font-size:13px}
.skill small{grid-column:1/-1;color:var(--muted);font-size:11px}
.statlist div{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px solid var(--panel-2)}
.quest{background:var(--panel-2);border:2px solid var(--edge);padding:7px 9px}
.quest b{font-size:14px}
.quest p{margin:2px 0 0;font-size:13px;color:var(--muted)}
.quest.done{opacity:.6}
#dlgOpts .btn:disabled{opacity:.45;cursor:default}
.shead{display:flex;gap:10px;align-items:center}
.sportrait{width:56px;height:56px;image-rendering:pixelated;border:2px solid var(--edge);flex:none}
.shead b{font-family:var(--f-display);font-weight:400;color:var(--accent);font-size:13px}
.shead p{margin:2px 0 0;font-size:14px;line-height:1.4}
.tabs{display:flex;gap:6px;align-items:center}
.tabs .btn{font-family:var(--f-body);font-weight:700;font-size:13px;min-height:36px;letter-spacing:0}
.tabs .btn.on{background:var(--accent);color:var(--panel)}
.tabs .coins{margin-left:auto;font-family:var(--f-display);font-size:12px;color:#ffd66b}
.wbody .slot em{position:absolute;left:2px;top:0;font:700 10px/12px var(--f-body);font-style:normal;color:#ffd66b;text-shadow:1px 1px 0 var(--edge)}
.acts .btn:disabled{opacity:.45;cursor:default}
/* редактор карты */
.edpanel{position:absolute;z-index:6;left:max(10px,env(safe-area-inset-left,0px));top:10px;bottom:10px;width:min(300px,calc(100% - 20px));
  overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:8px}
.edtop{display:flex;gap:6px}
.edtop .btn,.edopt .btn{font-family:var(--f-body);font-weight:700;letter-spacing:0}
.edtop .btn{flex:1;font-size:13px;min-height:38px}
.edtop .big{background:var(--accent);color:var(--panel)}
.edpanel .btn.warn{background:#e8402c;color:#fff}
.edpanel .btn:disabled{opacity:.45;cursor:default}
.edgrp b{font-family:var(--f-display);font-weight:400;color:var(--accent);font-size:11px;letter-spacing:.04em}
.edrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.edb{width:62px;min-height:60px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 2px;background:var(--panel-2);border:2px solid var(--edge);color:var(--ink);cursor:pointer}
.edb img{width:44px;height:32px;object-fit:contain;image-rendering:pixelated}
.edb .edic{font-size:20px;line-height:32px;height:32px}
.edb small{font-size:10px;line-height:1.1;text-align:center}
.edb.on{box-shadow:inset 0 0 0 2px var(--accent);background:#4b3e6b}
.edb:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.edopt{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.edmrow{display:flex;gap:8px;align-items:flex-start}
.edtabs{display:flex;gap:4px;flex-wrap:wrap}
.edtabs .btn{flex:1;font-family:var(--f-body);font-weight:700;letter-spacing:0;font-size:12px;min-height:34px;padding:4px 6px}
.edtabs .btn.on{background:var(--accent);color:var(--panel)}
.edtxt{display:flex;flex-direction:column;gap:3px}
.edtxth{display:flex;align-items:center;justify-content:space-between;gap:6px}
.edtxth b{font-size:12px;color:var(--accent);font-weight:700}
.edtxt textarea{font:14px/1.35 var(--f-body);padding:6px 8px;border:2px solid var(--edge);background:#fffdf4;color:#1b1528;border-radius:0;resize:vertical;width:100%;box-sizing:border-box}
.edtxt textarea:focus-visible,.ednum:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.edpanel .btn.mini{min-height:26px;padding:2px 6px;font-family:var(--f-body);font-size:11px;letter-spacing:0}
.edshop{display:flex;align-items:center;gap:6px;font-size:13px;padding:3px 0;border-bottom:1px solid var(--panel-2)}
.edshop img{width:28px;height:28px;image-rendering:pixelated;flex:none}
.edshop span{flex:1;min-width:0}
.edchk{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
.ednum{width:64px;font:14px var(--f-body);padding:4px 6px;border:2px solid var(--edge);background:#fffdf4;color:#1b1528;border-radius:0}
.edpanel .sub{font-family:var(--f-display);font-weight:400;color:var(--accent);font-size:11px;letter-spacing:.04em;margin-top:4px}
.edmini{width:150px;height:150px;image-rendering:pixelated;border:2px solid var(--edge);cursor:pointer;flex:none}
.edside{display:flex;flex-direction:column;gap:6px;min-width:0;flex:1}
.edside .btn{font-family:var(--f-body);font-weight:700;letter-spacing:0;font-size:12px;min-height:34px;padding:4px 6px}
.edside .btn.on{background:var(--accent);color:var(--panel)}
.edside small{font-size:11px;line-height:1.3}
.edsizegrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:4px}
.edsz{display:flex;align-items:center;gap:4px;font-size:12px}
.edsz span{flex:1;min-width:0}
.edsz .btn{font-family:var(--f-body);font-weight:700;min-height:30px;padding:2px 10px}
.edopt .btn{font-size:12px;min-height:34px;padding:4px 8px}
.edsize{font-family:var(--f-display);font-size:12px;padding:0 4px}
.edpanel .muted{color:var(--muted);font-size:12px;margin:0}
body.editing .hotbar,body.editing .actions,body.editing .players,body.editing .hp{display:none!important}
/* окно ника */
.nickwrap{position:absolute;inset:0;z-index:8;display:grid;place-items:center;background:rgba(20,14,34,.55);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nickdlg{width:min(360px,100%);padding:18px;display:flex;flex-direction:column;gap:10px}
.nickdlg b{font-family:var(--f-display);font-weight:400;color:var(--accent);font-size:16px;letter-spacing:.04em}
.nickdlg p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.nickdlg input{font:16px var(--f-body);padding:10px 12px;border:2px solid var(--edge);background:#fffdf4;color:#1b1528;border-radius:0}
.nickdlg input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.nickdlg .big{font-size:15px;padding:10px 16px;min-height:44px;background:var(--accent);color:var(--panel)}
.nickerr{color:#ffb4a0;font-size:13px}
.tag .nm.mine{border-style:dashed}
/* диалог с NPC */
.dialog{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(620px,calc(100% - 32px));display:flex;gap:12px;padding:12px;z-index:4;align-items:flex-start}
#portrait{width:72px;height:72px;image-rendering:pixelated;border:2px solid var(--edge);flex:none}
.dlg-body{min-width:0;flex:1}
.dlg-body p{margin:4px 0 10px;font-size:15px;line-height:1.45;color:var(--ink);max-width:62ch}
.dlg-opts{display:flex;flex-direction:column;gap:6px}
.dlg-opts .btn{text-align:left;font-family:var(--f-body);font-size:14px;font-weight:700;min-height:40px;padding:8px 12px;letter-spacing:0}
/* телефоны */
@media (max-width:720px){
  .bar h1{font-size:13px}
  #menuBtn{display:block}
  .menu{position:absolute;top:100%;right:max(16px,env(safe-area-inset-right,0px));flex-direction:column;align-items:stretch;
    background:var(--panel);border:2px solid var(--edge);padding:8px;gap:8px;min-width:200px}
  .menu:not(.open){display:none}
  .menu .btn{min-height:44px;font-size:13px;text-align:left}
  .info{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
    max-width:none;font-size:13px;padding:6px 10px}

function mapKey(){ return "island_map_"+(window.__islandWorld||"claude"); }
function validMap(m){ try{
  if(!m||!Array.isArray(m.levels)||!Array.isArray(m.tops)) return false;
  const d=m.levels.length, w=(m.levels[0]||"").length; if(d<8||d>40||w<8||w>40||m.tops.length!==d) return false;
  for(let y=0;y<d;y++){ if(typeof m.levels[y]!=="string"||m.levels[y].length!==w||!/^[0-9]+$/.test(m.levels[y])) return false;
    if(typeof m.tops[y]!=="string"||m.tops[y].length!==w) return false; }
  if(!m.stairs||typeof m.stairs!=="object"||!Array.isArray(m.props)||!Array.isArray(m.start)) return false;
  return /[1-9]/.test(m.levels.join("")); }catch(e){ return false; } }
let MAP_V=0;
try{ const raw=localStorage.getItem(mapKey()); if(raw){ const o=JSON.parse(raw);
  if(o&&validMap(o.m)){ Object.assign(MAP,{hut:null,npc:null,merchant:null,stall:null,pier:null,zones:null},o.m); MAP_V=o.v||0; } } }catch(e){}

// ---------- Геометрия (по реальным спрайтам) ----------
const HW = 32, HH = 17;  // половина ромба 64x34
const LH = 10;           // высота уровня
const TOP_Y = 2;         // отступ верха ромба в спрайте блока

// ---------- Карта ----------
// MAP.levels — высота клетки цифрой (0 = пусто)
// MAP.tops   — g/G трава, d тёмная трава, s тропа, e земля
// MAP.stairs — "x,y": L (подъём к x-1) или R (подъём к y-1)
// MAP.props  — [x, y, спрайт]
const LEVELS = MAP.levels.map(r=>[...r].map(Number));
const TOPS = MAP.tops;
const W = LEVELS[0].length, D = LEVELS.length;
const MX = (W-1)/2, MY = (D-1)/2;
const TOP_SPRITE = {g:"block_grass",G:"block_grass_2",d:"block_grass_dark",s:"block_stone_path",e:"block_dirt",w:"block_dirt"};
const TOP_NAME = {g:"трава",G:"трава",d:"тёмная трава",s:"каменная тропа",e:"земля",w:"вода"};
const BLOCKING = new Set(["tree_big","tree_small","bush","rock_big","fence_left","fence_right"]);
const STAIR_DIR = {L:[-1,0], R:[0,-1]};

const img = {};
const loadAll = Promise.all(Object.entries(SPRITES).map(([k,src])=>new Promise(r=>{const i=new Image();i.onload=()=>{img[k]=i;r()};i.src=src})));

const cells=[], grid=[...Array(D)].map(()=>Array(W).fill(null));
for(let y=0;y<D;y++)for(let x=0;x<W;x++){
  const L=LEVELS[y][x]; if(!L) continue;
  const c={x,y,L,t:TOPS[y][x],st:MAP.stairs[x+","+y]||null,props:[],blocked:false};
  cells.push(c); grid[y][x]=c;
}
for(const [x,y,name] of MAP.props){const c=grid[y]?.[x]; if(!c) continue; c.props.push(name); if(BLOCKING.has(name)) c.blocked=true;}
for(const c of cells) if(c.t==="w"){c.water=true;c.blocked=true;}  // вода: по ней не ходят
const cellAt=(x,y)=> (x>=0&&y>=0&&x<W&&y<D)?grid[y][x]:null;
const walkZ=c=> c.water ? c.L-0.3 : c.st ? c.L+0.5 : c.L;  // вода чуть ниже берега
// места из карты должны стоять на суше
{ const land=p=>p&&cellAt(p[0],p[1])&&!cellAt(p[0],p[1]).water;
  if(MAP.hut&&[[0,0],[1,0],[0,1],[1,1]].some(([a,b])=>!land([MAP.hut[0]+a,MAP.hut[1]+b]))) MAP.hut=null;
  if(MAP.npc&&!land(MAP.npc)) MAP.npc=null;
  if(!land(MAP.start)){ const c=cells.find(c=>!c.water&&!c.blocked)||cells[0]; MAP.start=[c.x,c.y]; } }
   // высота поверхности, по которой идёт герой

// ---------- Камера и поворот ----------
let rot=0, rotTarget=0, anim=null, ca=1, sa=0;
const SKY=getComputedStyle(document.documentElement).getPropertyValue("--sky").trim()||"#a99ad6";
let scale=2, panX=0, panY=0, follow=true, showGrid=false, hover=null;
function setRot(r){rot=r; const a=r*Math.PI/2; ca=Math.cos(a); sa=Math.sin(a);}
// точка карты (X,Y от центра в клетках, Z в уровнях) -> мировые пиксели
const proj=(X,Y,Z)=>{const u=X*ca-Y*sa, v=X*sa+Y*ca; return [(u-v)*HW, (u+v)*HH-(Z-1)*LH]};
const depthOf=(X,Y)=>{const u=X*ca-Y*sa, v=X*sa+Y*ca; return u+v};
const quarter=()=>((Math.round(rot)%4)+4)%4;
const rotQ=(v,q)=>{let [a,b]=v;for(let i=0;i<q;i++)[a,b]=[-b,a];return [a,b]};

// ---------- Герой ----------
const hero={x:MAP.start[0], y:MAP.start[1], z:0, path:[], facing:"se", phase:0, moving:false};
hero.z=walkZ(cellAt(hero.x,hero.y));
let marker=null; // {x,y,t,ok}
const HERO_SPEED=2.8; // клеток в секунду

// поиск пути: A* по 8 направлениям, подъём/спуск не больше 1 уровня
function canStep(a,b){ return b && !b.blocked && Math.abs(walkZ(a)-walkZ(b))<=1; }
function findPath(sx,sy,tx,ty){
  const start=cellAt(sx,sy), goal=cellAt(tx,ty); if(!start||!goal) return null;
  const key=c=>c.y*W+c.x, open=[[0,start]], g=new Map([[key(start),0]]), prev=new Map();
  const h=c=>{const dx=Math.abs(c.x-goal.x), dy=Math.abs(c.y-goal.y); return Math.max(dx,dy)+0.414*Math.min(dx,dy)};
  while(open.length){
    let bi=0; for(let i=1;i<open.length;i++) if(open[i][0]<open[bi][0]) bi=i;
    const [,cur]=open.splice(bi,1)[0];
    if(cur===goal) break;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy) continue;
      const nb=cellAt(cur.x+dx,cur.y+dy); if(!canStep(cur,nb)) continue;
      if(dx&&dy){ // по диагонали — только если оба боковых прохода свободны
        const s1=cellAt(cur.x+dx,cur.y), s2=cellAt(cur.x,cur.y+dy);
        if(!canStep(cur,s1)||!canStep(cur,s2)||!canStep(s1,nb)||!canStep(s2,nb)) continue;
      }
      const cost=g.get(key(cur))+(dx&&dy?1.414:1)+Math.abs(walkZ(nb)-walkZ(cur))*0.3;
      if(cost<(g.get(key(nb))??1e9)){g.set(key(nb),cost);prev.set(key(nb),cur);open.push([cost+h(nb),nb]);}
    }
  }
  if(!prev.has(key(goal)) && start!==goal) return null;
  const path=[goal]; while(path[0]!==start) path.unshift(prev.get(key(path[0])));
  return smooth(path.map(c=>[c.x,c.y]));
}
// прямая видимость между точками: клетки проходимы и без обрывов
function clearLine(a,b){
  const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])*6);
  let prevC=cellAt(Math.round(a[0]),Math.round(a[1]));
  for(let i=1;i<=n;i++){
    const t=i/n, px=a[0]+(b[0]-a[0])*t, py=a[1]+(b[1]-a[1])*t;
    // запас 0.3 клетки по бокам, чтобы не цеплять деревья
    for(const [ox,oy] of [[0,0],[0.3,0.3],[-0.3,-0.3],[0.3,-0.3],[-0.3,0.3]]){
      const c=cellAt(Math.round(px+ox),Math.round(py+oy));
      if(!c||c.blocked) return false;
    }
    const c=cellAt(Math.round(px),Math.round(py));
    if(c!==prevC){ if(!canStep(prevC,c)) return false; prevC=c; }
  }
  return true;
}
// сглаживание: идём по прямой, где можно (как в Lineage 2)
function smooth(pts){
  const out=[pts[0]]; let i=0;
  while(i<pts.length-1){
    let j=pts.length-1;
    while(j>i+1 && !clearLine(pts[i],pts[j])) j--;
    out.push(pts[j]); i=j;
  }
  return out.slice(1);
}
function goTo(c){
  if(!c) return;
  stopFishing(); stopChopping(); closeDialog(); hero.pendingTalk=false; hero.pendingAction=null; building=null; hero.target=null;
  if(fainting) return;
  if(typeof c==="object"&&c.kind==="wolf"){ if(placing) return; attackWolf(c); return; }
  if(placing){ if(c&&typeof c==="object") placeFireAt(c); return; }
  if(typeof c==="object"&&c.fire){ goAdjacent(c,()=>openFireMenu(c.fire),"go_fire"); return; }
  if(c==="merchant"||c.merchHere||c.stall){ goTrade(); return; }
  if(c==="npc"||c==="hut"||c.hutPart||c.npcHere){ goTalk(); return; }
  if(c.water){ goFish(c); return; }
  if(treeName(c)){ goChop(c); return; }
  let target=c;
  if(c.blocked){ // кликнули по дереву — идём к ближайшей свободной клетке рядом
    let best=null,bd=1e9;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const n=cellAt(c.x+dx,c.y+dy); if(!n||n.blocked) continue;
      const d=Math.hypot(n.x-hero.x,n.y-hero.y); if(d<bd){bd=d;best=n}
    }
    if(!best){marker={x:c.x,y:c.y,t:0,ok:false};return}
    target=best;
  }
  const from=[Math.round(hero.x),Math.round(hero.y)];
  const p=findPath(from[0],from[1],target.x,target.y);
  if(!p){marker={x:c.x,y:c.y,t:0,ok:false};say("blocked");return}
  // первая точка — текущая позиция героя (он может стоять между клетками)
  hero.path=p.length?p:[[target.x,target.y]];
  marker={x:target.x,y:target.y,t:0,ok:true};
  follow=true; document.getElementById("follow").setAttribute("aria-pressed","true");
  say("going","going_sub",{x:target.x,y:target.y,h:target.L,kind:"#"+(target.st?"k_st":"k_"+target.t)});
}
function updateHero(dt){
  hero.moving=false;
  if(hero.path.length){
    const [tx,ty]=hero.path[0], dx=tx-hero.x, dy=ty-hero.y, dist=Math.hypot(dx,dy);
    const step=HERO_SPEED*dt;
    if(dist<=step){hero.x=tx;hero.y=ty;hero.path.shift(); if(!hero.path.length){marker=null;if(!hero.target) say("arrived","arrived_sub",{x:tx,y:ty});
      if(hero.pendingFish){const w=hero.pendingFish.water; hero.pendingFish=null; startFishing(w);}
      if(hero.pendingChop){const t=hero.pendingChop.tree; hero.pendingChop=null; startChopping(t);}
      if(hero.pendingTalk){hero.pendingTalk=false; openDialog();}
      if(hero.pendingAction){const fn=hero.pendingAction; hero.pendingAction=null; fn();}}}
    else{hero.x+=dx/dist*step;hero.y+=dy/dist*step}
    if(dist>0.001){
      hero.moving=true;
      // направление на экране с учётом поворота
      const u=dx*ca-dy*sa, v=dx*sa+dy*ca, sx=u-v, sy=u+v;
      hero.facing=(sy>=0?"s":"n")+(sx>=0?"e":"w");
    }
  }
  hero.phase = hero.moving ? hero.phase+dt*HERO_SPEED*Math.PI*1.6 : 0;
  const c=cellAt(Math.round(hero.x),Math.round(hero.y));
  if(c) hero.z += (walkZ(c)-hero.z)*Math.min(1,dt*14);  // мягкий шаг на ступеньку
}

// ---------- Отрисовка ----------
const cv=document.getElementById("cv"), mainCtx=cv.getContext("2d");
let ctx=mainCtx;
const spriteLayer=document.createElement("canvas"), spriteCtx=spriteLayer.getContext("2d");
const dprNow=()=>window.devicePixelRatio||1;
// Кадр собирается в буфере 1:1 в «игровых» пикселях, потом выводится на экран одной картинкой.
// Так между плитками не бывает щелей, и ничего не мерцает, когда камера едет.
const buf=document.createElement("canvas"), bufCtx=buf.getContext("2d");
let RS=1, ROX=0, ROY=0;
function worldTransform(){ctx.setTransform(RS,0,0,RS,ROX,ROY)}

// порядок отрисовки: дальние клетки раньше; герой — после «своей» клетки
let hutAnchor=null;
function drawOrder(){
  for(const c of cells) c.depth=depthOf(c.x-MX,c.y-MY);
  cells.sort((a,b)=>a.depth-b.depth || (a.x-a.y)-(b.x-b.y));
  if(HUT) hutAnchor=HUT.cells.reduce((a,b)=>b.depth>a.depth?b:a);
  // герой рисуется после самой ближней к камере клетки из тех, на которых он стоит
  let anchor=null;
  for(const [ox,oy] of [[0,0],[.45,0],[-.45,0],[0,.45],[0,-.45]]){
    const c=cellAt(Math.round(hero.x+ox),Math.round(hero.y+oy));
    if(c&&(!anchor||c.depth>anchor.depth)&&Math.abs(walkZ(c)-hero.z)<1.2) anchor=c;
  }
  return anchor;
}

// клетка попадает на экран? (с запасом на деревья вверх и стенки вниз)
function cellVisible(c){
  const p=proj(c.x-MX,c.y-MY,c.L), x=p[0]+ROX, y=p[1]+ROY, w=ctx.canvas.width, h=ctx.canvas.height;
  return x>-80 && x<w+80 && y+c.L*LH+50>0 && y-140<h;
}
function stairSprite(dir,q){
  const [a,b]=rotQ(STAIR_DIR[dir],q);
  if(a===-1) return "stairs_left";
  if(b===-1) return "stairs_right";
  const back=a===1?"stairs_back_left":"stairs_back_right";
  return img[back]?back:"block_stone_path";
}

function drawSprites(anchor){
  worldTransform(); ctx.imageSmoothingEnabled=false;
  const q=quarter();
  for(const c of cells){
    if(c!==anchor&&c!==hutAnchor&&c!==NPCC&&c!==MERCHC&&!cellVisible(c)) continue;
    const X=c.x-MX, Y=c.y-MY;
    for(let z=0;z<c.L;z++){
      if(c.water&&z===c.L-1) continue;
      const p=proj(X,Y,z+1), top=z===c.L-1;
      const name=top?TOP_SPRITE[c.t]:(z<2?"block_rock":"block_grass");
      ctx.drawImage(img[name],Math.round(p[0]-HW),Math.round(p[1]-HH-TOP_Y));
    }
    if(c.st){const p=proj(X,Y,c.L+1); ctx.drawImage(img[stairSprite(c.st,q)],Math.round(p[0]-HW),Math.round(p[1]-HH-TOP_Y));}
    if(c.water){ drawWater(c); drawWaterFx(c); if(c.pier) drawMarketProp(c.pier,c); }
    if(c.leaves.length) drawLandedLeaves(c);
    if(c.fire) drawFire(c);
    if(c.stump) drawStump(c);
    if(c.props.length){
      const p=proj(X,Y,c.L);
      for(const name of c.props){
        if(MARKET_PROPS.test(name)){ drawMarketProp(name,c); continue; }
        let n=name; if(q%2===1){ if(n==="fence_left") n="fence_right"; else if(n==="fence_right") n="fence_left"; }
        drawProp(img[n],n,p[0],p[1],c);
      }
    }
    if(c===anchor) drawHero();
    if(HUT&&c===hutAnchor) drawHut();
    if(npc&&c===NPCC) drawNPC();
    if(merch&&c===MERCHC) drawMerchant();

let T=0, windOn=!matchMedia("(prefers-reduced-motion: reduce)").matches;
const WIND=[1,-0.45];                         // направление ветра на карте (не зависит от поворота камеры)
const SWAY={tree_big:4, tree_small:3, bush:1, grass_tuft:1.5, grass_tuft_2:1.5};
// сила ветра 0..1: спокойный фон + порывы
function windAt(t){
  const g=Math.sin(t*0.45)*0.6+Math.sin(t*0.17+1)*0.5+Math.sin(t*1.1+2)*0.2;
  return Math.max(0,Math.min(1,0.3+0.7*Math.max(0,g)));
}
// куда ветер дует на экране (по горизонтали), с учётом поворота карты
function windScreenX(){const u=WIND[0]*ca-WIND[1]*sa, v=WIND[0]*sa+WIND[1]*ca; return (u-v)/1.45}
// отклонение верхушки в пикселях для объекта в клетке (x,y): порыв идёт по карте волной
function swayAt(x,y,amp){
  if(!windOn) return 0;
  const w=windAt(T-(x+y)*0.12);
  return amp*(windScreenX()*w*(0.65+0.35*Math.sin(T*2.6+x*1.7+y*1.3)) + 0.25*Math.sin(T*1.3+x*2.1+y*0.7));
}
// рисует декор; деревья и трава гнутся полосками по 3 px (ствол на месте, крона сильнее)
function drawProp(im,name,px,py,c){
  if(name.startsWith("tree")){
    if((c.falling||c.grow<1)&&drawTreeSpecial(im,px,py,c)) return;
    if(c.shake>0) px+=Math.round(Math.sin(c.shake*70)*2*(c.shake/0.3));
  }
  const x0=Math.round(px-im.width/2), y0=Math.round(py-im.height+4), amp=SWAY[name]||0;
  if(!amp||!windOn){ ctx.drawImage(im,x0,y0); return; }
  const s=swayAt(c.x,c.y,amp), base=im.height-4, strip=3;
  for(let r=0;r<im.height;r+=strip){
    const h=Math.min(strip,im.height-r), k=Math.max(0,(base-r)/base), off=Math.round(s*Math.pow(k,1.6));
    ctx.drawImage(im,0,r,im.width,h,x0+off,y0+r,im.width,h);
  }
}

const LEAF_COLORS=[["#b8e05a","#4f7f22"],["#e8c848","#8a6418"],["#f0a040","#8a4a14"],["#d86a30","#7a3010"],["#9fd050","#3f6f1a"]];
function updateWind(dt){
  if(!windOn) return;
  const w=windAt(T);
  // срываем листья с крон: чем сильнее ветер, тем чаще
  for(const tr of TREES){
    if(leaves.length>260) break;
    if(tr.c.grow<0.6||tr.c.falling) continue;
    if(Math.random()<dt*(0.2+1.2*w*w)){
      leaves.push({x:tr.c.x+(Math.random()-.5)*0.7, y:tr.c.y+(Math.random()-.5)*0.7,
        z:walkZ(tr.c)*LH+(tr.big?50+Math.random()*50:38+Math.random()*38),
        ph:Math.random()*6.28, spin:3+Math.random()*4, fall:9+Math.random()*7,
        col:LEAF_COLORS[(Math.random()*LEAF_COLORS.length)|0], drift:0.6+Math.random()*0.6});
    }
  }
  for(let i=leaves.length-1;i>=0;i--){
    const L=leaves[i], wl=windAt(T-(L.x+L.y)*0.12);
    L.ph+=dt*L.spin;
    // по ветру + покачивание поперёк (лист «планирует»)
    const flut=Math.sin(L.ph)*0.35;
    L.x+=(WIND[0]*wl*L.drift + WIND[1]*flut*0.5)*dt;
    L.y+=(WIND[1]*wl*L.drift - WIND[0]*flut*0.5)*dt;
    L.z-=(L.fall*(0.7+0.5*Math.abs(Math.sin(L.ph))))*dt;
    const c=cellAt(Math.round(L.x),Math.round(L.y)), gz=c?walkZ(c)*LH:-80;
    if(L.z<=gz){
      leaves.splice(i,1);
      if(c&&(!c.blocked||c.water)&&c.leaves.length<8) c.leaves.push({x:L.x,y:L.y,col:L.col,life:5+Math.random()*4,w:1+(Math.random()*2|0)});
    }
  }
  for(const c of cells) for(let i=c.leaves.length-1;i>=0;i--){ c.leaves[i].life-=dt; if(c.leaves[i].life<=0) c.leaves.splice(i,1); }
  // штрихи ветра в сильный порыв
  if(w>0.55&&streaks.length<10&&Math.random()<dt*3*(w-0.5)){
    const c=cells[(Math.random()*cells.length)|0];
    streaks.push({x:c.x-2, y:c.y+1, z:walkZ(c)*LH+15+Math.random()*45, t:0, life:1+Math.random()*0.6, len:10+Math.random()*12});
  }
  for(let i=streaks.length-1;i>=0;i--){const s=streaks[i]; s.t+=dt; s.x+=WIND[0]*2.6*dt; s.y+=WIND[1]*2.6*dt; if(s.t>=s.life) streaks.splice(i,1);}
}
// листья, лежащие на клетке (рисуются сразу после земли клетки)
function drawLandedLeaves(c){
  for(const L of c.leaves){
    const p=proj(L.x-MX,L.y-MY,walkZ(c)); ctx.globalAlpha=Math.min(1,L.life/1.5);
    const x=Math.round(p[0]), y=Math.round(p[1]);

  }

}
// летящие листья и штрихи ветра — поверх сцены
function drawWindFx(){
  if(!windOn) return;
  worldTransform();
  for(const L of leaves){
    // лист кувыркается: ширина 1..4 px, снизу тёмная кромка
    const p=proj(L.x-MX,L.y-MY,L.z/LH), w=1+Math.round(Math.abs(Math.sin(L.ph))*3), x=Math.round(p[0]-w/2), y=Math.round(p[1]);

  for(const s of streaks){

  }

const hash=(x,y,k)=>{const s=Math.sin(x*127.1+y*311.7+k*74.7)*43758.5453;return s-Math.floor(s)};
const DIRS4=[[1,0],[0,1],[-1,0],[0,-1]];
const EDGE_CORNERS=[[1,2],[2,3],[3,0],[0,1]]; // какие углы ромба образуют сторону +x, +y, -x, -y
function drawWater(c){
  const Z=walkZ(c), X=c.x-MX, Y=c.y-MY, e=0.52;
  const shore=DIRS4.some(([dx,dy])=>{const n=cellAt(c.x+dx,c.y+dy);return !n||!n.water});
  const q=[proj(X-e,Y-e,Z),proj(X+e,Y-e,Z),proj(X+e,Y+e,Z),proj(X-e,Y+e,Z)];
  ctx.fillStyle=shore?"#4a95d4":"#3c84c8";
  ctx.beginPath();ctx.moveTo(...q[0]);for(let i=1;i<4;i++)ctx.lineTo(...q[i]);ctx.closePath();ctx.fill();
  // блики: короткие светлые черточки медленно плывут и мерцают
  for(let k=0;k<4;k++){
    const hx=hash(c.x,c.y,k), hy=hash(c.x,c.y,k+9);
    const u=(((hx+T*0.05*(k%2?1:-1))%1)+1)%1;
    const p=proj(X-0.42+0.84*u, Y-0.42+0.84*hy, Z), a=Math.max(0,Math.sin(T*1.7+hx*20))*0.75;
    ctx.fillStyle=`rgba(205,238,255,${a})`; ctx.fillRect(Math.round(p[0]-2),Math.round(p[1]),3+(k%2)*2,1);
  }
  // пена у берега
  const cr=[proj(X-.5,Y-.5,Z),proj(X+.5,Y-.5,Z),proj(X+.5,Y+.5,Z),proj(X-.5,Y+.5,Z)];
  DIRS4.forEach(([dx,dy],i)=>{
    const n=cellAt(c.x+dx,c.y+dy); if(n&&n.water) return;
    const [a,b]=EDGE_CORNERS[i], al=0.35+0.3*Math.sin(T*2.2+c.x*1.3+c.y*0.7+i);
    ctx.strokeStyle=`rgba(235,248,255,${al})`; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(cr[a][0],cr[a][1]+1); ctx.lineTo(cr[b][0],cr[b][1]+1); ctx.stroke();
  });
}

  if(!got.length){el.innerHTML=`<b>${tr("catch_title")}</b><div class="empty">${tr("catch_empty")}</div>`;return}

    return `<div class="slot" title="${n}"><img alt="${n}" src="${ICONS[f.id].toDataURL()}"><span>${inv[f.id]}</span></div>`}).join("")+'</div>';

const waitTime=()=>(rodLevel>=2?1.2+Math.random()*2.3:2+Math.random()*4)*fishSpeed()*((inv.bait||0)>0?0.6:1);
function pickFish(){
  const wf=f=>f.w*(rodLevel>=2?({shchuka:2.2,gold:2.5,boot:0.4}[f.id]||1):1)*((inv.bait||0)>0?({shchuka:1.6,gold:2,boot:0.5}[f.id]||1):1);
  let r=Math.random()*FISH.reduce((a,f)=>a+wf(f),0);
  for(const f of FISH){ if((r-=wf(f))<=0) return f; } return FISH[0];
}

let fishing=null;            // {water, state, t, timer, bx, by, fish}
const ripples=[], floats=[];
function stopFishing(){ fishing=null; hero.pendingFish=null; }
// клик по воде: идём к ближайшему берегу рядом с этой клеткой
function goFish(w){
  const shore=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const n=cellAt(w.x+dx,w.y+dy); if(n&&!n.blocked) shore.push(n);
  }
  // вода позади героя — штраф: так видно и лицо героя, и поплавок
  const score=n=>Math.hypot(n.x-hero.x,n.y-hero.y)+(depthOf(w.x-MX,w.y-MY)<depthOf(n.x-MX,n.y-MY)-0.1?4:0);
  shore.sort((a,b)=>score(a)-score(b));
  for(const n of shore){
    const p=findPath(Math.round(hero.x),Math.round(hero.y),n.x,n.y);
    if(!p) continue;
    hero.path=p.length?p:[[n.x,n.y]]; hero.pendingFish={water:w};
    marker={x:w.x,y:w.y,t:0,ok:true};
    follow=true; document.getElementById("follow").setAttribute("aria-pressed","true");
    say("go_fish");
    return;
  }
  marker={x:w.x,y:w.y,t:0,ok:false}; say("no_water");
}
function faceTo(x,y){
  const dx=x-hero.x, dy=y-hero.y, u=dx*ca-dy*sa, v=dx*sa+dy*ca;
  hero.facing=((u+v)>=0?"s":"n")+((u-v)>=0?"e":"w");
}
function startFishing(w){
  marker=null;
  // заброс подальше от берега: точка на 1.5–2 клетки от героя в сторону воды, если там тоже вода
  let bx=w.x+(Math.random()-.5)*0.3, by=w.y+(Math.random()-.5)*0.3;
  const dx=w.x-hero.x, dy=w.y-hero.y, d=Math.hypot(dx,dy)||1;
  for(const dist of [2,1.7,1.4]){
    const tx=hero.x+dx/d*dist+(Math.random()-.5)*0.3, ty=hero.y+dy/d*dist+(Math.random()-.5)*0.3, c=cellAt(Math.round(tx),Math.round(ty));
    if(c&&c.water&&Math.abs(tx-c.x)<0.4&&Math.abs(ty-c.y)<0.4){bx=tx;by=ty;break;}
  }
  fishing={water:w,state:"cast",t:0,timer:0,bx,by};
  say("casting");
}
function catchFish(){
  if(!fishing||fishing.state!=="bite") return;
  const f=fishing; f.fish=pickFish(); f.state="reel"; f.t=0;
  for(let i=0;i<3;i++) ripples.push({x:f.bx,y:f.by,z:walkZ(f.water),t:-i*0.12,big:true});
  say("hooked",null,{fish:"#fish_"+f.fish.id});
}
function updateFishing(dt){
  for(let i=ripples.length-1;i>=0;i--){ripples[i].t+=dt; if(ripples[i].t>1.4) ripples.splice(i,1);}
  for(let i=floats.length-1;i>=0;i--){floats[i].t+=dt; if(floats[i].t>1.8) floats.splice(i,1);}
  if(!fishing) return;
  const f=fishing; f.t+=dt; faceTo(f.bx,f.by);
  const z=walkZ(f.water);
  if(f.state==="cast"&&f.t>=0.55){
    f.state="wait"; f.t=0; f.timer=waitTime(); ripples.push({x:f.bx,y:f.by,z,t:0});
    say("waiting","waiting_sub");
  } else if(f.state==="wait"){
    if(Math.random()<dt*0.6) ripples.push({x:f.bx,y:f.by,z,t:0,small:true});
    if(f.t>=f.timer){ f.state="bite"; f.t=0; f.timer=1.4+Math.random()*0.6; ripples.push({x:f.bx,y:f.by,z,t:0});
      say("bite","bite_sub"); }
  } else if(f.state==="bite"&&f.t>=f.timer){
    floats.push({key:"lost",col:"#ffb4a0",t:0});
    f.state="wait"; f.t=0; f.timer=waitTime(); say("lost_st");
  } else if(f.state==="reel"&&f.t>=0.75){
    inv[f.fish.id]=(inv[f.fish.id]||0)+1; if(inv.bait){ inv.bait--; if(!inv.bait) delete inv.bait; } renderInv();
    if(f.fish.id!=="boot") prog.st.fish++; addXP(f.fish.id==="gold"?10:f.fish.id==="boot"?1:f.fish.id==="shchuka"?4:2,"fish");
    floats.push({key:"plus",p:{n:1,fish:"#fish_"+f.fish.id},col:f.fish.id==="gold"?"#ffd66b":f.fish.id==="boot"?"#d8c0a8":"#ffffff",t:0});
    say("caught","caught_sub",{fish:"#fish_"+f.fish.id});
    f.state="pause"; f.t=0;
  } else if(f.state==="pause"&&f.t>=0.9){
    startFishing(f.water);
  }
}
// панель рыбалки: «Подсечь!» только во время поклёвки, «Смотать удочку» — пока рыбачим
let uiState=null;
function syncFishUI(){
  const st=fishing?fishing.state:null;
  if(st!==uiState){
    uiState=st;
    document.getElementById("fishbar").hidden=!st;
    document.getElementById("hook").hidden=st!=="bite";
  }
  if(st==="bite") document.getElementById("hookTime").style.width=Math.max(0,1-fishing.t/fishing.timer)*100+"%";
}
// где сейчас поплавок на воде (во время ожидания и поклёвки)
function bobberOnWater(){
  const f=fishing; if(!f||(f.state!=="wait"&&f.state!=="bite")) return null;
  const b=proj(f.bx-MX,f.by-MY,walkZ(f.water));
  if(f.state==="bite") return {x:b[0]+(Math.sin(T*25)>0?1:0), y:b[1]+2, under:Math.sin(T*9)>0.2};
  return {x:b[0], y:b[1]+Math.round(Math.sin(T*3)*0.7), under:false};
}
function drawBobber(x,y,under){
  const bx=Math.round(x), by=Math.round(y);
  ctx.fillStyle="#1b1528"; ctx.fillRect(bx-2,by-3,5,5);
  ctx.fillStyle="#e8402c"; ctx.fillRect(bx-1,by-2,3,2);
  if(!under){ ctx.fillStyle="#ffffff"; ctx.fillRect(bx-1,by,3,1); }
  else { ctx.fillStyle="#4a95d4"; ctx.fillRect(bx-2,by,5,2); }
}
// круги и поплавок, которые лежат на этой клетке воды
function drawWaterFx(c){
  for(const r of ripples){
    if(r.t<0||cellAt(Math.round(r.x),Math.round(r.y))!==c) continue;
    const k=r.t/1.4, rad=(r.small?0.05:0.08)+k*(r.big?0.5:r.small?0.18:0.32), a=(1-k)*(r.small?0.4:0.7);
    ctx.beginPath();
    for(let i=0;i<=20;i++){const an=i/20*Math.PI*2, p=proj(r.x-MX+Math.cos(an)*rad,r.y-MY+Math.sin(an)*rad,r.z); i?ctx.lineTo(...p):ctx.moveTo(...p);}
    ctx.strokeStyle=`rgba(230,246,255,${a})`; ctx.lineWidth=1; ctx.stroke();
  }
  if(fishing&&cellAt(Math.round(fishing.bx),Math.round(fishing.by))===c){
    const b=bobberOnWater(); if(b) drawBobber(b.x,b.y,b.under);
  }
}
// линия по пикселям (чёткая в пиксель-арте)
function pixLine(x0,y0,x1,y1,col){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  const dx=Math.abs(x1-x0), dy=-Math.abs(y1-y0), sx=x0<x1?1:-1, sy=y0<y1?1:-1; let err=dx+dy;
  ctx.fillStyle=col;
  for(let i=0;i<400;i++){ ctx.fillRect(x0,y0,1,1); if(x0===x1&&y0===y1) break; const e2=2*err; if(e2>=dy){err+=dy;x0+=sx} if(e2<=dx){err+=dx;y0+=sy} }
}
function drawFishing(){
  worldTransform(); ctx.imageSmoothingEnabled=false;
  const [fx,fy]=proj(hero.x-MX,hero.y-MY,hero.z);
  if(fishing){
    const f=fishing, dir=hero.facing[1]==="e"?1:-1, z=walkZ(f.water);
    const hand=[fx+dir*6, fy-20];
    let tip=[fx+dir*17, fy-37];
    if(f.state==="cast"&&f.t<0.2) tip=[fx-dir*5, fy-41];            // замах назад
    if(f.state==="bite") tip=[fx+dir*18, fy-31+(Math.sin(T*40)>0?1:0)]; // удочку тянет
    if(f.state==="reel"&&f.t<0.4) tip=[fx+dir*9, fy-43];             // подсечка вверх
    const b=proj(f.bx-MX,f.by-MY,z);
    const onW=bobberOnWater(); let bob=onW?[onW.x,onW.y]:[b[0],b[1]];
    if(f.state==="cast"){ const k=Math.max(0,(f.t-0.2)/0.35); bob=k<=0?tip:[tip[0]+(b[0]-tip[0])*Math.min(1,k), tip[1]+(b[1]-tip[1])*Math.min(1,k)-Math.sin(Math.min(1,k)*Math.PI)*22]; }
    if(f.state==="reel"||f.state==="pause") bob=tip;
    pixLine(hand[0],hand[1]+1,tip[0],tip[1]+1,"#2a1608");   // удочка с тёмной кромкой
    pixLine(hand[0],hand[1],tip[0],tip[1],"#9a6430");
    ctx.fillStyle="#d8d0c0"; ctx.fillRect(Math.round(tip[0]),Math.round(tip[1]),1,1);
    // леска с провисом
    ctx.fillStyle="rgba(255,255,255,.75)";
    const mx=(tip[0]+bob[0])/2, my=Math.max(tip[1],bob[1])+(f.state==="bite"?-2:6);
    let px=tip[0],py=tip[1];
    for(let i=1;i<=24;i++){const t=i/24, x=(1-t)*(1-t)*tip[0]+2*(1-t)*t*mx+t*t*bob[0], y=(1-t)*(1-t)*tip[1]+2*(1-t)*t*my+t*t*bob[1];
      pixLine(px,py,x,y,"rgba(255,255,255,.7)"); px=x; py=y;}
    // поплавок
    const bx=Math.round(bob[0]), by=Math.round(bob[1]);
    if(f.state==="cast") drawBobber(bx,by,false);   // в полёте — поверх всего
    // «!» над головой
    if(f.state==="bite"){
      const ey=Math.round(fy-60-Math.abs(Math.sin(T*10))*3), ex=Math.round(fx);
      ctx.fillStyle="#1b1528"; ctx.fillRect(ex-2,ey-1,5,10);
      ctx.fillStyle="#ffd66b"; ctx.fillRect(ex-1,ey,3,5); ctx.fillRect(ex-1,ey+6,3,2);
    }
    // рыба летит из воды в руки
    if(f.state==="reel"){
      const k=Math.min(1,f.t/0.75), ic=ICONS[f.fish.id];
      const x=b[0]+(fx-b[0])*k, y=b[1]+(fy-34-b[1])*k-Math.sin(k*Math.PI)*28;
      ctx.drawImage(ic,Math.round(x-12),Math.round(y-12),24,24);
    }
  }
  // всплывающие надписи
  ctx.font="8px Silkscreen, monospace"; ctx.textAlign="center"; ctx.textBaseline="bottom";
  floats.forEach((fl,i)=>{
    const y=Math.round(fy-52-fl.t*16-i*11), a=Math.min(1,(1.8-fl.t)/0.5);
    ctx.globalAlpha=a; ctx.lineWidth=3; ctx.strokeStyle="#1b1528"; const txt=tr(fl.key,fl.p); ctx.strokeText(txt,Math.round(fx),y);
    ctx.fillStyle=fl.col; ctx.fillText(txt,Math.round(fx),y); ctx.globalAlpha=1;
  });
}


// ================= Рубка деревьев =================
const HITS={tree_big:5, tree_small:3}, LOGS={tree_big:3, tree_small:2};
const SWING=0.75, IMPACT=0.5;           // один взмах топора и момент удара (сек)
for(const c of cells) c.grow=1;
let chopping=null;                       // {tree, t, hits, cyc, struck}
const chips=[], regrow=[];
const treeName=c=>c&&c.props.find(n=>n.startsWith("tree"));
function refreshBlocked(c){ c.blocked=!!c.water||!!c.hutPart||!!c.npcHere||!!c.merchHere||!!c.stall||c.props.some(n=>BLOCKING.has(n)); }
function stopChopping(){ chopping=null; hero.pendingChop=null; }

// клик по дереву: подходим к соседней клетке (лучше — перед деревом, чтобы его было видно)
function goChop(t){
  if(t.grow<1||t.falling){ say("growing"); marker={x:t.x,y:t.y,t:0,ok:false}; return; }
  const spots=[];
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const n=cellAt(t.x+dx,t.y+dy); if(n&&!n.blocked&&Math.abs(walkZ(n)-walkZ(t))<=1) spots.push(n);
  }
  const score=n=>Math.hypot(n.x-hero.x,n.y-hero.y)+(depthOf(n.x-MX,n.y-MY)<depthOf(t.x-MX,t.y-MY)?4:0);
  spots.sort((a,b)=>score(a)-score(b));
  for(const n of spots){
    const p=findPath(Math.round(hero.x),Math.round(hero.y),n.x,n.y); if(!p) continue;
    hero.path=p.length?p:[[n.x,n.y]]; hero.pendingChop={tree:t};
    marker={x:t.x,y:t.y,t:0,ok:true};
    follow=true; document.getElementById("follow").setAttribute("aria-pressed","true");
    say("go_chop"); return;
  }
  marker={x:t.x,y:t.y,t:0,ok:false}; say("no_reach");
}
function startChopping(t){
  marker=null;
  if(!treeName(t)||t.grow<1||t.falling){ say("growing"); return; }
  chopping={tree:t,t:0,hits:0,cyc:-1,struck:false};
  say("chopping","chop_sub");
}
function hitTree(t){
  const ch=chopping; ch.hits++; t.shake=0.3;
  for(let i=0;i<9;i++) chips.push({x:t.x+(hero.x-t.x)*0.3, y:t.y+(hero.y-t.y)*0.3, z:walkZ(t)*LH+9,
    vx:(Math.random()-.5)*1.6+(hero.x-t.x)*0.6, vy:(Math.random()-.5)*1.6+(hero.y-t.y)*0.6, vz:40+Math.random()*55,
    t:0, life:0.55+Math.random()*0.35, col:["#ecd0a0","#c89858","#8a5a2a"][i%3]});
  // листья сыплются от удара
  for(let i=0;i<3;i++) if(leaves.length<300) leaves.push({x:t.x+(Math.random()-.5)*0.8,y:t.y+(Math.random()-.5)*0.8,
    z:walkZ(t)*LH+40+Math.random()*50, ph:Math.random()*6.28, spin:3+Math.random()*4, fall:12+Math.random()*8,
    col:LEAF_COLORS[(Math.random()*LEAF_COLORS.length)|0], drift:0.3});
  const name=treeName(t);
  if(ch.hits>=HITS[name]){
    t.falling={t:0,dx:t.x-hero.x,dy:t.y-hero.y,name}; netTreeGone(t);
    chopping=null;
    const n=LOGS[name]+(Math.random()<extraLogChance()?1:0); inv.wood=(inv.wood||0)+n; renderInv();
    prog.st.trees++; addXP(3,"chop");
    floats.push({key:"plus",p:{n,fish:"#fish_wood"},col:"#f0c890",t:0});
    say("felled");
  }
}
function finishFall(c){
  const name=c.falling.name; c.falling=null;
  c.props=c.props.filter(n=>!n.startsWith("tree")); refreshBlocked(c);
  const i=TREES.findIndex(tr=>tr.c===c); if(i>=0) TREES.splice(i,1);
  c.stump={t:0,big:name==="tree_big"};
  for(let k=0;k<10;k++) chips.push({x:c.x+(Math.random()-.5)*0.8,y:c.y+(Math.random()-.5)*0.8,z:walkZ(c)*LH+2,
    vx:(Math.random()-.5)*0.8,vy:(Math.random()-.5)*0.8,vz:15+Math.random()*25,t:0,life:0.7,col:"#d8d0c0",dust:true});
  if(!c.remoteFall) regrow.push({t:5+Math.random()*5});   // новое дерево сажает тот, кто срубил
  c.remoteFall=false;   // через 5–10 с где-то вырастет новое
}
// новое деревце в свободном месте на траве, подальше от героя и других деревьев
function sproutTree(){
  const onPath=c=>hero.path.some(([px,py])=>Math.round(px)===c.x&&Math.round(py)===c.y);
  const cand=cells.filter(c=>!c.water&&!c.st&&"gGd".includes(c.t)&&!c.props.length&&!c.stump&&!c.blocked
    &&Math.hypot(c.x-hero.x,c.y-hero.y)>2.5&&!onPath(c)
    &&!TREES.some(tr=>Math.abs(tr.c.x-c.x)+Math.abs(tr.c.y-c.y)<3));
  if(!cand.length){ regrow.push({t:5}); return; }
  const c=cand[(Math.random()*cand.length)|0], big=Math.random()<0.5, name=big?"tree_big":"tree_small";
  c.props.push(name); refreshBlocked(c); c.grow=0.02; c.growTime=big?45:30; TREES.push({c,big}); netTreeGrow(c,name);
  for(let i=0;i<14;i++) chips.push({x:c.x+(Math.random()-.5)*0.6,y:c.y+(Math.random()-.5)*0.6,z:walkZ(c)*LH+2,
    vx:0,vy:0,vz:25+Math.random()*45,t:0,life:1,col:["#b8f070","#ffffff","#7fd040"][i%3],spark:true});
  if(!chopping&&!fishing&&!hero.path.length) say("sprout");
}
function updateChopping(dt){
  for(let i=chips.length-1;i>=0;i--){const p=chips[i]; p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    p.vz-=(p.spark?20:160)*dt; if(p.t>p.life) chips.splice(i,1);}
  for(const c of cells){
    if(c.shake>0) c.shake=Math.max(0,c.shake-dt);
    if(c.falling){ c.falling.t+=dt; if(c.falling.t>=0.9) finishFall(c); }
    if(c.stump){ c.stump.t+=dt; if(c.stump.t>30) c.stump=null; }
    if(c.grow<1) c.grow=Math.min(1,c.grow+dt/c.growTime);
  }
  for(let i=regrow.length-1;i>=0;i--){ regrow[i].t-=dt; if(regrow[i].t<=0){ regrow.splice(i,1); sproutTree(); } }
  if(!chopping) return;
  const ch=chopping; faceTo(ch.tree.x,ch.tree.y);
  ch.t+=dt;
  const cyc=Math.floor(ch.t/SWING); if(cyc!==ch.cyc){ch.cyc=cyc;ch.struck=false;}

// дерево растёт / падает / вздрагивает (вызывается из drawProp)
function drawTreeSpecial(im,px,py,c){

    const u=c.falling.dx*ca-c.falling.dy*sa, v=c.falling.dx*sa+c.falling.dy*ca, dir=(u-v)>=0?1:-1;
    ctx.save(); ctx.translate(Math.round(px),Math.round(py)+2); ctx.rotate(dir*e*Math.PI*0.48);

function poly(pts,fill,stroke){

// коробка: видимые бока + верх; deco(n,a,b,z0,z1) — украшение на боку

function hutRoof(g){
  const {x0,x1,y0,y1,yc,Zw,Zr}=g, ov=0.22, ze=Zw-0.35;

    {n:[0,-1], pts:[[x0-ov,y0-ov,ze],[x1+ov,y0-ov,ze],[x1+ov,yc,Zr],[x0-ov,yc,Zr]]},
    {n:[0,1],  pts:[[x1+ov,y1+ov,ze],[x0-ov,y1+ov,ze],[x0-ov,yc,Zr],[x1+ov,yc,Zr]]},
  ];
  slopes.sort((a,b)=>(facesCam(a.n)?1:0)-(facesCam(b.n)?1:0));     // дальний скат — первым

function drawHutProcedural(){

// у спрайта хижины ищем нижнюю точку и центр, чтобы точно поставить на клетки
const hutBBox={};
function spriteBottom(im){
  if(hutBBox[im.src.length+"_"+im.width]) return hutBBox[im.src.length+"_"+im.width];
  const c=document.createElement("canvas"); c.width=im.width; c.height=im.height; const g=c.getContext("2d"); g.drawImage(im,0,0);
  const d=g.getImageData(0,0,im.width,im.height).data; let bottom=0, minX=im.width, maxX=0;
  for(let y=0;y<im.height;y++)for(let x=0;x<im.width;x++) if(d[(y*im.width+x)*4+3]>128){ bottom=Math.max(bottom,y); minX=Math.min(minX,x); maxX=Math.max(maxX,x); }
  return hutBBox[im.src.length+"_"+im.width]={bottom,cx:(minX+maxX)/2};
}
function drawHut(){
  worldTransform(); ctx.imageSmoothingEnabled=false;
  const q0=((Math.floor(rot+1e-6)%4)+4)%4, f=rot-Math.floor(rot+1e-6);
  const spA=img["hut_"+q0], spB=img["hut_"+((q0+1)%4)];
  if(spA&&spB){
    // точка опоры — центр основания хижины; нижний угол ромба 2×2 всегда на 34 px ниже центра
    const c=proj(HUT.hx+0.5-MX,HUT.hy+0.5-MY,HUT.Z), baseY=c[1]+34;
    const put=(sp,alpha,sxScale)=>{
      if(alpha<=0.01) return;
      const bb=spriteBottom(sp), w=sp.width*sxScale;
      ctx.globalAlpha=alpha;
      ctx.drawImage(sp,Math.round(c[0]-w/2),Math.round(baseY-bb.bottom-1),Math.round(w),sp.height);
      ctx.globalAlpha=1;
      return [Math.round(c[0]-sp.width/2),Math.round(baseY-bb.bottom-1)];
    };
    if(f<1e-3){ const xy=put(spA,1,1); HUT.spr={x:xy[0],y:xy[1],q:q0}; }
    else {
      // во время поворота — как переворот карточки: до середины текущий вид сужается, после — следующий расширяется.
      // Картинка всё время непрозрачная, поэтому ничего не мигает и не просвечивает.
      const sm=t=>t*t*(3-2*t);
      if(f<0.5) put(spA,1,1-0.42*sm(f/0.5));
      else put(spB,1,0.58+0.42*sm((f-0.5)/0.5));
      HUT.spr=null;
    }
  } else { drawHutProcedural(); HUT.spr=null; }
  if(windOn||smoke.length) drawSmoke();
}

function pickEntity(mx,my){
  const wx=(mx-panX)/scale, wy=(my-panY)/scale;
  if(npc){ const [fx,fy]=proj(npc.x-MX,npc.y-MY,npc.z); if(Math.abs(wx-fx)<=11&&wy>=fy-44&&wy<=fy+4) return "npc"; }
  if(pickMerchant(wx,wy)) return "merchant";
  if(HUT){
    const g=hutGeom(), pts=[];
    for(const x of [g.x0-0.4,g.x1+0.2])for(const y of [g.y0-0.4,g.y1+0.2])for(const z of [g.Z0,g.Zr+0.7]) pts.push(proj(x,y,z));
    const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);

}
function goTalk(){
  if(!npc) return;

  spots.sort((a,b)=>score(a)-score(b));

// ================= День и ночь =================
const DAY_LEN=420;                 // секунд на сутки (7 минут)
let clock=8/24;                    // доля суток, 0 = полночь; старт в 8:00
const hourNow=()=>clock*24;
function darkness(){               // 0 — день, 1 — глубокая ночь
  const h=hourNow();
  if(h>=7&&h<17.5) return 0;
  if(h>=17.5&&h<21) return (h-17.5)/3.5;
  if(h>=21||h<5) return 1;
  return 1-(h-5)/2;
}
function duskAmt(){                // оранжевый закат и розовый рассвет
  const h=hourNow();
  if(h>=16.5&&h<20.5) return Math.sin((h-16.5)/4*Math.PI);
  if(h>=4.5&&h<7.5) return Math.sin((h-4.5)/3*Math.PI)*0.6;
  return 0;
}
const isNight=()=>{const h=hourNow(); return h>=20.5||h<5.5;};
let wasNight=null, lastClockText="";
function updateClock(dt){
  { const nc=netClock(); clock=nc!==null?nc:(clock+dt/DAY_LEN)%1; }
  const night=isNight();
  if(wasNight!==null&&night!==wasNight){
    if(night) say("night_falls","night_sub"); else say("morning");
  }
  wasNight=night;
  const h=Math.floor(hourNow()), m=Math.floor((hourNow()-h)*60/10)*10;
  const txt=String(h).padStart(2,"0")+":"+String(m).padStart(2,"0");
  if(txt!==lastClockText){
    lastClockText=txt;
    document.getElementById("clkTime").textContent=txt;
    const dayIcon=!night&&darkness()<0.6;
    document.getElementById("clkIcon").innerHTML=dayIcon
      ?'<circle cx="12" cy="12" r="5" fill="#ffd66b"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2" stroke="#ffd66b" stroke-width="2"/>'
      :'<path d="M15 3a9 9 0 1 0 6 13A7 7 0 0 1 15 3z" fill="#e8e4ff"/>';
    document.getElementById("skipTime").textContent=tr(night?"skip_day":"skip_night");
  }
}
function skipTime(){
  clock=isNight()?6.2/24:20.4/24; netSetClock(clock);
  lastClockText="";
}

const lightCv=document.createElement("canvas"), lightCtx=lightCv.getContext("2d");
const fireflies=[];
const WOLF_EYES={"wolf_se_0":[[30,18],[34,18]],"wolf_se_1":[[40,20]],"wolf_se_2":[[32,18],[37,18]],"wolf_se_3":[[35,19]],"wolf_ne_0":[],"wolf_ne_1":[],"wolf_ne_2":[],"wolf_ne_3":[]};
function collectLights(){
  const L=[];
  for(const f of fires) if(f.fuel>0){
    const p=proj(f.c.x-MX,f.c.y-MY,f.c.L+0.8), fl=Math.sin(T*11)*3+Math.sin(T*17.3)*2;
    L.push({x:p[0],y:p[1],r:82+fl,c:"255,186,110",a:1});
  }
  if(HUT){ const p=proj(HUT.hx+0.5-MX,HUT.hy+0.9-MY,HUT.Z+1.7); L.push({x:p[0],y:p[1],r:48,c:"255,200,120",a:0.75}); }
  const hp=proj(hero.x-MX,hero.y-MY,hero.z+1.5); L.push({x:hp[0],y:hp[1],r:30,c:"170,185,255",a:0.35});
  for(const f of fireflies){ if(f.b<=0.05) continue; const p=proj(f.x-MX,f.y-MY,f.z); L.push({x:p[0],y:p[1],r:9,c:"210,255,130",a:0.55*f.b}); }
  return L;
}
function applyLighting(){
  const d=darkness(), du=duskAmt(); if(d<0.01&&du<0.01) return;
  const bw=buf.width, bh=buf.height;
  if(lightCv.width!==bw||lightCv.height!==bh){lightCv.width=bw;lightCv.height=bh;}
  let r=255,g=255,b=255; const mix=(c,t)=>{r+=(c[0]-r)*t;g+=(c[1]-g)*t;b+=(c[2]-b)*t;};
  mix([255,168,112],du*0.55); mix([58,68,138],d);
  const Lc=lightCtx; Lc.setTransform(1,0,0,1,0,0); Lc.globalCompositeOperation="source-over";
  Lc.fillStyle=`rgb(${r|0},${g|0},${b|0})`; Lc.fillRect(0,0,bw,bh);
  if(d>0.05){
    Lc.globalCompositeOperation="lighter";
    for(const li of collectLights()){
      const x=li.x+ROX, y=li.y+ROY, gr=Lc.createRadialGradient(x,y,0,x,y,li.r);
      gr.addColorStop(0,`rgba(${li.c},${li.a*d})`); gr.addColorStop(0.55,`rgba(${li.c},${li.a*d*0.45})`); gr.addColorStop(1,`rgba(${li.c},0)`);
      Lc.fillStyle=gr; Lc.fillRect(x-li.r,y-li.r,li.r*2,li.r*2);
    }
  }
  const B=bufCtx; B.save(); B.setTransform(1,0,0,1,0,0); B.globalCompositeOperation="multiply"; B.drawImage(lightCv,0,0); B.restore();
}
// после света: светлячки, светящиеся глаза волков, ореол костра
function drawNightFx(){
  const d=darkness(); if(d<0.3) return;
  worldTransform(); ctx.save();
  ctx.globalCompositeOperation="lighter";
  for(const f of fires) if(f.fuel>0){
    const p=proj(f.c.x-MX,f.c.y-MY,f.c.L+0.9), gr=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],22);
    gr.addColorStop(0,`rgba(255,150,60,${0.35*d})`); gr.addColorStop(1,"rgba(255,150,60,0)");
    ctx.fillStyle=gr; ctx.fillRect(p[0]-22,p[1]-22,44,44);
  }
  ctx.restore();
  for(const f of fireflies){ if(f.b<=0.05) continue; const p=proj(f.x-MX,f.y-MY,f.z);
    ctx.globalAlpha=f.b*d; ctx.fillStyle="#e4ff8a"; ctx.fillRect(Math.round(p[0]),Math.round(p[1]),1,1);
    ctx.globalAlpha=f.b*d*0.4; ctx.fillRect(Math.round(p[0])-1,Math.round(p[1]),3,1); ctx.fillRect(Math.round(p[0]),Math.round(p[1])-1,1,3); }
  ctx.globalAlpha=1;
  // глаза волков светятся в темноте: у спрайтов — их жёлтые пиксели, у заглушки — точка у морды
  for(const a of animals){ if(a.kind!=="wolf"||a.alpha<=0.3||!a.drawn) continue;
    const dr=a.drawn, pts=[];
    if(dr.sp){ for(const [ex,ey] of (WOLF_EYES[dr.name]||[])){ const x=dr.mirror?dr.x+Math.round(dr.sp.width/2)-ex-1:dr.x-Math.round(dr.sp.width/2)+ex; pts.push([x,dr.y-dr.sp.height+2+ey]); } }
    else { const dir=a.facing[1]==="e"?1:-1; pts.push([dr.x+dir*10,dr.y-15]); }
    for(const [x,y] of pts){
      ctx.globalAlpha=d*a.alpha; ctx.fillStyle="#fff070"; ctx.fillRect(x,y,1,1);
      ctx.globalAlpha=d*a.alpha*0.35; ctx.fillRect(x-1,y-1,3,3);
    }
  }
  ctx.globalAlpha=1;
}

function updateAnimals(dt){
  const d=darkness(), night=isNight(), day=d<0.25, P=playersForAI();
  const nearestP=(x,y)=>{let b=null,bd=1e9;for(const p of P){if(p.hp<=0)continue;const dd=Math.hypot(p.x-x,p.y-y);if(dd<bd){bd=dd;b=p;}}return [b,bd];};

    if(night){

      if(wolves.length<want){ const z=zonePick("wolf",c=>freeCell(c)&&farFromAll(c,7)&&nearestFire(c.x,c.y)[1]>6), c=z!==undefined?z:randomCell(c=>freeCell(c)&&edgeCell(c)&&farFromAll(c,8)&&nearestFire(c.x,c.y)[1]>6);

    } else for(const a of wolves){ if(a.calm||a.aggro) continue; a.leaving=true; setPath(a,randomCell(c=>freeCell(c)&&edgeCell(c))); a.speed=2.6; }

// ---- генератор случайного острова ----
function genIsland(w,d){
  let seed=(Math.random()*1e9)|0; const rnd=()=>((seed=(seed*1664525+1013904223)|0)>>>0)/4294967296;
  const noise=(cs)=>{ const gw=Math.ceil(w/cs)+2, gd=Math.ceil(d/cs)+2, g=[...Array(gd)].map(()=>[...Array(gw)].map(rnd));
    return (x,y)=>{ const fx=x/cs, fy=y/cs, x0=Math.floor(fx), y0=Math.floor(fy), tx=fx-x0, ty=fy-y0, s=t=>t*t*(3-2*t);
      const a=g[y0][x0], b=g[y0][x0+1], c=g[y0+1][x0], e=g[y0+1][x0+1];
      return (a+(b-a)*s(tx))*(1-s(ty))+(c+(e-c)*s(tx))*s(ty); }; };
  const n1=noise(Math.max(4,w/4)), n2=noise(3), n3=noise(5);
  const H=[...Array(d)].map((_,y)=>[...Array(w)].map((_,x)=>{
    const dx=(x-(w-1)/2)/(w/2), dy=(y-(d-1)/2)/(d/2), r=Math.sqrt(dx*dx+dy*dy);
    const v=n1(x,y)*0.65+n2(x,y)*0.35-r*r*0.95+0.35; return v<0.12?0:Math.max(1,Math.min(5,1+Math.floor((v-0.12)*7))); }));
  for(let it=0;it<6;it++) for(let y=0;y<d;y++) for(let x=0;x<w;x++){ if(!H[y][x]) continue;   // соседние клетки — не круче 1 уровня
    for(const [a,b] of DIRS4){ const v=H[y+b]?.[x+a]; if(v&&H[y][x]>v+1) H[y][x]=v+1; } }
  const T=[...Array(d)].map((_,y)=>[...Array(w)].map((_,x)=>{ if(!H[y][x]) return "."; const v=n3(x,y);
    return v<0.3?"d":v<0.62?(rnd()<0.5?"g":"G"):v<0.8?"G":"e"; }));
  // пруды: низкие ямки внутри острова
  const inner=(x,y)=>DIRS4.every(([a,b])=>H[y+b]?.[x+a]>0)&&[[1,1],[-1,1],[1,-1],[-1,-1]].every(([a,b])=>H[y+b]?.[x+a]>0);
  const ponds=Math.max(1,Math.round(w*d/350));
  for(let p=0;p<ponds;p++){ for(let tries=0;tries<200;tries++){ const x=1+Math.floor(rnd()*(w-2)), y=1+Math.floor(rnd()*(d-2));
      if(!H[y][x]||H[y][x]>2||!inner(x,y)) continue; const L=H[y][x], q=[[x,y]], set=[[x,y]], seen=new Set([x+","+y]); const size=4+Math.floor(rnd()*6);
      while(q.length&&set.length<size){ const [cx,cy]=q.shift(); for(const [a,b] of DIRS4){ const nx=cx+a, ny=cy+b, k=nx+","+ny;
        if(!seen.has(k)&&H[ny]?.[nx]===L&&inner(nx,ny)&&rnd()<0.8){ seen.add(k); q.push([nx,ny]); set.push([nx,ny]); } } }
      if(set.length>=3){ for(const [a,b] of set) T[b][a]="w"; break; } } }
  const land=(x,y)=>H[y]?.[x]>0&&T[y][x]!=="w", used=new Set(), mark=(x,y)=>used.add(x+","+y);
  const cx=Math.floor(w/2), cy=Math.floor(d/2), near=(f)=>{ let best=null,bd=1e9; for(let y=0;y<d;y++)for(let x=0;x<w;x++){ if(!f(x,y)) continue; const dd=Math.hypot(x-cx,y-cy)+rnd()*0.5; if(dd<bd){bd=dd;best=[x,y];} } return best; };
  const start=near((x,y)=>land(x,y)); mark(...start);
  const hut=near((x,y)=>[[0,0],[1,0],[0,1],[1,1]].every(([a,b])=>land(x+a,y+b)&&H[y+b][x+a]===H[y][x]&&!used.has((x+a)+","+(y+b)))&&Math.hypot(x-start[0],y-start[1])>3);
  if(hut) for(const [a,b] of [[0,0],[1,0],[0,1],[1,1],[2,0],[2,1],[0,2],[1,2]]) mark(hut[0]+a,hut[1]+b);
  const npc=hut?near((x,y)=>land(x,y)&&!used.has(x+","+y)&&Math.abs(x-hut[0]-0.5)<=2.5&&Math.abs(y-hut[1]-0.5)<=2.5):null; if(npc) mark(...npc);
  let merchant=null, stall=null, pier=null;
  for(let y=0;y<d&&!merchant;y++) for(let x=0;x<w&&!merchant;x++){ if(!land(x,y)||used.has(x+","+y)) continue;
    const wn=DIRS4.find(([a,b])=>T[y+b]?.[x+a]==="w"), ln=DIRS4.find(([a,b])=>land(x+a,y+b)&&!used.has((x+a)+","+(y+b))&&!(wn&&a===-wn[0]&&b===-wn[1]));
    if(wn&&ln){ merchant=[x,y]; pier=[x+wn[0],y+wn[1],wn[0]?"pier_right":"pier_left"]; stall=[x+ln[0],y+ln[1],ln[0]?"stall_left":"stall_right"]; } }
  if(!merchant){ merchant=near((x,y)=>land(x,y)&&!used.has(x+","+y)&&Math.hypot(x-start[0],y-start[1])>4); }
  if(merchant) mark(...merchant); if(stall) mark(stall[0],stall[1]);
  const props=[];
  const keep=[start,npc,merchant,hut&&[hut[0]+0.5,hut[1]+0.5]].filter(Boolean);   // вокруг жилья и NPC — свободно
  const nf=noise(4);   // деревья растут рощами, а не равномерно
  for(let y=0;y<d;y++) for(let x=0;x<w;x++){ if(!land(x,y)||used.has(x+","+y)||keep.some(p=>Math.hypot(x-p[0],y-p[1])<2.3)) continue; const r=rnd(), t=T[y][x], grove=nf(x,y)>0.6;
    if(t==="e"&&r<0.1) props.push([x,y,r<0.04?"rock_big":"rock_small"]);
    else if(grove&&r<0.22) props.push([x,y,r<0.1?"tree_big":"tree_small"]);
    else if(r<0.025) props.push([x,y,"tree_small"]);
    else if(r<0.05) props.push([x,y,"bush"]); else if(r<0.07) props.push([x,y,"rock_small"]); else if(r<0.14) props.push([x,y,rnd()<0.5?"grass_tuft":"grass_tuft_2"]); }
  return {levels:H.map(r=>r.join("")),tops:T.map(r=>r.join("")),stairs:{},props,start,hut,npc,merchant,stall,pier};
}

    if(!r){ r={kind:"player",peer:p.peer,x,y,z:num(pr.z,0,12,1),phase:0,chatSeen:null,chatAt:0,isNew:true}; remotes.set(p.peer,r); if(NET.myPeer) say("player_joined"); }

    r.hp=num(pr.hp,0,HP_MAX,HP_MAX); r.hurt=num(pr.hurt,0,1e15,0); r.nick=nickOf(pr.n);
    r.by=p.by||(typeof pr.id==="string"&&pr.id.length<80?pr.id:null);
    r.act=pr.act&&typeof pr.act==="object"?{k:pr.act.k==="f"?"f":pr.act.k==="c"?"c":null,bx:num(pr.act.bx,-1,W,0),by:num(pr.act.by,-1,D,0),tx:num(pr.act.tx,0,W,0)|0,ty:num(pr.act.ty,0,D,0)|0}:null;
    const ch=pr.chat&&typeof pr.chat==="object"&&typeof pr.chat.t==="string"?{t:pr.chat.t.slice(0,90),ts:num(pr.chat.ts,0,1e15,0)}:null;
    if(ch&&(!r.chatSeen||r.chatSeen.ts!==ch.ts)){ r.chatSeen=ch; r.chatAt=performance.now(); }
    r.an=Array.isArray(pr.an)?pr.an.slice(0,10):null; r.bt=Array.isArray(pr.bt)?pr.bt.slice(0,6):null;
    r.lv=num(pr.lv|0,1,99,1); r.ht=Array.isArray(pr.ht)?pr.ht.slice(0,6):null; r.kl=Array.isArray(pr.kl)?pr.kl.slice(0,6):null;
    if(pr.ak===1&&!r.ak) r.akT=0; r.ak=pr.ak===1;
  }
  for(const k of [...remotes.keys()]) if(!seen.has(k)){ remotes.delete(k); const el=document.getElementById("tag-"+k); if(el) el.remove(); }

  if(taken.has(myHueIdx)){ for(let i=0;i<PLAYER_HUES.length;i++){ const k=(myHueIdx+i)%PLAYER_HUES.length; if(!taken.has(k)){ myHueIdx=k; break; } } }

function updateRemotes(dt){
  const k=Math.min(1,dt*9);
  for(const r of remotes.values()){
    if(Math.hypot(r.tx-r.x,r.ty-r.y)>3){ r.x=r.tx; r.y=r.ty; }
    r.x+=(r.tx-r.x)*k; r.y+=(r.ty-r.y)*k; r.z+=(r.tz-r.z)*k;
    r.phase=r.m?r.phase+dt*HERO_SPEED*Math.PI*1.6:0;
    if(r.ak) r.akT=((r.akT||0)+dt)%ATK_CD;
  }
  // звери от хозяина и укусы по мне
  if(NET.room&&!NET.host){
    const h=remotes.get(NET.hostPeer); if(h){ mirrorAnimals(h,dt); checkMyKills(h); }
  }
}
let lastBite={};
function mirrorAnimals(h,dt){
  const list=h.an||[], ids=new Set();
  for(const e of list){
    if(!e||typeof e!=="object") continue;
    const id=String(e.i).slice(0,20); ids.add(id);
    let a=animals.find(x=>x.nid===id);
    const kind=e.k==="w"?"wolf":"hare";
    if(!a){ a={kind,nid:id,x:num(e.x,-1,W,0),y:num(e.y,-1,D,0),z:num(e.z,0,12,1),path:[],speed:1.5,facing:"se",phase:0,think:1,alpha:0,leaving:false,state:"",attackT:1,lunge:0,howlT:0,fleeing:0}; animals.push(a); }
    a.tx=num(e.x,-1,W,a.x); a.ty=num(e.y,-1,D,a.y); a.tz=num(e.z,0,12,a.z); a.facing=FACINGS.includes(e.f)?e.f:a.facing; a.moving=e.m===1;
    a.alpha+=(num(e.a,0,1,1)-a.alpha)*Math.min(1,dt*6); a.leaving=e.lv===1;
    if(e.l===1&&a.lunge<=0){ a.lunge=0.25; }
    if(e.h===1) a.howlT=Math.max(a.howlT,0.5);
    a.hp=num(e.hp,0,WOLF_HP,WOLF_HP); if(e.hu===1) a.hurtT=Math.max(a.hurtT||0,0.12);
    if(e.dy===1){ if(!(a.dying>0)) a.dying=2.4; } else a.dying=0;
  }
  for(let i=animals.length-1;i>=0;i--){ const a=animals[i]; if(!ids.has(a.nid)) animals.splice(i,1); }
  const k=Math.min(1,dt*8);
  for(const a of animals){ if(a.tx===undefined) continue;
    if(Math.hypot(a.tx-a.x,a.ty-a.y)>3){a.x=a.tx;a.y=a.ty;}
    a.x+=(a.tx-a.x)*k; a.y+=(a.ty-a.y)*k; a.z+=(a.tz-a.z)*k;
    a.phase=a.moving?a.phase+dt*(a.kind==="wolf"?2.5:2)*4:0;
    a.lunge=Math.max(0,a.lunge-dt); a.howlT=Math.max(0,a.howlT-dt); a.hurtT=Math.max(0,(a.hurtT||0)-dt);
    if(a.dying>0) a.moving=false;
    if(a.lunge>0) a.lungeTo=[hero.x,hero.y];
  }
  for(const b of h.bt||[]){
    if(!b||b.p!==NET.myPeer) continue; const s=num(b.s,0,1e9,0);
    if(s>(lastBite[NET.hostPeer]||0)){ lastBite[NET.hostPeer]=s;
      const w=animals.filter(a=>a.kind==="wolf").sort((p,q)=>Math.hypot(p.x-hero.x,p.y-hero.y)-Math.hypot(q.x-hero.x,q.y-hero.y))[0];
      hurtHero(1,w||null); }
  }
  hero.hurtT=Math.max(0,hero.hurtT-dt);
}

    drawBobber(b[0],b[1]+Math.round(Math.sin(T*3)*0.7),false);

    ctx.fillStyle="#b8c0cc"; ctx.fillRect(12,-5,4,7); ctx.restore();
  }
}

}

// ---- 3D-режим во время поворота: сплошные грани с текстурами из спрайтов ----
const TEX={}, TN=34, SH=9;
function buildTextures(){
  const srcData=im=>{const c=document.createElement("canvas");c.width=im.width;c.height=im.height;const g=c.getContext("2d");g.drawImage(im,0,0);return g.getImageData(0,0,im.width,im.height)};
  const make=(w,h,fn,src)=>{const c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d"),o=g.createImageData(w,h);
    for(let j=0;j<h;j++)for(let i=0;i<w;i++){let [px,py]=fn(i,j);px=Math.max(0,Math.min(src.width-1,px|0));py=Math.max(0,Math.min(src.height-1,py|0));
      const si=(py*src.width+px)*4,di=(j*w+i)*4;o.data[di]=src.data[si];o.data[di+1]=src.data[si+1];o.data[di+2]=src.data[si+2];o.data[di+3]=255;}
    g.putImageData(o,0,0);return c};
  for(const n of ["block_grass","block_grass_2","block_grass_dark","block_stone_path","block_dirt","block_rock"]){
    const s=srcData(img[n]);
    TEX[n+"_top"]=make(TN,TN,(i,j)=>{const a=(i+.5)/TN,b=(j+.5)/TN;return [32+32*a-32*b,2+17*a+17*b]},s);
    TEX[n+"_L"]=make(TN,SH,(i,r)=>{const a=(i+.5)/TN;return [32*a,Math.floor(19+17*a)+1+r]},s);
    TEX[n+"_R"]=make(TN,SH,(i,r)=>{const a=(i+.5)/TN;return [63.5-32*a,Math.floor(19+17*a)+1+r]},s);
  }
}
function draw3D(anchor){

  function face(tex,p0,e1,e2){const w=tex.width,h=tex.height;
    ctx.setTransform(S*e1[0]/w,S*e1[1]/w,S*e2[0]/h,S*e2[1]/h,OX+S*p0[0],OY+S*p0[1]);
    ctx.drawImage(tex,-0.6,-0.6,w+1.2,h+1.2);}
  const SIDES=[{n:[1,0],dx:1,dy:0,ax:0,ay:1},{n:[0,1],dx:0,dy:1,ax:1,ay:0},{n:[-1,0],dx:0,dy:0,ax:0,ay:1},{n:[0,-1],dx:0,dy:0,ax:1,ay:0}];

    const X0=c.x-MX-.5, Y0=c.y-MY-.5;
    for(const sd of SIDES){
      const nu=sd.n[0]*ca-sd.n[1]*sa, nv=sd.n[0]*sa+sd.n[1]*ca; if(nu+nv<=0.001) continue;
      const nb=cellAt(c.x+sd.n[0],c.y+sd.n[1]), nh=nb?(nb.water?nb.L-1:nb.L):0, side=(nu-nv)<0?"_L":"_R", sx=X0+sd.dx, sy=Y0+sd.dy;
      for(let z=nh;z<c.L;z++){const p0=proj(sx,sy,z+1);face(TEX[(z<2?"block_rock":"block_grass")+side],p0,sub(proj(sx+sd.ax,sy+sd.ay,z+1),p0),sub(proj(sx,sy,z),p0));}
      if(c.st){const p0=proj(sx,sy,c.L+.5);face(TEX["block_stone_path"+side],p0,sub(proj(sx+sd.ax,sy+sd.ay,c.L+.5),p0),sub(proj(sx,sy,c.L),p0));}
    }

// ---- Герой: спрайты hero_<se|sw|ne|nw>_<0..3>, если есть; иначе временный пиксельный человечек ----
function drawHero(){
  if(hero.hurtT>0&&Math.floor(hero.hurtT*14)%2) return;
  const [fx,fy]=proj(hero.x-MX,hero.y-MY,hero.z);
  ctx.save(); ctx.imageSmoothingEnabled=false;
  ctx.fillStyle="rgba(20,10,40,.28)"; ctx.beginPath(); ctx.ellipse(fx,fy,9,4.5,0,0,Math.PI*2); ctx.fill();
  // цикл шага 1-2-3-2, кадр 0 — стойка
  const frame=hero.moving?[1,2,3,2][Math.floor(hero.phase/Math.PI*2)%4]:0;
  // спрайты смотрят вправо (se/ne); влево — зеркально, если нет своих sw/nw
  let hn=`hero_${hero.facing}_${frame}`, mirror=false;
  if(!img[hn]&&hero.facing[1]==="w"){ hn=`hero_${hero.facing[0]}e_${frame}`; mirror=true; }
  if(hero.atk){ const as=atkSprite(hero.facing,hero.atk.t,myHueIdx), [lx,ly]=atkLunge(hero.facing,hero.atk.t);
    if(as&&as.sp){ ctx.save(); ctx.translate(Math.round(fx)+lx,Math.round(fy)+ly); if(as.mirror) ctx.scale(-1,1); ctx.drawImage(as.sp,-Math.round(as.sp.width/2),-as.sp.height+2); ctx.restore();
      drawSlash(fx,fy,hero.facing,hero.atk.t); ctx.restore(); return; } }
  const sp=heroSprite(hn,myHueIdx);
  if(sp){ ctx.translate(Math.round(fx),Math.round(fy)); if(mirror) ctx.scale(-1,1);
    ctx.drawImage(sp,-Math.round(sp.width/2),-sp.height+2); ctx.restore();
    if(hero.atk){ ctx.save(); drawClubSwing(fx,fy,hero.facing[1]==="e"?1:-1,hero.atk.t); ctx.restore(); }
    return; }
  const front=hero.facing[0]==="s", flip=hero.facing[1]==="w"?-1:1;
  const sw=hero.moving?Math.round(Math.sin(hero.phase)*2):0, bob=hero.moving&&Math.abs(Math.sin(hero.phase))>0.7?1:0;
  ctx.translate(Math.round(fx),Math.round(fy)-bob); ctx.scale(flip,1);
  const R=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
  // контур
  const O="#1b1528";
  R(-6,-30,12,11,O); R(-7,-20,14,13,O); R(-9,-19,3,10,O); R(6,-19,3,10,O);
  R(-5,-10,5,10,O); R(0,-10,5,10,O);
  // ноги

  R(-4,-9,3,9-lL,"#3b3550"); R(-4,-2-lL,3,2,"#2a1f14");
  R(1,-9,3,9-lR,"#3b3550");  R(1,-2-lR,3,2,"#2a1f14");
  // руки
  R(-8,-18+sw,2,8,front?"#f1c27d":"#2f5fc4"); R(6,-18-sw,2,8,"#f1c27d");
  // туника и пояс
  R(-6,-19,12,11,"#3a6fd8"); R(-6,-19,12,2,"#5a8ff0"); R(-6,-11,12,2,"#6b4423"); R(-1,-11,2,2,"#ffd66b");
  // голова
  R(-5,-29,10,10,"#f1c27d");
  if(front){ R(-5,-30,10,3,"#6a3f1c"); R(-5,-27,2,3,"#6a3f1c"); R(0,-25,1,2,"#1b1528"); R(3,-25,1,2,"#1b1528"); R(1,-21,2,1,"#c98a5a"); }
  else { R(-5,-30,10,8,"#6a3f1c"); R(-5,-22,10,1,"#57321a"); }
  ctx.restore();
}

function cellQuad(c){
  const Z=walkZ(c), X=c.x-MX, Y=c.y-MY;
  return [proj(X-.5,Y-.5,Z),proj(X+.5,Y-.5,Z),proj(X+.5,Y+.5,Z),proj(X-.5,Y+.5,Z)];
}

  if(hover&&!anim){quadPath(cellQuad(hover));ctx.fillStyle="rgba(255,255,255,.16)";ctx.fill();ctx.strokeStyle="rgba(255,255,255,.85)";ctx.lineWidth=1;ctx.stroke()}
  if(marker){ // кольцо в точке назначения, лежит на земле

      const col=marker.ok?"255,214,107":"255,90,90";
      for(const k of [0,1]){
        const ph=((t*1.2+k*0.5)%1), r=0.15+ph*0.35, a=(1-ph)*0.9;
        ctx.beginPath();
        for(let i=0;i<=24;i++){const an=i/24*Math.PI*2, p=proj(X+Math.cos(an)*r,Y+Math.sin(an)*r,Z); i?ctx.lineTo(...p):ctx.moveTo(...p);}
        ctx.strokeStyle=`rgba(${col},${a})`; ctx.lineWidth=1; ctx.stroke();
      }
      ctx.beginPath();
      for(let i=0;i<=16;i++){const an=i/16*Math.PI*2, p=proj(X+Math.cos(an)*.1,Y+Math.sin(an)*.1,Z); i?ctx.lineTo(...p):ctx.moveTo(...p);}
      ctx.fillStyle=`rgba(${col},.9)`; ctx.fill();

}

// тап по кроне/стволу — это клик по дереву, а не по клетке за ним
function pickTree(mx,my){
  const wx=(mx-panX)/scale, wy=(my-panY)/scale;
  for(let i=cells.length-1;i>=0;i--){
    const c=cells[i], n=treeName(c); if(!n||c.falling) continue;
    const im=img[n], p=proj(c.x-MX,c.y-MY,c.L), s=c.grow;
    if(Math.abs(wx-p[0])<=im.width*0.38*s && wy<=p[1]+4 && wy>=p[1]+4-im.height*0.9*s) return c;
  }
  return null;
}
function pick(mx,my){
  const wx=(mx-panX)/scale, wy=(my-panY)/scale;
  // сверху вниз по порядку отрисовки: ближние клетки перекрывают дальние
  for(let i=cells.length-1;i>=0;i--){
    const q=cellQuad(cells[i]); let inside=false;
    for(let a=0,b=3;a<4;b=a++){const [xa,ya]=q[a],[xb,yb]=q[b]; if((ya>wy)!==(yb>wy)&&wx<(xb-xa)*(wy-ya)/(yb-ya)+xa) inside=!inside;}
    if(inside) return cells[i];
  }
  return null;
}
function rotate(dir){

}
// ---------- Зум: шаги кратны плотности экрана, чтобы пиксели были ровными ----------
let zoomK=2; // сколько физических пикселей экрана на один пиксель игры
const kMin=()=>Math.max(1,Math.round(dprNow()*0.75)), kMax=()=>Math.round(dprNow()*5);
function setZoomK(k,cx,cy){
  const r=cv.getBoundingClientRect(); cx??=r.width/2; cy??=r.height/2;
  k=Math.max(kMin(),Math.min(kMax(),k)); if(k===zoomK&&scale===k/dprNow()) return;
  const ns=k/dprNow();
  panX=cx-(cx-panX)*ns/scale; panY=cy-(cy-panY)*ns/scale; scale=ns; zoomK=k;
  document.getElementById("zVal").textContent=(Math.round(scale*10)/10)+"x"; dirty=true;
}
function zoom(d,cx,cy){
  // одна ступень ≈ +50% на компьютере, на телефоне — +1 физ. пиксель
  const step=Math.max(1,Math.round(dprNow()/2));
  setZoomK(zoomK+d*step,cx,cy);
}

// ---------- Ввод: мышь и пальцы ----------
// 1 палец/мышь: тап — идти (или подсечь), протянуть — двигать карту; 2 пальца — щипок-зум и сдвиг
const pointers=new Map(); let drag=null, pinch=null;
const TAP_SLOP=()=>pointers.size&&[...pointers.values()][0].type==="touch"?12:6;
function local(e){const r=cv.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]}
function stopFollow(){follow=false;document.getElementById("follow").setAttribute("aria-pressed","false")}
cv.addEventListener("pointerdown",e=>{
  cv.setPointerCapture(e.pointerId);
  const [x,y]=local(e); pointers.set(e.pointerId,{x,y,type:e.pointerType});
  if(pointers.size===1){ drag={x,y,px:panX,py:panY,moved:false}; pinch=null; }
  else if(pointers.size===2){
    const [a,b]=[...pointers.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1, k:zoomK, mx:(a.x+b.x)/2, my:(a.y+b.y)/2, px:panX, py:panY};
    if(drag) drag.moved=true;   // второй палец — это уже не тап
    if(EDIT) edStrokeEnd();
    stopFollow();
  }
});
cv.addEventListener("pointermove",e=>{
  const [x,y]=local(e);
  if(pointers.has(e.pointerId)){ const p=pointers.get(e.pointerId); p.x=x; p.y=y; }
  if(pinch&&pointers.size>=2){
    const [a,b]=[...pointers.values()], d=Math.hypot(a.x-b.x,a.y-b.y)||1, mx=(a.x+b.x)/2, my=(a.y+b.y)/2;
    panX=pinch.px+(mx-pinch.mx); panY=pinch.py+(my-pinch.my);
    const k=Math.round(pinch.k*d/pinch.d);
    if(k!==zoomK){ setZoomK(k,mx,my); pinch.px=panX-(mx-pinch.mx); pinch.py=panY-(my-pinch.my); }
    dirty=true; return;
  }
  if(drag&&pointers.size===1){
    const dx=x-drag.x, dy=y-drag.y;
    if(!drag.moved&&Math.hypot(dx,dy)>TAP_SLOP()){drag.moved=true;cv.classList.add("drag");stopFollow()}
    if(drag.moved&&EDIT&&edPaint){   // редактор: один палец рисует, двумя — двигаем карту

    if(drag.moved){panX=drag.px+dx;panY=drag.py+dy;dirty=true;return}
  }

  if(e.pointerType==="mouse"&&!anim&&!drag){ const h=pick(x,y); if(h!==hover){hover=h;dirty=true} }
});
function endPointer(e){

  document.getElementById("zVal").textContent=(Math.round(scale*10)/10)+"x";
  panX=r.width/2-hx*scale; panY=r.height/2-(hy-14)*scale;
  requestAnimationFrame(frame);
});
</script>
